body:
  text: 出版説明金剛經是佛經中流行最廣的一部也是禪宗藉以弘揚的主要經典禪宗自梁代南天竺菩提達磨在嵩山少林寺開創始奉宋求那跋陀羅譯楞伽經為印證傳法慧可僧璨至隋唐之交四祖道信參以般若法門已稍變其體繼而五祖弘忍聚徒授課徑以金剛經為主常勸僧俗持誦唐咸亨年慧能公元六三八七一三年因鬻柴棄學不識一字由聞誦金剛經應無所住而生其心豁然感悟遠投弘忍門下作偈菩提本無樹明鏡亦非臺本來無一物何處惹塵埃直揭心性見地超羣得弘忍賞識傳授法衣後遂為禪宗六祖慧能更推重金剛經提倡頓悟不專坐禪順應了當時特定條件的社會需要禪宗因之弘大熾盛對以後的社會思想特別是宋明理學的形成和發展産生了巨大的影響故凡考察中國社會尤其唐宋以降思想文化的源流遞嬗不能不追溯到佛教禪宗和金剛經金剛經全稱金剛般若波羅密經意謂以金剛不壞之志和大智慧之心乘度彼岸佛弟子阿難記述的這篇釋迦牟尼世尊與須菩提的答問用如來説世界非世界是名世界的三段論式闡發了凡所有相皆是虛妄實相者則是非相的唯心主義認識論以及應以無上正等正覺之心阿耨多羅三藐三菩提即住即降伏其心不取於相如如不動的宗教修養理論金剛經屬於經藏般若部有後秦鳩摩羅什北魏菩提流支陳真諦隋達磨笈多唐玄奘和唐義淨六種漢譯本並傳各本題目和文字略有異同世以鳩摩羅什譯本通行金剛經得居佛藏之顯要自有其社會歷史背景抑其篇幅簡約述義深刻文字通俗亦屬重要原因歷來統治者宣揚倡導使為之注釋者不下數十百家其間薈萃衆説之集注本為數亦夥金剛經集注原有南宋紹定楊圭十七家釋義四卷後演為五十三家注四卷明御纂本拼除五十三家本中傳為梁昭明太子所作三十二分分目略減注者數家而益以三十餘種經文或注文裒成一卷清黃虞稷千頃堂書目著録有太祖集注金剛經一卷成祖御製序考本書成祖序文朕夙欽大覺仰慕真如間閲諸編選其至精至要經旨弗違者重加纂輯特命鋟梓用廣流傳可知此書為成祖自行重纂明太祖集注本今未之見但成祖另有永樂九年五月初一御製序見清鄧烜金剛經輯注轉録與本書永樂二十一年四月十七日序大異且超前十餘年或其即是專為太祖集注本所撰而本書則是將太祖集注本重加纂輯而成的修訂本明初版刻體承宋元向為藏家珍賞本書係永樂內府刻本寫刻俱精清明朗潤首末説法護法二圖出水當風可窺佛教藝術和明代版畫之一斑御製金剛般若波羅蜜經集注序朕惟佛道弘深精密神妙感通以慈悲利物以智慧覺人超萬有而獨尊歷曠劫而不壞先天地而不見其始後天地而不見其終觀之金剛般若波羅蜜經蓋可見矣是經也發三乘之奧旨啓萬法之玄論不空之空見無相之相指明虛妄即夢幻泡影而可知推極根原於我人衆壽而可見誠諸佛傳心之祕大乘闡道之宗而羣生明心見性之機括也夫一心之源本自清淨心隨境轉妄念即生如大虛起雲輒成障翳如寶鏡蒙塵隨韜光彩由此逐緣而墮幻安能返妄以歸真惟如來以無上正等正覺發慈悲至願閔凡世之沉迷念衆生之冥昧為説此經大開方便俾解粘而釋縛咸滌垢以離塵出生死途登菩提岸轉癡迷為智慧去昏暗即光明是經之功德廣矣大矣雖然法由心得非經無以寓夫法經以人傳非言無以著夫經爰自唐宋以來注釋是經者無慮數十百家雖衆説悉加於剖析而羣言莫克於折衷朕夙欽大覺仰慕真如間閲諸編選其至精至要經旨弗違者重加纂輯特命鋟梓用廣流傳俾真言洞徹祕義昭融見之者如仰日月於中天悟之者若探寶珠於滄海豈不快豈不偉嗚呼善人良士果能勤誠修習虔禮受持緣經以求法因法以悟覺即得滅無量罪愆即得獲最勝福田證果人天永臻快樂功德所及奚有涯涘謹書為序以示將來永樂二十一年四月十七日金剛般若波羅蜜經仙遊翁集英曰金剛者金中精堅者也剛生金中百煉不銷取此堅利能斷壞萬物五金皆謂之金凡止言金者謂鐵也此言金剛乃若刀劒之有鋼鐵耳譬如智慧能斷絶貪嗔癡一切顛倒之見般若者梵語梵語者西方之語也唐言智慧唐言者中國之言也𪫬體虛融照用自在故云般若梵語波羅蜜唐言到彼岸欲到彼岸須憑般若此岸者乃衆平聲生作業受苦生死輪回之地彼岸者謂諸佛菩薩究竟超脫清淨安樂之地凡夫即此岸佛道即彼岸一念惡即此岸一念善即彼岸六道如苦海六道者天人阿修羅地獄餓鬼畜生無舟而不能渡以般若六度為舟航度與渡同六度見此後陳雄解渡六道之苦海又西土俗語凡作事了辦皆言到彼岸經者徑也此經乃學佛之徑路也沖應真人周史卿作楊亞夫真讚解云鐵之為物其生在礦其成為鐵性剛而體不變火王去聲而器乃成佛之所以喻金剛也又因其兄看圓覺經以書示之曰古人有云青青翠竹總是真如鬱鬱黃花無非般若真如與翠竹一體蓋無色聲香味觸法也六塵般若與黃花一𩔫蓋無見聞覺知也陳雄曰波羅蜜有六或布施度慳貪或持戒度淫邪或忍辱度嗔恚或精進度懈退或禪㝎度散亂各占六度之一唯一般若能生八萬四千智慧則六度兼該萬行俱僃是故如來以智慧力鑿人我山以智慧因取煩惱礦以智慧火鍊成佛𪫬精金夫植善根者始而誦經終而悟理得堅固力金剛是也具大智慧般若是也度生死海登菩提岸波羅蜜是也五祖大師常勸僧俗但持金剛經即自見𪫬成佛六祖大師一夜聽五祖説法恰至應無所住而生其心言下便悟茲其所以為上乘頓教也歟顏丙曰只這一卷經六道含靈一切𪫬中皆悉具足蓋為受身之後妄為六根眼耳鼻舌身意六塵色聲香味觸法埋沒此一假靈光終日冥冥不知不覺故我佛生慈悲心願救一切衆生齊超苦海共證菩提所以在舍衛國中為説是經大意只是為人解粘去縛直下明了自𪫬自𪫬堅固萬劫不壞如金𪫬堅剛也李文會曰金剛者堅利之物能破萬物也般若者梵語也唐言智慧善破一切煩惱轉為妙用波羅蜜者梵語也唐言到彼岸不著諸相謂之彼岸若著諸相謂之此岸又云心迷則此岸心悟則彼岸經者徑也見𪫬之道路也無為軍冶父山川禪師曰法不孤起誰為安名頌曰摩訶大法王無短亦無長本來非皂白隨𩂜現青黃華發看朝𧰟林凋逐晚霜疾雷何太急迅電亦非光凡聖猶難測龍天豈度量古今人不識權立號金剛姚秦三藏鳩摩羅什奉詔譯如是我聞王日休曰是此也指此一經之所言也我者乃編集經者自謂是阿難也如是我聞者如此經之所言乃我親聞之於佛也弟子嘗問佛云他時編集經教當如何起首佛言從如是我聞起李文會曰如是我聞者如來臨涅槃日阿難問曰佛滅度後一切經首初安何字佛言初安如是我聞次顯𩂜所是故傅大士云如來涅槃日娑羅雙樹間阿難沒憂海悲慟不能前優波初請問經首立何言佛教如是者萬代古今傳若以諸大宗師言之如者衆生之𪫬萬別千差動靜不一無可比𩔫無可等倫是者只是衆生𪫬之別名離𪫬之外更無別法又云法非有無謂之如皆是佛法謂之是川禪師云如是古人道喚作如如早是變了也且道變向什麼𩂜去咄不得亂走畢竟作麼生道火不曾燒你口如如明鏡當臺萬象居是是水不離波波是水鏡水塵風不到時應現無瑕照天地我者為𪫬自在強名之也又云身非有我亦非無我不二自在名為真我又云淨裸裸赤灑灑沒可把頌曰我我認著分明成兩箇不動纖毫合本然知音自有松風和聞者聽聞也經云聽非有聞亦非無聞了無取捨名為真聞又云切忌隨他去頌曰猿啼嶺上鶴唳林間斷雲風卷水激長湍最愛晚秋霜午夜一聲新覺天寒一時佛在舍衛國祇樹給孤獨園肇法師曰一時者説此般若時也李文會曰一時者謂説理契機感應道交之時也川禪師曰一相隨來也頌曰一一破二成三從此出乾坤混沌未兮前已是一生參學畢時如魚飲水冷暖自知頌曰時時清風明月鎮相隨桃紅李白薔薇紫問著東君總不知疏鈔云佛者梵云婆伽婆唐言佛佛者覺也自覺覺他覺圓滿故一切有情咸具此道悟者即名佛迷者曰衆生李文會曰佛者梵音唐言覺也內覺無諸妄念外覺不染六塵又云佛者是教主也非相而相應身佛也相而非相報身佛也非相非非相法身佛也川禪師云佛無靣目説是非漢頌曰小名悉逹長號釋迦度人無數攝伏群邪若言他是佛自己却成魔秪把一枝無孔笛為君吹起太平歌李文會曰在者所在之𩂜也川禪師云客來須看不得放過隨後便打頌曰獨坐一爐香金文誦兩行可憐車馬客門外任他忙六祖曰舍衛國者波斯匿王所居之國祇者匿王太子祇陀樹是祇陀所施故言祇樹疏鈔云經云舍衛國有一長者名須逹拏常施孤獨貧故曰給孤獨長者因往王舍城中護長者家為男求婚見其家僃設香花云來旦請佛説法須逹聞之心生驚怖何也須逹本事外道乍聞佛名所以怕怖至來日聞佛説法心開意解欲請佛歸佛許之令須逹先歸家卜勝地惟有祇陀太子有園方廣嚴潔往白太子太子戲曰若布金滿園我當賣之須逹便歸家運金側布八十頃園並滿是以太子更不復愛其金同建精舍請佛説法曰祗樹給孤獨園李文會曰舍衛國者説經之𩂜也祇樹者祇陀太子所施之樹樹謂法林也給孤獨園者給孤長者所施之園共建立精舍也與大比丘衆千二百五十人俱僧子榮引智度論三卷云如來臨入涅奴結切槃時告阿入聲難言十二部經汝當流通復告優波離言一切律戒汝當受持阿難聞佛付囑心沒憂海時優波離尊者語阿難言汝是守護佛法藏者當問佛未來要事於是優波離尊者同阿難往問世尊四條事第一問一切經首當置何言答曰一切經首當置如是第二問以何為師答曰以波羅提木義是汝大師此云戒第三問依何而住答曰皆依四念𩂜而住四念者一觀心不淨二觀受是苦三觀法𪫬空四觀心無我第四問惡𪫬車匿如何共住答曰惡𪫬比音鼻丘以梵檀治之此云默擯梵語梵檀者猶中國言默擯默擯者正如黃魯直云萬言萬當不如一默百戰百勝不如一忍擯者敬而遠之之意此𠁅惡𪫬比丘之道也如來於是付囑言訖在俱尸羅大城娑羅雙樹間示般涅槃阿難聞佛入涅槃悶絶憂惱不能前問四事王日休曰梵語比丘此云乞士謂上乞法於諸佛以明己之真𪫬下乞食於世人以為世人種福此所以名乞士也大比丘則得道之深者乃菩薩阿羅漢之類也俱謂同𠁅也謂佛與此千二百五十人同𠁅於給孤獨園中陳雄曰比丘今之僧是也李文會曰比丘者去惡取善名小比丘善惡俱遣名大比丘也若人悟達此理即證阿羅漢位能破六賊小乘四果人也川禪師云獨掌不浪鳴頌曰巍巍堂堂萬法中王三十二相百千種光聖凡瞻仰外道歸降莫謂慈容難得見不離祇園大道場爾時世尊食時著衣持鉢王日休曰爾時者彼時也佛為三界之尊故稱世尊三界者謂欲界色界無色界也僧若訥引毗羅三昧經云早起諸天日中諸佛日西異類日暮鬼神今言食時正當午前將行乞食之時也李文會曰尓時者佛現世時也世尊者三界四生中智慧福德無有等量一切世間之所尊也食時者正當午食將辦之時也著衣者柔和忍辱衣也遺教經云慚耻之服於諸莊嚴最為第一疏鈔云著衣持鉢者著僧伽之衣即二十五條大衣也持四天王所獻之鉢入舍衛大城乞食僧若訥曰寺在城外故云入也乞食者佛是金輪王子而自持鉢乞食為欲教化衆生捨離憍慢也李文會曰乞食者欲使後世比丘不積聚財寶也於其城中次第乞已僧若訥曰不越貧從富不捨賤從貴大慈平等無有選擇故曰次第李文會曰次第者如來慈悲不擇貧富平等普化也還至本處飯食訖收衣鉢洗足已王日休曰乞食而歸故曰還至本處飯食已畢收衣鉢洗足者謂收起袈裟與鉢盂然後洗足以佛行則跣足故也李文會曰洗足已者淨身業也敷座而坐顏丙曰敷乃排布也排布高座而坐智者禪師頌曰法身本非食應化亦如然為長人天福慈悲作福田收衣息勞慮洗足離塵緣欲證三空理加趺示入禪疏鈔云三空者三輪體空也施者受者并財等名三輪也施者反觀體空本無一物故云理空受者觀身無相觀法無名身尚不有物從何受故曰受空施受既空彼此無妄其物自空故云三輪體空李文會曰敷座而坐者一切法空是也川禪師曰惺惺著頌曰飯食訖子洗足已敷座坐來誰共委向下文長知不知看看平地波濤起時長老須菩提李文會曰時者空生起問之時也長老者德尊年高也須菩提者梵語也唐言解空是也王日休曰長老謂在大衆中乃年長而老者也僧若訥曰梵語須菩提此善吉善現空生尊者初生時其家一空相師占之唯善唯吉後解空法以顯前相僧了𪫬曰須菩提人人有之若人頓悟空寂之性故名解空全空之性真是菩提故名須菩提空性出生萬法故名空生尊者空性隨緣應現利人利物亦名善現萬行吉祥亦名善吉尊者隨德應現強名五種在大衆中即從座起偏袒右肩右膝著地合掌恭敬而白佛言希有世尊李文會曰須菩提解空第一故先起問右膝著地者先淨三業摧伏身心整儀𮚏佛也合掌者心合於道道合於心也希有者我佛性能含融萬法無可比類也僧若訥曰言偏袒者此土謝過請罪故肉袒西土興敬禮儀故偏袒兩土風俗有所不同言右肩者弟子侍師示執捉之儀作用之便言右膝著地者文殊問般若經云右是正道左是邪道用正去邪將請以無相之正行王日休曰白謂啓白希少也世尊佛號也先嘆其少有次又呼佛也如來善護念諸菩薩善付囑諸菩薩王日休曰如來者佛號也佛所以謂之如來者以真性謂之真如然則如者真𪫬之謂也真性所以謂之如者以其明則照無量世界而無所蔽慧則通無量劫事而無所礙能變現為一切衆生而無所不可是誠能自如者也其謂之來者以真性能隨所而來現故謂之如來真如本無去來而謂之來者蓋謂應現於此而謂之來也若人至誠禱告則有感應若欲為一切衆生設化則現色身皆其來者也此佛所以謂之如來然則言如如者乃真性之本體也言來者乃真性之應用也是則如來二字兼佛之體用而言之矣此經所以常言如來也梵語菩薩本云菩提薩埵音朵欲略其文而便於稱呼故云菩薩梵語菩提此云覺梵語薩埵此云有情有情則衆生也一切衆生有佛𪫬者皆有生而有情唯菩薩在有情之中乃覺悟者故謂之覺有情也大略言之情則妄想也菩薩未能絶盡其情想唯修至佛地則情想絶矣故佛獨謂之覺而不謂之有情佛言一切諸佛解脫諸想盡無餘故是也佛又云十一地菩薩皆有二種愚癡豈非所謂愚癡者亦情想之類乎此菩薩所以謂之有情而不得獨謂之覺也陳雄曰菩薩受如來教法者也諸菩薩指大衆言之也大衆聽如來説法固當信受奉行儻如來不起慈悲心衛護眷念俾信受是法則惡魔或得以惱亂不付委囑託俾奉行是法則勝法有時而斷絶故須菩提於大衆聽法之初未遑它恤惟願如來起慈悲心為之護念付囑也李文會曰如來者如者不生來者不滅非來非去非坐非臥心常空寂湛然清淨也善護念者善教諸人不起妄念也諸菩薩者諸者不一之義菩之言照薩之言見照見五蘊皆空謂色受想行識也菩薩者梵語也唐言道心衆生常行恭敬乃至鱗甲羽毛蛆蟲螻蟻悉起敬愛之心不生輕慢此佛所謂蠢動含靈皆有佛𪫬也善付囑者念念精進勿令染著前念才著後念即覺勿令接續也川禪師曰如來不措一言須菩提便恁麼讚歎具眼勝流試著眼看頌曰隔墻見角便知是牛隔山見煙便知是火獨坐巍巍天上天下南北東西鑽龜打瓦咄世尊善男子善女人發阿耨多羅三藐三菩提心李文會曰善男子者正定心也善女人者正慧心也謂有剛斷決定之心永無退轉也發心之義阿者無也無諸垢染也耨多羅者上也三界無能比也三者正也正見也藐者遍也一切有情無不遍有三菩提者知也知一切有情皆有佛𪫬也王日休曰梵語阿此云無梵語耨多羅此云上梵語三此云正梵語藐此云等梵語菩提此云覺然則阿耨多羅三藐三菩提者乃無上正等正覺也謂真𪫬也真𪫬即佛也梵語佛此云覺故略言之則謂之覺詳言之則謂之無上正等正覺也以真𪫬無得而上之故云無上然上自諸佛下至蠢動此𪫬正相平等故云正等其覺圓明普照無偏無虧故云正覺得此𪫬者所以為佛所以超脫三界不復輪回僧若訥曰菩薩初修行皆發此廣大心也云何應住云何降伏其心王日休曰應當也云言也云何者言如何也須菩提於此問佛云為善之男子或女人發阿耨多羅三藐三菩提心謂求真𪫬成佛之心也發求真𪫬成佛之心云何應住謂當住於何處也云何降伏其心謂當如何降伏此妄想心也僧若訥曰須菩提正發此二問一問衆生發無上心欲求般若云何可以安住諦理二問降伏惑心云何可以折攝散亂一經所説不出此降住而已李文會曰云何降伏其心者須菩提謂凡夫妄念煩惱無邊當依何法即得調伏川禪師曰這問從甚處出來頌曰你喜我不喜君悲我不悲思飛塞北無憶舊巢歸秋月春花無限意箇中只許自家知佛言善善須菩提如汝所説如來善護念諸菩薩善付囑諸菩薩汝今諦聽當為汝説李文會曰如汝所説者是佛𮚏歎須菩提能知我意善教諸人不起妄念心常精進勿令染著諸法相也諦聽者諦者名了汝當了達聲塵本來不生勿逐語言詳審而聽也王日休曰諦審也謂仔細聽也善男子善女人發阿耨多羅三藐三菩提心應如是住如是降伏其心唯然世尊願樂欲聞李文會曰應如是住者如來欲令衆生之心不生不滅湛然清淨即能見𪫬也龐居士曰世人重珍寶我貴剎那靜金多亂人心靜見真如𪫬逍遙翁曰凡夫之心動而昏聖人之心靜而明又云凡人心境清淨是佛國淨土心境濁亂是魔國穢土也黃蘖禪師曰凡夫多被境礙心事礙理常欲逃境以安心屏事以存理不知乃是心礙境理礙事但令心空境自空理寂事自寂勿倒用心也又云凡夫取境智者取心心境雙亡乃是真法亡境猶易亡心至難人不敢亡心恐落於空無撈摸處不知空本無空唯一真法界耳凡夫皆逐境生心遂生欣厭若欲無境當亡其心心亡則境空境空則心滅若不亡心而但除境境不可除秪益紛擾故萬法惟心心亦不可得既無所得便是究竟何必區區更求解脫也如是降伏其心者若見自𪫬即無妄念既無妄念即是降伏其心矣唯者應諾之辭然者協望之謂願樂欲聞者欣樂欲聞其法也陳雄曰唯者諾其言也然者是其言也顏丙曰發阿耨多羅三藐三菩提心唐言謂無上正等正覺心也應者當也住者乃常住不滅也須菩提問有向善男女發菩提心者應當如何得常住不滅如何能降伏其心佛稱善善乃讚歎之辭發菩提心者應如是住如是降伏其心如是者只這是也唯然者乃須菩提領諾之辭與曾子曰唯無異樂者愛也願愛欲聞説法也智者禪師頌曰希有希有佛妙理極泥洹此云寂滅一覽集入滅品云能事既畢入泥洹舍利以留為佛事云何降伏住降伏住為難二儀法中妙孚上座曰法身之理猶若太虛堅窮三際橫亘十方綸八極包括二儀所謂包括二儀者與此二儀法中妙之意同三乘教喻寬法華經三卷佛言乘是三乘便得快樂自求涅槃是名聲聞乘樂獨善寂是名辟支佛乘度脫一切是名大乘善今諦聽六賊免遮攔川禪師云往往事從叮囑生頌曰七手八腳神頭鬼靣棒打不開刀割不斷閻浮跳躑幾千回頭頭不離空王殿佛告須菩提諸菩薩摩訶薩應如是降伏其心李文會曰摩訶薩者摩訶言大心量廣大不可測量乃是大悟人也所有一切衆生之類六祖曰一切者總標也次下別列九類王日休曰凡有生者皆謂之衆生上自諸天下至蠢動不免乎有生故云一切衆生也衆生雖無數無窮不過九種下文所言是李文會曰衆生者謂於一切善惡凡聖等見有取捨心起無量無邊煩惱妄想輪回六道是也古德曰覺華有種無人種心火無煙日日燒謂諸愚迷之人被諸煩惱則熙熙然此非悟道其實如木偶耳若或中根之士而以煩惱為苦是則智慧不如愚癡也不亦謬乎固當勿存于心苟或不然學道何用於己何益須令智慧力勝之可也若卵生若胎生若濕生若化生若有色若無色若有想若無想若非有想非無想六祖曰卵生者迷𪫬也胎生者習𪫬也濕生者隨邪𪫬也化生者見趣𪫬也迷故造諸業習故常流轉隨邪心不定見趣墮阿鼻平聲起心修心妄見是非內不契無相之理名為有色內心守直不行恭敬供養但言直心是佛不修福慧名為無色不了中道眼見耳聞心想思惟愛著法相口説佛行心不依行名為有想迷人坐禪一向除妄不學慈悲喜捨智慧方便猶如木石無有作用名為無想不著二法想故名若非有想求理心在故名若非無想王日休曰若卵生者如大而金翅鳥細而蟣虱是也若胎生者如大而獅象中而人小而貓鼠是也若濕生者如魚鱉黿鼉以至水中極細蟲是也若化生者如上而天人下而地獄中而人間米麥果實等所生之蟲皆是也上四種謂欲界衆生若有色者色謂色身謂初禪天至四禪天諸天人但有色身而無男女之形已絶情欲也此之謂色界若無色界者謂無色界諸天人也此在四禪天之上唯有靈識而無色身故名無色界若有想者此謂有想天諸天人也此天人唯有想念故自此已上皆謂之無色界不復有色身故也若無想者此謂無想天諸天人也在有想天之上此天人一念寂然不動故名無想天若非有想非無想者此謂非想非非想天諸天人也此天又在無想天之上其天人一念寂然不動故云非有想然不似木石而不能有想故云非無想此天於三界諸天為極高其壽為極長不止於八萬劫而已李文會曰若卵生者貪著無明迷暗包覆也若胎生者因境來觸遂起邪心也若濕生者才起惡念即墮三塗謂貪嗔癡因此而得也若化生者一切煩惱本自無根起妄想心忽然而有也又教中經云一切衆生本自具足隨業受報故無明為卵生煩惱包𮖐為胎生愛水浸為濕生歘起煩惱為化生也又云眼耳鼻舌回光內燭有所貪漏即墮四生謂胎卵濕化是也色聲香味回光內燭無所貪漏即證四果謂須陀洹等是也傅大士曰空生初請問善逝應機酬先答云何住次教如是修胎生卵濕化咸令悲智收若起衆生見還同著相求若有色者謂凡夫執有之心妄見是非不契無相之理若無色者執著空相不修福慧若有想者眼見耳聞遂生妄想口説佛行心不依行若無想者坐禪除妄猶如木石不習慈悲智慧方便若非有想者教中經云有無俱遣語默雙忘有取捨憎愛之心不了中道也臨濟禪師曰入凡入聖入染入淨處處現諸國土盡是諸法空相是名真正見解你若愛聖憎凡生死海裏浮沉也非無想者謂有求理心也我皆令入無餘涅槃而滅度之李文會曰我者佛自謂也皆者總也令者俾也入者悟入也無餘者真常湛寂也法華經云佛當為除斷令盡無有餘涅槃者菩薩心無取捨如大月輪圓滿寂靜衆生迷於涅槃無相之法而為生死有相之身也滅者除滅度者化度也六祖曰如來指示三界九地各有涅槃妙心令自悟入無餘者無餘習氣煩惱也涅槃者圓滿清淨義令滅盡一切習氣不生方契此也度者渡生死大海也佛心平等普願與一切衆生同入圓滿清淨無想涅槃同渡生死大海同諸佛所證也煩惱萬差皆是垢心身形無數總名衆生如來大悲普化皆令得入無餘涅槃證道歌曰達者同遊涅槃路注云涅槃者即不生不滅也涅而不生槃而不滅即無生路也沖應真人周史卿對喫不拓和尚指香煙云要觀學人有餘涅槃爐中灰即是要觀學人無餘涅槃爐中灰飛𥁞即是王日休曰梵語涅槃此云無為楞伽經云涅槃乃清淨不死不生之地一切修行者之所依歸然則涅槃者乃超脫輪回出離生死之地誠為大勝妙之所非謂死也世人不知此理乃誤認以為死大非也此無餘涅槃即大涅槃也謂此涅槃之外更無其餘故名無餘涅槃此謂上文𥁞諸世界所有九類衆生皆化之成佛而得佛涅槃也如是滅度無量無數無邊衆生實無衆生得滅度者王日休曰一切衆生皆自業緣中現故為人之業緣則生而為人修天上之業緣則生於天上作畜生之業緣則生為畜生造地獄之因緣則生於地獄如上文九類衆生無非自業緣而生者是本無此衆生也故菩薩發心化之皆成佛而得涅槃實無一衆生被涅槃者以本無衆生故也僧若訥曰第一義中無生可度即是常心也若見可度即是生滅良由一切衆生本來是佛何生可度所謂平等真法界佛不度衆生陳雄曰大乘智慧𪫬固有之然衆生不能自悟佛實開悟無量無數無邊衆生令自心中愚癡邪見煩惱衆生舉皆滅度矣滅度如是其多且曰實無衆生得滅度者蓋歸之衆生自𪫬自度何功六祖壇經云自𪫬自度名為真度淨名經云一切衆生本𪫬常滅不復更滅文殊菩薩問世尊實無衆生得滅度者如何世尊曰𪫬本清淨無生無滅故無衆生得滅度無涅槃可到此皆歸之衆生自𪫬耳華嚴經云若人欲了知三世一切佛應觀法界𪫬一切惟心造造化因心偈云賦象各由心影響無欺詐元無造化工群生自造化李文會曰無量無數無邊衆生者謂起無量無數無邊煩惱也得滅度者既已覺悟心無取捨無邊煩惱轉為妙用故無衆生可滅度也寶積經曰智者於苦樂不動如虛空逍遙翁曰善能觀察煩惱𪫬空既過即止勿使留礙也又云煩惱𪫬空勿為罣礙觀如夢幻不用介懷設使情動如響應聲即應即止何以故須菩提若菩薩有我相人相衆生相壽者相即非菩薩六祖曰修行人亦有四相心有能所輕慢衆生名我相自恃持戒輕破戒者名人相厭三塗苦願生諸天是衆生相心愛長年而勤修福業法執不忘是壽者相有四相即是衆生無四相即是佛僧若訥曰言我相者以自己六識心相續不斷於中執我此見乃計內也人相者六道外境通稱為人於此諸境一一計著分別優劣有彼有此此見從外而立故云人相如衆生相者因前識心最初投託父母續有色受想行四隂計其和合名衆生相如壽者相者計我一期命根不斷故云壽者相陳雄曰貪嗔癡愛為四惡業貪則為己私計是有我相嗔則分別爾汝是有人相癡則頑傲不遜是衆生相愛則希覬長年是壽者相如來不以度衆生為功而了無所得以其四種相盡除也圓覺經云未除四種相不得成菩提菩薩發菩提無上道心受如來無相教法豈應有四種相設若有一于此則必起能度衆生之心是衆生之見非菩薩也菩薩與衆生本無異𪫬悟則衆生是菩薩迷則菩薩是衆生有是四種相在夫迷悟如何耳何以故者辨論之辭也佛恐諸菩薩不知真空無相之説故為之辨論而有及於四種相十七分二十五分皆云顏丙曰一切衆生者涅槃經云見佛𪫬者不名衆生不見佛𪫬者是名衆生摩訶者大也佛告須菩提及大覺𪫬之人若卵胎濕化乃蠢動含靈也有形色無形色有情想無情想乃至不屬有無二境衆生體雖不同𪫬各無二此十類衆生我皆令入無餘涅槃而滅度之涅槃者不生謂涅不死謂槃經云如來證涅槃永斷於生死滅度者滅盡一切煩惱度脫生死苦海令者使也我皆使入無餘涅槃無餘者羅漢雖證涅槃尚有身智之餘經中謂之有餘涅槃唯無身智餘剩者方謂無餘涅槃又曰實無衆生得滅度者衆生既悟本𪫬空寂更滅度箇甚麼若四相未能直下頓空即非菩薩覺𪫬也傅大士頌曰空生初請問善逝應機酬善逝即世尊號先答云何住次教如是修胎生卵濕化咸令悲智收若起衆生見還同著相求李文會曰有我相者倚恃名位權勢財寶藝學攀高接貴輕貧賤愚迷之流人相者有能所心有知解心未得謂得未證謂證自恃持戒輕破戒者衆生相者謂有苟求希望之心言正行邪口善心惡壽者相者覺時似悟見境生情執著諸相希求福利有此四相即同衆生非菩薩也臨濟禪師曰五蘊身田內有無位真人堂堂顯露何不識取但於一切時中切莫間斷觸目皆是只為情生智隔想變體殊所以輪回三界受種種苦敢問諸人觸目皆是是箇甚麼一一山河無隔礙重重樓閣應時開川禪師曰頂天立地鼻直眼橫頌曰堂堂大道赫赫分明人人本具箇箇圓成秪因差一念現出萬般形復次須菩提王日休曰謂再編次佛與須菩提答問之言也此乃敘經者自謂顏丙曰復次乃再説也李文會曰復次者連前起後之辭菩薩於法應無所住行於布施疏鈔云言應無所住者應者當也無所住者心不執著李文會曰菩薩於法者總標一切空有之法也應無所住者一切諸法應當無所住著也法華經云十方國土中惟有一乘法謂一心也心即是法法即是心二乘之人不能解悟謂言心外即別有法逆生執著住於法相此同衆生之見解也逍遙翁曰凡夫不識自佛一向外求住相迷真分別他境不為助道但求福門似箭射空如人入暗俱胝和尚凡見僧來問話唯豎起一指頭佛鑑禪師頌曰不用將心向外求箇中消息有來由報言達磨西來意秪在俱胝一指頭菩薩了悟人法二空心無取捨能知凡聖一等空色一般善惡一體龍濟和尚頌曰心境頓消融方明色與空欲識本來體青山白雲中是菩薩心無所住著也行於布施者布者普也施者散也謂除我人衆生壽者四相煩惱妄想取捨憎愛之心世尊即以教法布施內破一切執著外即利益一切衆生菩薩布施皆應無住不見有我為能施人不見有它為受施者不見中間有物可施三體皆空住無所住清淨行施不愛已乏不望報恩不求果報也凡夫布施希求福利此是住相布施也永嘉大師云住相布施生天福猶如仰箭射虛空逍遙翁曰誦金剛經者若人了知住無所住心得無所得法者此名慧業若人日積課誦之功希求福利此名福業二者相去絶遠如霄壤也法華經云若於後世讀誦是經典者是人不復貪著衣服臥具飲食資生之物所願不虛張無盡云夫學道者不可以溫飽為志本求無上菩提出世間法若以事不如意為怨而圖衣飯為心者又何益於事乎所謂不住色布施不住聲香味觸法布施王日休曰色謂形色聲謂音樂香謂鼻之所聞味謂食物之味觸謂男女之欲法謂心之所校量思惟者乃教化衆生不使著於六塵也陳雄曰摩訶般若經云眼色識耳聲識鼻香識舌味識身細滑識意法識又懺法云眼著色耳著聲鼻著香舌著味身著觸細滑意著法塵起種種業此言住亦識著之謂凡夫六根不淨貪是六者以快其欲是名六塵一不如其所欲則必布施以求滿其欲其所住而布施者然也菩薩受如來無相教法無諸欲之求無能施之心但以法施利益一切衆生如水行地中無有罣礙無所住行布施者然也華嚴經云不求色聲香與味亦不希求諸妙觸但為救度諸群生常求無上最勝智正此之所謂行布施也華嚴二十四卷云眼識所知種種諸色耳識所知種種諸聲鼻識所知種種諸香舌識所知種種諸味身識所知種種諸觸意識所知種種諸法又天地八陽經云眼常見種種無盡色耳常聞種種無𥁞聲鼻常嗅種種無𥁞香舌常了種種無盡味身常覺種種無盡觸意常思想分別種種無盡法詳此二經既言種種諸聲種種無盡聲則王氏所言聲謂音樂者恐失之拘於音樂矣既言種種諸觸種種無盡觸則王氏所言觸謂男女之欲者恐失之執於男女之欲矣張無𥁞曰不住色布施者謂智慧𪫬照見一切皆空也梵語檀那此云施菩薩無色可捨名為布施如藥對病似空含有有病既除空藥俱遣色空泯絶中道皆亡了無一法可得二乘之人捨色取空為不住色而行布施玄奘法師所譯經云不住於色不住非色香味觸法一例皆然是故空有悉皆無住無空可取無有可捨空有同如一體平等平等行施即知法界不住有施不住無施不得有無二邊障礙施心廣大猶若虛空所獲功德亦復如是故經中舉十方虛空較量施福即斯意耳傅大士曰施門通六行六行束三檀資生無畏法聲色勿相干二邊純莫立中道不須安欲覔無生理皆境向心觀不住聲者清淨無罣礙也梵語尸羅此云戒二乘之人意謂聲從色起遂向聲塵中分別聞樂則喜聞悲則哀欲捨此聲而取無聲名之為戒菩薩無聲可捨色若是有聲從是生色既本空聲從何起若能如是悟者雖在生死中生死不能拘雖在六塵中六塵不能染在在𩂜𩂜心常清淨又云尸羅得清淨無量劫來因妄想如怨賊貪愛若參辰在欲而無欲居塵不染塵權依離垢地當證法王身不住香者謂見色清淨也梵語羼提此云忍辱二乘之人妄生忍辱惟恐貪著欲行遠離故名忍辱正是捨色取空不了中道也殊不知香𪫬本空菩薩忍亦無忍辱亦無辱須是自𪫬清淨不生起滅之心方始悟明心地故古德曰明心之士其心猶如明鏡能攝衆像盡入其中無有罣礙清淨含容無有邊際又云忍心如幻夢辱境若龜毛常能修此觀逢難轉堅牢無非亦無是無下亦無高欲滅貪瞋賊須行智慧刀不住味者謂衆生𪫬與如來𪫬無所分別也梵語毗離耶此云精進了知舌根本空為不住味故云受諸飲食當如服藥或好或弱不可生憎愛也肇法師曰會萬法歸于自己者其惟聖人乎朝太傅曰一切凡夫皆是迷人內有回心起信詢求妙理悟明心地者此是迷中悟人也徑山杲禪師曰佛與衆生本無異相只因迷悟遂有殊塗黃蘖禪師曰有識食有智食四大之身飢瘡為患隨順給養不生貪著謂之智食恣情取味妄生分別唯圖適口不生厭離謂之識食也三乘之人雖不住飲食之味尚猶貪著諸法之味以貪著故名為精進菩薩之心於諸法相悉如夢幻遇緣即施緣散即寂圓覺經云照了諸相猶如虛空此名如來隨順覺𪫬傅大士曰進修名地良為慧光舒二智心中遣三空境上袪無明念念滅高下執情除觀心如不間何啻至無餘不住觸者謂心無取捨也內無菩提可取外無煩惱可捨梵語禪那此云靜慮二乘之人認觸為色身色身若是有即言離諸觸色身既本無諸觸何曾有又云了觸即無生不住虛分別一切諸萬法本來無所動六祖曰一切萬法皆從心生心無所生法無所住又大陽禪師曰大陽一禪竟日如然滔滔不間觸目遇緣若能如是法法現前傅大士曰禪河隨浪靜定水逐波清澄神生覺𪫬亡慮滅迷情遍計虛分別由來假立名若了依他起無別有圓成不住法者謂照見身心法相空也梵語般若此云智慧諸法屬意意屬識此識是妄金剛三昧經云所見境界非我本識二乘之人分別諸相皆是妄識本識又何可得也菩薩了知本識究竟故無分別傅大士曰慧燈如朗日蘊界若乾城明來暗便謝無暇暫時停妄心猶未滅乃見我人形妙智圓光照惟得一空名又六波羅蜜有總頌云三大僧祇劫萬行具齊修既悟無人我長依聖道流二空方漸證三昧任遨遊創居歡喜地常樂遂亡憂臨濟禪師曰佛有六通者謂入色界不被色惑入聲界不被聲惑入香界不被香惑入味界不被味惑入身界不被觸惑入意界不被法惑所以達此六種皆是空相不能繫縛此乃無依道人雖是五蘊穢陋之身便是地行菩薩又黃蘖禪師曰本是一精明分為六和合一精明者一心也六和合者六根也各與塵合眼與色合耳與聲合鼻與香合舌與味合身與觸合意與法合中間生六識為十八界若了十八界無所有一切皆空束六和合為一精明此乃了悟之人唯有真心蕩然清淨須菩提菩薩應如是布施不住於相六祖曰應如無相心布施者為無能施之心不見有施之物不分別受施之人故云無相布施僧若訥曰應如是布施者指出色香等六塵也不住於相者乃不住六塵之相若住相布施者但是人天果報而已李文會曰菩薩應如是布施者謂捨除一切煩惱憎愛之心也然煩惱本空皆是妄見有何可捨經云一切諸有如夢如幻一切煩惱是魔是賊逍遙翁曰夫煩惱𪫬是佛境界觀煩惱𪫬空是正修行學人若止依此觀練精至不須求別法也又云夫見𪫬之人十二時中凡遇逆順境界心即安然不隨萬境所轉一任毀謗於我我即不受惡言謗黷返自歸己所謂自作自受者也譬如有人手執火炬擬欲燒天徒自疲困終不可得故古德曰心隨萬境轉轉𩂜實能幽隨流認得𪫬無喜復無憂何以故若菩薩不住相布施其福德不可思量疏鈔云何以故者此證問意施本求福今令不住於相其意云何佛答若菩薩不住相布施其福德不可思量若逹三輪體空方名不住相布施不住者心不住有為之福也三輪者施者受者并財等是三輪也施者返觀體空本無一物故云理空受者觀身無相觀法無名身尚不有物從何受故曰受空施受既空彼此無妄其物自空故曰三輪體空陳雄曰世尊答文殊曰財施為凡法施為聖蓋凡夫布施必以滿三千世界七寶為求福之具財施也此住相布施也且以人天大福報自期數盡未免輪回菩薩布施但一心清淨利益一切為大施主法施也此不住相布施也雖不徼福自然離生死苦受大快樂歷千劫而不古超三界以長今是所謂無限福德實不可思惟而量度也佛憫末世衆生被六塵染未可遽化姑誘以福德無限之説使之頓悟法施之會維摩經云當為法施之會何用是財施會為顏丙曰住者著也菩薩於佛法中應當無所著布施布施者捨施也所謂不住於色聲香味觸法布施六者謂之六塵眼貪色耳貪聲鼻貪香舌貪味情塵相對謂觸貪著有為謂法人𪫬清淨本無六根可得六塵又向什麼𩂜安頓所以佛云應當如是布施不住於相若不著相捨施其福德量等虛空非思量可及傅大士曰檀波羅蜜布施頌曰施門通六行六行即六度六行束三檀疏鈔云三檀者資生檀無畏檀法檀布施是資生檀能資益生諸善法故曰資生檀持戒忍辱是無畏檀因戒淨毀辱不動心無怖畏故曰無畏檀法檀者精進禪定智慧是也因定生慧因慧生種種法故曰法檀將此六行束為三檀資生無畏法聲色勿相干二邊純莫立中道不須安子榮曰二邊即有無二邊不立有無俱遣中道何安朝文元公曰凡夫著有不見有中之空二乘著空不見空中妙有不著見於二邊不取相於中道惟佛知見欲識無生𩂜背境向心觀尸波羅蜜持戒頌曰尸羅得清淨無量劫來因妄想如怨賊貪愛若參辰參辰即參商二星一出一沒常相遠離在欲而無欲居塵不染塵權依離垢地當證法王身圓覺經注云佛為萬法之王羼提波羅蜜忍辱頌曰華嚴六十卷羼初眼初鴈二切忍心如幻夢辱境若龜毛華嚴經云無則同於龜毛兔角常能修此觀去聲逢難轉堅牢無非亦無是無下亦無高欲滅貪嗔賊須行智慧刀毗離耶波羅蜜精進頌曰進修名地良為慧光舒二智心中遣真俗二智三空境上袪無明念念滅十二因緣法無明緣行行緣識識緣名色名色緣六入六入緣觸觸緣受受緣愛愛緣取取緣有有緣生生緣老死憂悲苦惱高下執情除觀心如不間何啻至無餘禪波羅蜜禪定頌曰禪河隨浪靜定水逐波清澄神生覺𪫬息慮滅迷情遍計虛分別由來假立名若了依他起無別有圓成華嚴合論第四卷云遍計所執𪫬依他起𪫬圓成實𪫬般若波羅蜜智慧頌曰慧燈如朗日蘊界若乾城華嚴四十二卷云龍依宮住而能興雲有人仰視所見宮殿當知是乾闥婆城子榮曰乾城者即乾闥婆城海上龍蜃化現餘氣人見樓閣忽尓還無此破衆生妄執五蘊色身為實明來暗便謝無暇暫時停妄心猶未滅乃見我人形妙智圓光照唯得一空名智者禪師萬行齊修頌曰三大僧祇劫阿僧祇數名阿者無也僧祇者數也乃無數劫萬行具齊修既悟無人我長依聖道流二空方漸證人法二空三咏任遨遊三昧梵語中國言正定亦云正見創居歡喜地常樂遂無憂李文會曰不住於相者非但見色是相一切種種分別皆名為相如是之相皆從因緣而生應知一切分別皆如夢幻遇緣即施緣散即寂是故佛言凡所有相皆是虛妄又西明和尚云法相若是有可言住諸相法相既本無故言不住相既不住相布施其福德更有何思量也逍遙翁曰須知諸法如夢如幻如影如響如水中月如鏡中像又云了逹一切法不住一切相心如虛空自然無礙心住於相即屬有法故知一切法不住一切相即能見佛𪫬也傅大士曰若論無相施功德極難量行悲濟貪乏果報勿須望凡夫情行劣初且略稱揚欲知檀狀貌如空遍十方川禪師曰若要天下行無過一藝精頌曰西川十樣錦添花色轉鮮欲知端的意北斗靣南看虛空不礙𮈔毫念所以張名大覺仙須菩提於意云何東方虛空可思量不不也世尊須菩提南西北方四維上下虛空可思量不不也世尊須菩提菩薩無住相布施福德亦復如是不可思量須菩提菩薩但應如所教住李文會曰不也世尊者須菩提謂虛空我思量之實無可思量也不可思量者既已覺悟心無能所即無我人衆生壽者四相豈更有可思量但應如所教住者謂諸學人當依佛教行無所住必得悟入也謝靈運曰聖言無謬理不可越但當如佛所教而安心耳陳雄曰佛謂所教之住與華嚴經住無所住同如來教菩薩法不過住無所住之法菩薩受如來教非敢變異但當如其所教者以無住為住𩂜楞嚴經云得住般若波羅蜜文殊般若經云佛告文殊師利當云何住般若波羅蜜文殊言以不住法為住般若波羅蜜復問云何不住法名住般若波羅蜜文殊言以無住相即住般若波羅蜜此住之法詳矣無非住無所住之意三昧經云如來所説法悉從於無住我從無住𩂜是𩂜禮如來顏丙曰四維者四隅也如東方東南方西方西北方之類東西南北及四維上下方總謂十方佛問如十方虛空可思量不須菩提答不可思量蓋大莫大於十方虛空佛所以借此喻福德也傅大士頌云欲知檀狀貌如空遍十方佛云菩薩無住相布施福德亦復如是虛空不可思量測度菩薩當如佛所指教𩂜住佛教所謂住者湛若十方空無所住而住又頌曰若論無相施功德極難量行悲濟貧乏果報不須望平聲凡夫情行去聲劣初且略稱揚欲知檀狀貌如空遍十方川禪師曰可知禮也頌曰虛空境界豈思量大道清幽理更長但得五湖風月在春來依舊百花香須菩提於意云何可以身相見如來不寶積如來解曰如來真身本無生滅湛然常住託隂受形同凡演化入神母胎擐胡貫切此凡相各別故云若見諸相非相即見如來頌曰凡相滅時𪫬不滅真如覺體離塵埃了悟斷常根果別此名佛眼見如來王日休曰此如來乃謂真𪫬之佛也佛呼須菩提而問之云可以用三十二相見真𪫬之佛否不也世尊不可以身相得見如來王日休曰此須菩提言否也而又呼世尊云不可以身相得見如來是其言否也者乃大略言之下乃詳言之也李文會曰不可以身相得見如來者須菩提謂色身即有相法身即無相色身者地水火風假合成人法身者即無形假相貌色身即是凡夫法身即是如來須菩提以凡夫但以色身不見法身故答是語何以故如來所説身相即非身相王日休曰此如來謂色身佛也須菩提又自問何故不可以身相見如來乃自答云如來所説身相非是真實故云即非身相謂無有真實身相也李文會曰如來所説身相即非身相者非者無色凡夫謂色身是有執著修行所以不見佛𪫬生死轉重如來法身無相故言所説身相非身相也華嚴經云佛以法為身清淨如虛空故雲門大師云我當時若見一棒打殺與狗子喫者此大乘先覺之人解粘去縛遣疑破執也黃蘖禪師曰夫學道人若欲得知要訣但莫於心上著一物佛真法身猶若虛空此謂法身即虛空虛空即法身常人謂法身遍虛空𩂜虛空中含容法身不知法身即虛空虛空即法身也虛空與法身無異相佛與衆生無異相生死與涅槃無異相煩惱與菩提無異相離一切相即名諸佛也川禪師曰且道只今行住坐臥是什麼相休瞌睡頌曰身在海中休覔水日行山嶺莫尋山鶯啼燕語皆相似莫問前三與後三佛告須菩提凡所有相皆是虛妄若見諸相非相即見如來陳雄曰須菩提欲人人見自𪫬佛所以有即非身相之説色身是相中無真實之體故云皆是虛妄法身非相却有真如本體寓乎其中若見諸相非相是見色身中有法身見自𪫬中有如來而如來豈可外求即吾𪫬見矣壇經云佛即是𪫬離𪫬無別佛顏丙曰佛問可以身相見如來不須菩提答不可如來者乃自𪫬不屬去來也四大色身本由妄念而生若執虛妄身相而欲見如來之𪫬譬如認賊為子終無是𩂜所以佛告須菩提云凡所有相皆是虛妄若見諸相非相即見如來若能回光返照得見身相無形可得即是見自𪫬如來李文會曰凡所有相皆是虛妄者虛則不實妄則不真既不真實相即非相又云非獨佛身相即無相凡所有相皆是虛妄色身有相故言虛妄法身無相故言非相也若見諸相非相即見如來者言身虛妄即是人空言非相者即是法空若悟人法二空即見自𪫬法華經云一切諸相皆悉空寂又云或見菩薩觀諸法𪫬無有二相猶如虛空傅大士頌曰如來舉身相為順世間情恐人生斷見權且立虛名假言三十二八十也空聲大藏一覽集示生品曰菩薩以四月八日因母晝寢以示其夢從右脅入夫人夢覺自知身重菩薩住胎十月滿足四月八日菩薩化從右脅而生自行七𡵯舉其右手作師子吼天上天下唯我獨尊九龍空中吐清淨水灌太子身三十二相八十種好放大光明普照三千大千世界即名太子為悉逹多漢言頓吉有身非覺體無相乃真形川禪師曰山是山水是水佛在甚麼𩂜頌曰有相有求俱是妄無形無見墮偏枯堂堂密密何曾間一道寒光爍太虛須菩提白佛言世尊頗有衆生得聞如是言説章句生實信不佛告須菩提莫作是説如來滅後後五百歲有持戒修福者於此章句能生信心以此為實陳雄引華嚴經云信為道源功德母長養一切諸善法智度論云佛法大海信為能入蓋實信者實諦之階也須菩提疑衆生不能生實信故作此問而佛恐沮衆生實信之心且告之以莫作是説僧若訥曰持戒者諸惡莫作修福者衆善奉行夫持戒修福者即種善根者也李文會曰得聞如是言説章句生實信不者須菩提謂前説無相行於布施即是因深得見無相如來即是果深既談因果切恐如來滅後濁劫惡世之中無人聽信故有是問傅大士曰因深果亦深理密奧難尋當來末法後惟慮法將沉空生情未逹聞義恐難任如能信此法定是覺人心有持戒修福者不著諸相即是持戒心常空寂無諸妄念即是修福此人不被諸境所惑能生信心以此為實慈受禪師云念念常空寂日用有大力此是三世諸佛行履𩂜六代祖師行履𩂜無功之功功不虛棄川禪師曰金佛不度爐木佛不度火泥佛不度水頌曰三佛形儀總不真眼中瞳子靣前人若能信得家中寶啼鳥山花一樣春當知是人不於一佛二佛三四五佛而種善根已於無量千萬佛所種諸善根李文會曰不於一佛二佛者謂一劫一佛出世也種種善根者世間種種善事不可勝計大槩止是諸惡莫作衆善奉行是也法華經云隨宜方便事無復諸疑惑心生大歡喜自知當作佛傅大士曰依它非自立必假衆緣成日謝樹無影燈來室乃明六祖曰何謂種諸善根所謂於諸佛所一心供養隨順教法於諸菩薩善知識師僧父母耆年宿德尊長之𩂜常行恭敬供養承順教命不違其意是名種諸善根於一切貧苦衆生起慈愍心不生輕厭有所須求隨力惠施是名種諸善根於一切惡類自行柔和忍辱歡喜逢迎不逆其意令彼發歡喜心息剛戾心是名種諸善根於六道衆生不加殺害不欺不賤不毀不辱不騎不箠不食其肉常行饒益是名種諸善根王日休曰何謂種善根乎至誠稱其佛號或拈香一炷或為一拜或以一物供養皆謂之種善根僧若訥曰顯其已多種善根者見佛多聞法多修行多也聞是章句乃至一念生淨信者須菩提如來悉知悉見是諸衆生得如是無量福德六祖曰信心者信般若波羅蜜能除一切煩惱信般若波羅蜜能成就一切出世功德信般若波羅蜜能出生一切諸佛信自身佛𪫬本來清淨無有染污與諸佛𪫬平等無二信六道衆生本來無相信一切衆生盡得成佛是名淨信心也李文會曰乃至一念生淨信者謂凡夫於諸法中起一切善惡凡聖等見有取捨心種種妄念不能生淨信者菩薩了悟人法二空無諸妄念心常清淨聽信其法故言一念生淨信也傅大士頌曰信根生一念諸佛盡能知修因於此日證果未來時三大經多劫六度久安施熏成無漏種阿毗逹磨論云漏者令心連注流散不絶故名為漏僧問清平和尚曰如何是有漏平曰笊籬僧曰如何是無漏平曰木杓方號不思議李文會曰得如是無量福德者此謂如來知見衆生無諸妄念心常清淨敬信其法所得智慧勝妙功德不可測量川禪師曰種甘草甜種黃連苦作如是因獲如是果又曰種瓜得瓜種果得果頌曰一佛二佛千萬佛各各眼橫兼鼻直昔年曾種善根來今日依前得渠力須菩提須菩提著衣喫飯尋常事何須特地却生疑何以故是諸衆生無復我相人相衆生相壽者相無法相亦無非法相李文會曰無復我人衆生壽者相者謂不倚恃名位權勢財寶藝學精進持戒輕貧賤愚癡懈怠破戒之流無能所知解之心無苟求希望之心言行相應也無法相者經云心生則一切法生心滅則一切法滅心既清淨諸法皆空故無取捨一切善惡凡聖等見諸法相也亦無非法相者謂不著能知解心不作有所得心無人無法內明實相外應虛緣也肇法師曰無法相者明法非有遣著有心也亦無非法相者明法非無遣著無心也僧若訥曰法相者有見也非法相者無見也捨二邊之著故云無也圜悟禪師曰伶俐漢腳跟須點地脊梁要硬似鐵遊人間世幻視萬緣把住作主不徇人情截斷人我脫去知解直下以見𪫬成佛直指妙心為階梯及至作用外應虛緣不落窠臼辦一片長久守寂淡身心於塵勞中透脫去乃善之又善者也川禪師曰圓同太虛無欠無餘頌曰法相非法相開拳復成掌浮雲散碧空萬里天一樣何以故是諸衆生若心取相即為著我人衆生壽者若取法相即著我人衆生壽者何以故若取非法相即著我人衆生壽者李文會曰心若取相即起妄念故著我人衆生壽者相也圜悟禪師曰諸佛開示祖師直指唯心妙𪫬徑截承當不起一念透頂透底於見成際不勞心力任運逍遙了無取捨乃真蜜印也逍遙翁曰有念無覺凡人境界有念有覺賢人境界無念有覺聖人境界智者可了知説則難為説黃蘖禪師謂裴丞相曰佛與衆生唯止一心更無差別此心無始以來無形無相不曾生不曾滅當下便是動念即乖猶如虛空無有邊際唯此一心即便是佛佛與衆生更無別異但是衆生著相外求求之轉失使佛覔佛將心捉心窮劫盡形終無所得不知息念忘慮佛自現前此心即是佛佛即是衆生為衆生時此心不滅為諸佛時此心不添遇緣即施緣散即寂不假修證本自具足若不決定信此是佛縱使纍劫修行終不成道取法相者謂言心外有法故著諸相也慈受禪師曰順天門外古招提爛熳春光照錦溪物物更無心外法箇中能有幾人知逍遙翁云欲外安和但內寧靜心虛境寂念起法生水濁波昏潭清月朗修行之要靡出于斯黃蘖禪師曰造惡造善皆是著相著相造惡枉受輪回著相造善枉受勞苦都總不如便自認取本心心外無法此心即法法外無心將心無心心却成有一切在我默契而已若取非法相者謂有取捨善惡凡聖等相也傅大士曰人空法亦空一相本來同遍計虛分別依他礙不通圓成沉識海流轉若飄蓬圓成之理墮在識海流轉生死有若飄蓬欲識無生理心外斷行蹤是不著諸法相也是故不應取法不應取非法李文會曰不應取法不應取非法者此謂有無俱遣語默雙亡若取法相即有法執若取非法相即有空執有執則煩惱熾然無執則信心清淨傅大士頌曰有因名無號無相有馳名有無無別體有之與無本無各別之體無有有無形有無之形本來無有有無無自𪫬有無之間無此自𪫬妄起有無情有無之情人自妄起有無如谷響勿著有無聲川禪師曰金不金水不洗水頌曰得樹攀枝未足奇懸崖撒手丈夫兒水寒夜冷魚難覔留得空船載月歸以是義故如來常説汝等比丘知我説法如筏喻者法尚應捨何况非法王日休曰筏謂編竹木成牌以渡人乃過水之具亦船之類也以是義理之故乃指上文所言之意也佛嘗謂汝等比丘當知我之説法如船筏之譬喻是未渡之時不可無船筏喻若未了悟真𪫬之時不可無佛法也既渡之後則不須船筏喻既了悟真𪫬之後即不須佛法也如此則既悟之後佛法尚當捨去則非佛法而為外道法者尤當捨去故云法尚應捨何況非法傅大士頌曰渡河須用筏到岸不須船此言盡之矣僧若訥曰筏喻經云若解筏喻者善法尚捨何況不善法如欲濟川先應取筏至彼岸已捨而去之顏丙曰法相屬有非法相屬無乃兩頭見直須截斷是故不應取法不應取非法以此義故如來常説汝等比丘知我説法如筏喻者筏乃大船也譬如人未渡河須假船筏既到彼岸當離其筏不可執著也人未出生死愛河須假佛法方得度脫法亦當捨所以趙州道佛之一字吾不忍聞佛法尚應捨何況非佛法李文會曰執有説空因何用筏有執既喪空説奚存既已渡河那更存筏傅大士曰渡河須用筏到岸不須船人法知無我悟理詎勞筌中流仍被溺誰論在二邊子榮曰存心中道尚被流溺中道不立二邊何安有無如取一即被污心田且未見𪫬之時在於生死海中遇善知識教以言説分別法相得見自𪫬不可更執著也法尚應捨何況非法者經云若人欲識佛境界當淨其意如虛空外無一法而建立法尚應捨何況非法乎川禪師曰水到渠成頌曰終日忙忙那事無妨不求解脫不樂天堂但能一念歸無念高𡵯毗盧頂上行須菩提於意云何如來得阿耨多羅三藐三菩提耶如來有所説法耶須菩提言如我解佛所説義無有定法名阿耨多羅三藐三菩提亦無有定法如來可説僧若訥曰空生領解佛旨乃云第一義中無有定實之法可得亦無有定實之法可説陳雄曰楞伽經論七種空有曰一切法離言説空第一義聖智大空如來了真空之妙固無法可得亦無法可説是以設為之問無上菩提乃第一義深妙難名或持戒忍辱而得之或精進禪定而得之或聚沙為或稱南無皆已得之豈可拘以定法而名之如來憫衆生之未悟安得默然而離説或為志求勝法者説或為求無上慧者説或為求聲聞者説傳心法要曰自聲教而悟者為聲聞或為求辟支佛者説法華經曰樂獨善寂是名辟支佛乘應機而酬隨即而答寧有定法耶佛盡變通之義無執無著須菩提兩言無有定法非能解佛所説義乎李文會曰如來有所説法耶者佛所問意恐謂如來有所説也無有定法者根器有利鈍學𪫬有淺深隨機設教對病用藥法華經云諸根利鈍精進懈怠隨其所堪而為説法是故法無定相迷悟懸殊若未悟時似無所得若悟了時似有所得得與不得皆是妄見但不可執著自契中道豈有定法可説耶川禪師曰寒即言寒熱即言熱頌曰雲起南山雨北山驢名馬字幾千般請看浩渺無情水幾處隨方幾處圓何以故如來所説法皆不可取不可説非法非非法謝靈運曰非法則不有非非法則不無有無並無理之極也王日休曰此法為衆生而設非有真實之法故云非法然亦假此以開悟衆生又不可全謂之非法故云非是非法也陳雄曰如來所説者無上菩提法也可以𪫬修而不可以色相取徒取則何以深造於𪫬理之妙可以心傳而不可以口舌説徒説則何以超出於言意之表須菩提所以辨論兩言其不可也是法也妙玄通深不可識一以為有耶雖有而未嘗有一以為無耶雖無而未嘗無此非法非非法之意真空不空其若是乎李文會曰不可取者空生深恐學人不悟如來無相之理不可説者深恐學人執著如來所説章句也非者無也非非者不無也黃蘖禪師曰法本不有莫作無見法本不無莫作有見謂無即成斷滅謂有即成邪見傅大士曰菩提離言説從來無得人須依一空理當證法王身子榮曰先悟人法二空然後證涅槃妙果有心俱是妄無執乃名真若悟非非法逍遙出六塵川禪師曰是什麼頌曰恁麼也不得不恁麼也不得廓落太虛空鳥飛無影迹咄撥轉機輪却倒回南北東西任往來所以者何一切聖賢皆以無為法而有差別疏鈔曰未了人空法空皆名執著了此二法即曰無為菩薩能齊證二空聲聞方離人空未逹法空故云離一非以證前之義故云而有差別六祖云三乘根𪫬所解不同見有淺深故言差別佛説無為説者即是無住無住即無相無相即無起無起即無滅蕩然空寂照用齊施鑑覺無礙乃真是解脫佛𪫬佛即是覺覺即是觀照觀照即是智慧智慧即是般若也王日休曰其言賢聖以無為法而有差別者何蓋謂於無為法得之淺者則為賢人若須陀洹之類是也得之深者則為聖人若佛與菩薩是也此所以為差別歟顏丙曰佛問須菩提如來得阿耨多羅三藐三菩提耶如來有所説法耶答云如我解佛所説義理皆無一定之法可名可説何故如來所説法如人飲水冷暖自知不可取不可説非法非非法法屬有非法屬無執有著相執無落空所以道不是法不是非法又以者用也無為者自然覺𪫬無假人為故一切賢聖皆用此無為之法然法本無為悟有淺深遂生差別見到頭則一也李文會曰無為法𪫬本無淺深定相可取若有定相應無差別有差別者謂根有利鈍學有淺深故名差別既有差別即無定相也海覺元禪師曰一金成萬器皆由匠者智何必毗耶城人人説不二傅太士曰人法俱名執了即二無為菩薩齊能證聲聞離一非所知煩惱盡空中無所依常能作此觀證果定無疑川禪師曰毫釐有差天地懸隔頌曰正人説邪法邪法悉歸正邪人説正法正法悉皆邪江北成枳江南橘春來都放一般花須菩提於意云何若人滿三千大千世界七寶以用布施是人所得福德寧為多不王日休曰三千大千世界者此日月所照為一小世界其中間有須彌山日月繞山運行故南為閻浮提東為弗婆提西為瞿耶尼北為鬱單越是名四天下日月運行乃在須彌山之中腰故此山之高其半出日月之上山上分四方每方有八所中間又有一所共三十三所謂之三十三天梵語謂之忉利天是也日月運行於此四天下謂之一小世界如此一千小世界謂之小千如此一千小千世界謂之中千如此一千中千世界謂之大千以三次言千字故云三千大千其實則一大千耳如此方謂之一大世界寧為多不者此寧字乃譯師之言蓋若助辭耳不必深考也六祖曰此是如來問起此意如何布施供養身外之福受持經典身內之福身福即衣食𪫬福即智慧雖有衣食𪫬中愚迷即是前生布施供養不持經典今生聰明智慧而貧窮無衣食者即是前生持經聽法不布施供養外修福德即衣食內修福德即智慧錢財見世之寶般若在心之內外雙修方為全德此是讚歎持經功德勝布施福也疏鈔云七寶者金銀琉璃珊瑚瑪瑙赤真珠玻佛意欲顯無為之福先將有漏之福問及善現三千世界盡著七寶以用布施作福所得其福德寧為多不下文須菩提答須菩提言甚多世尊何以故是福德即非福德性是故如來説福德多謝靈運曰福德無𪫬可以因緣增多多則易著故即遣之六祖曰三千大千世界七寶持用布施得福雖多於𪫬一無利益依摩訶般若波羅蜜多修行令自𪫬不墮諸有是名福德𪫬心有能所即非福德𪫬能所心滅是名福德𪫬心依佛教行同佛行是名福德𪫬不依佛教不能履踐佛行即非福德𪫬僧若訥曰空生謂大千七寶寶豐福勝故曰甚多是福德者事福也即非福德𪫬者非般若福德種𪫬既非理福不趍菩提也是故如來説福德多者於世間事福乃云多也僧子榮曰住相布施唯成有漏之因而得人天福業報離相持經則證無為之理得福無有邊際陳雄曰聚寶布施持經精進皆六度之一也佛化度衆生未嘗沮其布施而獨喜其精進蓋謂世人計著多用金銀琉璃珊瑚瑪瑙真珠玻為求福地殊不知以覺𪫬之寶修其𪫬上福德故併為一者設為之問以較其優劣持經精進者率𪫬而修也𪫬彌滿六虛其福德亦如是夫是之謂福德𪫬聚寶布施者藉物而修也物有限而其福亦有限又非福德𪫬之比故須菩提辨論曰是福德即非福德𪫬且斷之曰如來説福德多者以其有限得以計其多寡故也五祖嘗曰自𪫬若迷福何可救六祖亦曰功德在自𪫬不是布施供養之所求又曰自悟自修是自𪫬上功德二佛之言深契玄旨顏丙曰佛問若人滿世界七寶捨施得福多不須菩提答福德雖多畢竟非福德𪫬李文會曰三千大千世界七寶布施此是住相布施希求福利得福雖多而於識心見𪫬了無所得傅大士曰寶滿三千界齎持作福田惟成有漏業終不離人天故知住相布施即非福德𪫬若人心無能所識心見𪫬方名福德𪫬也川禪師曰事向無心得頌曰寶滿三千及大千福緣應不離人天若知福德元無𪫬買得風光不用錢若復有人於此經中受持乃至四句偈等為他人説其福勝彼疏鈔云此經者人人俱有箇箇周圓上及諸佛下及螻蟻亦具此經即妙圓覺心是也無物堪比顏丙曰復有人於此經中受持乃至四句偈等受者直下承受持者時時行持更為他人解説如一燈傳百千萬燈其福勝彼如何便見得勝彼𩂜彼以七寶乃住相布施縱得濁福福盡墮落此因經悟𪫬四句現前福等太虛歷劫不壞故云住相布施生天福猶如仰箭射虛空勢力盡箭還墜招得來生不如意爭似無為實相門一超直入如來地又四句決疑金剛經者乃大藏經之骨髓而四句偈者又金剛經之骨髓若人受持是經而不明四句下落又豈能超生脫死而成佛作祖也古今論四句偈者不一或指聲香味觸法是或指經中二偈是或云若見諸相非相即見如來或云眼耳鼻舌或云有為句無為句非有為句非無為句或云有諦無諦真諦俗諦各執己見初無定論唯銅牌記云天親菩薩升兜率宮請益彌勒如何是四句偈彌勒云無我相無人相無衆生相無壽者相是也六祖大師復以摩訶般若波羅蜜多是也若果執此兩轉語便為倒根何異數它人寶於自己無半文之分幸而傅大士曾露箇消息最是親切云若論四句偈應當不離身以是而觀則四句偈者初不假外求而在吾心地明了方真四句也不然六祖何以注四句偈云我人頓盡妄想既除言下成佛向使此偈可以言傳靣命可以聰明測度而到則我佛乃天人之師住世四十九年廣為衆生説法三百五十度而於此經凡一十四𩂜舉四句偈而終不明明指示端的豈我佛吝其辭而不為説破耶蓋恐人執指為月而徒泥紙上之死句而不能返觀內照於自己之活句也且我佛尚不敢執著指示況其餘者乎吾之所謂活句者死生不能汩凡聖立下風在於常行日用中字字放光頭頭顯露初無一點文墨污若是箇漢直下承當早是蹉過了也何更容些小見識解會而分別此是彼非也唯有過量人方知鼻孔元來在靣上傅大士頌曰寶滿三千界賫持作福田唯成有漏業終不離人天持經取四句與聖作良緣欲入無為海須乘般若船玄宗皇帝云三千七寶雖多用盡還歸生滅四句經文雖少悟之直至菩提百丈禪師曰眼耳鼻舌各各若不貪染一切諸法是名受持四句偈亦名四果仙人亦名六通羅漢若能受持乃至四句偈等功德廣大勝彼三千大千世界七寶布施也陳雄曰三昧經云一切佛法攝在一四句偈中故得之者不在於文字之多但一念頃即入實諦而其𪫬天昭徹矣若更有勤行修進受之不忘於心持之不厭其久説之普得聞知非特覺一己之𪫬且將覺億萬人之𪫬其為福德莫大焉比之多施七寶之福為勝李文會曰受持者身口意皆清淨是也曉解經義依教而行如船如海無所不通亦名受持既不曉解經義而又懈怠心口相違如入小港即有斷絶非受持也四句偈川禪師注載在卷末應化非真分中張無盡曰佛為無上法王金口所宣聖教靈文若一誦之則為法輪轉地夜又唱空報四天王天王聞已如是展轉乃至梵天通暗通明龍神悅懌猶如綸言誕布詔令橫流寰宇之間孰不欽奉誦經之功其旨如此若止形留神往外寂中搖尋行數墨而已何異春禽晝啼秋蛩夜鳴雖千萬遍果何益池陽薌山因禪師遣僧往大通鎮陳宅求經頌曰燈籠露柱熾然説莫學驢年紙上鑽看經須具看經眼多見看經被眼謾何以故須菩提一切諸佛及諸佛阿耨多羅三藐三菩提法皆從此經出疏鈔云經云三世諸佛及阿耨菩提一切妙法皆從此經出即明持經果滿顯前義也又多心經云三世諸佛依般若波羅蜜多故得阿耨菩提亦同此義又忠國師云茲經喻如大地何物不從地之所生諸佛惟指一心何法不從心之所立故云皆從此經出王日休曰阿耨多羅三藐三菩提謂真𪫬也一切諸佛阿耨多羅三藐三菩提法者謂諸佛求真𪫬之法也何以故者佛自問何故於此經受持講説所得福德勝於彼三千大千世界七寶布施也乃自答云一切諸佛求真𪫬之法皆從此經出則此經之功為極大而且無窮矣顏丙曰何以故一切諸佛及阿耨多羅三藐三菩提法皆自此經出者蓋大藏經及從上諸佛無上正等正覺之法皆出自此經此經者此外無餘經也僧若訥曰皆從此經出者非指此一經文句語言乃指實相般若即是一心遍為諸法𪫬體自己一念能生一切法故李文會曰無相福德生出應身無相智慧顯出真身謂從自己心中出菩提法也川禪師曰且道此經從甚處出須彌頂上大海波心頌曰佛祖垂慈實有權言言不離此經宣此經出處還相委便向雲中駕鐵船切忌錯會須菩提所謂佛法者即非佛法王日休曰佛於此再呼須菩提而告之所謂佛法者乃上文所謂阿耨多羅三藐三菩提法也佛恐人泥於有此佛法故云所謂佛法者非有真實佛法乃虛名為佛法而已蓋謂佛法本來無有唯假此以開悟衆生耳是於本𪫬中非為真實也六祖曰如來所説佛者令人覺所説法者令人悟若不覺不悟取外佛外法者即非佛法也顏丙曰所謂佛法即非佛法者隨説隨剗也李文會曰二乘之人執著諸相以為佛法遂乃向外尋求文殊師利云一切衆生愚迷顛倒不知覺悟種種修行不離身內若於身外修行無有是𩂜菩薩於諸佛法都無染著亦不捨離見如不見聞如不聞心境空寂自然清淨是故佛法非佛法也覺道之人既能覺悟諸相皆空但用所得知解做藥治箇心中妄想執著之病心地自然調伏無罣礙也川禪師云能將蜜棗子換汝苦葫蘆頌曰佛法非法能縱能奪有放有收有生有殺眉間常放白毫光癡人猶待問菩薩須菩提於意云何須陀洹能作是念我得須陀洹果不須菩提言不也世尊何以故須陀洹名為入流而無所入不入色聲香味觸法是名須陀洹陳雄曰須陀洹斯陀含阿那含阿羅漢此四羅漢在一切凡夫人中為第一佛告彌勒菩薩於法華經嘗言之矣告大慧菩薩於楞伽經亦詳言之大涅槃經佛言若有比丘欲得須陀洹果斯陀含果阿那含果阿羅漢果當勤修習奢摩他毗婆舍那二法大般若經有預流果一來果不還果阿羅漢果正此之所謂四果也又云修行般若波羅蜜多時不著預流果不著一來果不還果阿羅漢果抑又見四羅漢得是果而不存所得心也今我佛恐四羅漢不知以無念為宗尚萌所得之念故設四問以為能作得果得道之念不須菩提皆以不也答之復為之辨論以形容其所得之實夫入流者初入其門得預聖人之流也須陀洹已證入流之果名為入流且心無所得故曰而無所入其所以無所入者不入六塵境界耳名須陀洹其以是歟李文會曰問第一果須陀洹者知身是妄欲入無為之理斷除人我執著之相以無取心契無得理無取則心空無得乃理寂雖然能捨粗重煩惱而未能離細煩惱此人不入地獄不作修羅餓鬼異類之身此謂學人悟初果也逍遙翁云夫煩惱者菩提之根本也若人照了練習可為出世之法譬如高源陸地不生蓮花蓮花生於淤泥濁水中也又云煩惱勿令損於菩提心譬如日月翳於煙雲中而日月必無損也珠玉落於泥滓中珠玉亦無損也莫管煩惱障但存菩提心入流者謂捨凡入聖初入聖流也而無所入者修無漏業不入六塵然終未能捨離塵境傅大士曰捨凡初入聖煩惱漸輕斷除人我執創始證無為緣塵及身見今者乃知非七反人天後趣寂不知歸不入色聲香味觸法者厭喧求靜六塵之境於念未忘所以不入色聲香味觸法也圜悟禪師曰報緣未謝於人間世上有許多交涉應須𠁅之使綽綽然有餘裕始得人生各隨緣分不必厭喧求靜但令中虛外順雖在閙市沸湯中亦恬然安隱才有纖毫見刺即便打不過也須菩提於意云何斯陀含能作是念我得斯陀含果不須菩提言不也世尊何以故斯陀含名一往來而實無往來是名斯陀含肇法師曰一往來者一生天上一生人中便得涅槃故名一往來而實無往來者證無為果時不見往來相也六祖曰斯陀含人名一往來行從天上却得人間生從人間死却生天上竟欲界九品思惑斷前六品盡名斯陀含果大乘斯陀含者目覩諸境心有一生一滅無第二生滅故名一往來王日休曰一往來者但色身一次往來天上人間而真𪫬遍虛空世界豈有往來故此色身往來非為真實但虛名為一往來而已故云實無往來以色身非真實故也陳雄曰一往來者一往天上一來人間不復再來人間也斯陀含已證一來之果名一往來且心無所得而實無生滅相名斯陀含其以是歟李文會曰問第二果斯陀含者是漸修精進之行修無漏業念念不住六塵境界然終未有湛然清淨之心一往來者謂人間報謝一往天上却來受生也實無往來者謂前念才著後念即覺是無得果之心心既無我誰云往來故曰而實無往來也須菩提於意云何阿那含能作是念我得阿那含果不須菩提言不也世尊何以故阿那含名為不來而實無不來是故名阿那含僧若訥曰梵語阿那含此不來已斷欲界思惑更不來生欲界故名不來而實無不來者謂不計不來相也陳雄曰不來者謂不來欲界受生也阿那含已證不來之果名為不來且心無所得而實無不來之相名阿那含以是之故豈他在耶李文會曰第三果阿那含者已悟人法俱空漸修精進念念不退菩提之心名為不來者謂能斷除內無欲心外無欲境已離欲界不來受生故名不來心空無我孰謂不來故云而實無不來也傅大士頌曰捨凡初入聖煩惱漸輕斷除人我執創始至無為緣塵及身見今者乃知非七返人天後趨寂不知歸佛説四十二章經曰佛言阿羅漢者能飛行變化曠劫壽命住動天地次為阿那含阿那含者壽終魂靈上十九天於彼證阿羅漢次為斯陀含斯陀含者一上一還即得阿羅漢一上天上一還人間次為須陀洹須陀洹者七死七生便證阿羅漢又十六菩薩因果頌阿氏多尊者頌曰萬行周通能覺𪫬驅除煩惱更勤修七生七死方成道初等陀洹入聖流子榮曰七返人天後者七度往返天上人間受生謂初果須陀洹人趣寂不知歸者第四果證得阿羅漢已悟人法二空怕染著世間生死一向灰心滅智入無餘界沉空寂滅不來塵世化導度生為有智無悲不能入生死界且自利也川禪師曰諸行無常一切皆苦頌曰三位聲聞已出塵往來求靜有踈親明明四果元無果幻化空身即法身須菩提於意云何阿羅漢能作是念我得阿羅漢道不須菩提言不也世尊何以故實無有法名阿羅漢世尊若阿羅漢作是念我得阿羅漢道即為著我人衆生壽者謝靈運曰阿羅漢者無生也相滅生𥁞謂之無生若有計念則見我人起相也有注云阿羅漢者生已𥁞行已立所作已辦不受後有故於諸相諸法實無所得更不於三界內受生故名不生僧若訥曰阿羅漢者名含三義一殺煩惱惑使二後報不來三應受人天供養亦謂之無學果自初果至阿羅漢果無別有法皆同證此無為之體無可取捨故云實無等又曰若阿羅漢起得果之念即有著我人等過陳雄曰諸漏已𥁞無復煩惱名阿羅漢阿羅漢心行般若波羅蜜故法得是道若自有法是所得心未除何以稱是名故曰實無有法名阿羅漢法華經云於諸法不受亦得阿羅漢正謂此耳自須陀洹而至於阿羅漢自得果而至於得道如是次第修則菩提無上道可以次第到顏丙曰四果修行名四不還須陀洹名為入流者隨順世間也而無所入者本𪫬空故居塵不染塵之説斯陀含名一往來者色身雖有來去而法身湛然不動而實無往來也阿那含名為不來者離生死義而實無不來者假名不來實無動靜阿羅漢能作是念而得道者是為著相實無有法但假名為阿羅漢陳雄曰世尊者啓咨之辭也念者萌之於心也須菩提啓咨世尊曰設若阿羅漢作得道之念是萌所得心則四著謬妄無不為己故曰即為著我人衆生壽者李文會曰問第四果阿羅漢者此是梵語由須菩提當此果也諸漏已𥁞無復煩惱實無有法者謂無煩惱可斷無貪瞋可離情無逆順境智俱亡豈有得果之心我心既空無得道念若於道有得於法有名是凡夫之行即著我人衆生壽者相也世尊佛説我得無諍三昧人中最為第一是第一離欲阿羅漢世尊我不作是念我是離欲阿羅漢六祖曰三昧梵音此云正受亦云正見遠離九十五種邪見是名正見王日休曰梵語三昧亦云三摩地亦云三摩提此云正定亦云正受乃謂入定思想法也正定者謂入定之法正也正受者謂定中所想境界而受之非是妄想故云正受世人不知此理乃謂三昧為妙趣去聲之意故以善於點茶者謂得點茶三昧善於簡牘者謂得簡牘三昧此皆不知出處妄為此説也於此三昧人之中須菩提為第一僧若訥曰無諍者涅槃經云須菩提住虛空地若有衆生嫌我立者我當終日端坐不起嫌我坐者我當終日立不移處一念不生諸法無諍言三昧者得此無諍精妙之處於諸弟子中最為苐一李文會曰三昧者梵語也此名正定心心無生滅名為正定故云三昧人中最為第一離欲阿羅漢者能離一切法亦無離欲之心細四相皆已滅盡愛染不生故謂之離欲耳又曰無我心寂不作是念我是離欲得道果者若作是念即是心有生滅不名離欲阿羅漢也川禪師曰把定則雲橫谷口放行則月落寒潭頌曰喚馬何曾馬呼牛未必牛兩頭都放下中道一時休六門迸出遼天鶻獨步乾坤總不收六祖壇經曰六門六根也禪宗頌古白雲端曰趙州放出遼天鶻鶻乎骨切世尊我若作是念我得阿羅漢道世尊則不説須菩提是樂阿蘭那行者以須菩提實無所行而名須菩提是樂阿蘭那行僧若訥曰阿蘭那此無諍世尊雖稱歎我我實不作是念若作是念世尊不應記我無諍之行最為第一又曰離三界欲證四果法得無諍三昧方受須菩提名以須菩提為空生故云是樂阿蘭那行若計著實有所行則非無諍行也陳雄曰三昧梵語此言正受也無生法忍證寂滅樂是所謂無諍三昧也華嚴經云有諍説生死無諍即涅槃六祖偈曰諍是勝負心與道相違背便生四相心何由得三昧須菩提證真空無相之妙得六萬三昧而無諍三昧為最以三昧力超出物表不為物役名為第一離欲阿羅漢宜矣且啓咨世尊曰我不作如是之念則須菩提不存所得心可知又曰須菩提恐大衆不知去所得心是以啓咨世尊至于再四我者須菩提自稱也須菩提者亦自稱也樂者好也阿蘭那梵語無諍之謂也言樂阿蘭那行者即是好無諍行之人也夫萌之於心者曰念見於修為者曰行有所行則必有是行去聲有是行則必有所得須菩提得無諍三昧有是行故也且曰無所行者蓋以心無所得也有是行而心無所得宜乎世尊以樂阿蘭那行名之也顏丙曰若阿羅漢生一妄念作有所得想即著四相佛説我得無諍三昧人中最為第一無諍者佛𪫬包含大千無有鬪諍三昧者唐言正見人中第一無鬪諍也是第一離欲阿羅漢者六欲頓空也阿蘭那行者無人我行也是樂阿蘭那行者窮其本𪫬空寂畢竟實無所行所行謂之行樂者愛也李文會曰阿蘭那者是梵語也此名無諍心若作是念心有生滅即是有諍心須菩提實無所行是無生滅所以佛許須菩提是樂阿蘭那行者百丈禪師云只如今一切諸法若於藏府中有纖毫停留是不出網但有所求所得生心動念𥁞是野干若藏府中都無所求都無所得此人諸惡不生人我不起是納須彌於芥子中不起一切貪瞋是能吸四大海水不受一切喜怒語言入耳中於一切境不惑不亂不瞋不喜刮削併當得淨潔是無事人勝一切知解精進頭陀是名有天眼是名有法界𪫬是作車載因果是佛出世度衆生傅大士頌曰無生即無滅無我復無人永除煩惱障長辭後有身子榮曰出生死苦更不受父母胞胎之身境亡心亦滅無復起貪瞋無悲空有智翛思邀切然獨任真子榮曰無悲空有智翛然獨任真者為方證得果悟人法空寂更有餘習一向沉空趍寂為不敢入衆生生死海中教化衆生方有智慧未全悲愍之心故云空有智川禪師曰認著依前還不是頌曰蚌腹隱明珠石中藏碧玉有麝自然香何用當風立活計看來恰似無應用頭頭皆具足佛告須菩提於意云何如來昔在然燈佛所於法有所得不不也世尊如來在然燈佛所於法實無所得劉虯曰言如來作菩薩時在然燈佛所於法畢竟無所得離所取也六祖曰然燈是釋迦牟尼佛授記之師故問須菩提我於師處聽法有法可得不須菩提知法即因師開示而實無得但悟自𪫬本來清淨本無塵勞寂而常照即自成佛當知世尊在然燈佛所於法實無所得王日休曰如來佛自謂也昔舊也然燈即定光佛乃釋迦佛本師陳雄曰八王子皆師妙光得成佛道而其最後成佛者名曰然燈十六王子出家為沙彌皆得如來之慧最後者我釋迦牟尼然燈是釋迦授記之師釋迦如來因師開導得無上菩提法為諸釋之法王於法寧無所得耶但不存其所得心耳佛恐諸菩薩所得心未除故設是問須菩提深悟佛意以不也答之且言於法實無所得則以如來實得之心傳故也言實則將以息大衆之疑心李文會曰於法有所得不者如來欲破二乘之人執著之心故有此問白樂天問寬禪師云無修無證何異凡夫師云凡夫無明二乘執著離此二病是名真修也真修者不得勤不得怠勤則近執著怠則落無明乃為心要耳此是初學入道之法門也於法實無所得者須菩提謂如來自𪫬本來清淨而於然燈佛所於法實無所得傅大士頌曰昔時稱善慧今日號能仁善慧能仁者皆釋迦佛號看緣緣是妄識體體非真法𪫬非因果如理不從因法𪫬本乎自然非因有果而後得如理出於真𪫬不從有因而後能謂得然燈記寧知是舊身然燈佛即定光佛乃釋迦佛本師也舊身即本來非身也涅槃經曰唯有法身常住不滅是也寒山詩曰嘗聞釋迦佛先受然燈記然燈與釋迦秪論前後智前後體非殊異中無一異一佛一切佛心是如來地川禪師云古之今之頌曰一手指天一手指地南北東西秋毫不覩生來心膽大如天無限群魔倒赤幡須菩提於意云何菩薩莊嚴佛土不不也世尊何以故莊嚴佛土者即非莊嚴是名莊嚴肇法師曰是名離相莊嚴佛土疏鈔云佛土者佛之妙𪫬也衆生之真心也如是心土還可以相好莊嚴不又云不也者即善現從理以答之何故自心之土不在莊嚴何故為𪫬無相體等虛空如何莊嚴何名莊嚴答六度萬行布施戒定慧等一切善法是皆莊嚴又云若染斷常即非淨土經云欲淨其土先淨其心心淨故即淨土也問心云何淨答外不染六塵內無我人不著斷滅故名淨土王日休曰既曰菩薩而言莊嚴佛土何也蓋一大世界必有一佛設化如此間大世界乃釋迦佛設化之所東方有大世界乃不動佛設化之所是也唯其一大世界有一佛設化故凡大世界皆謂之佛土而菩薩莊嚴者蓋有菩薩於其佛土之中作種種善事以變易其世界如阿彌陀佛為菩薩時作無量善事故其善緣福業能變其世界皆以黃金為地七寶為樹林樓臺是為莊嚴也佛於此又自問何以故者謂何故菩薩言我當莊嚴清淨佛土者為非真實語也乃自答云莊嚴佛土者即非莊嚴是名莊嚴者為真𪫬中非有此莊嚴故此莊嚴但為虛名而已非是真實唯真𪫬為真實故也陳雄曰維摩經云隨其心淨則佛土淨蓋此心清淨便是莊嚴佛土奚以外飾為七寶宮殿五采棟宇皆外飾也此凡夫之所謂莊嚴非菩薩之所謂莊嚴欲知菩薩莊嚴當於非莊嚴中求之則萬行莊嚴是乃所以名其為莊嚴也李文會曰莊嚴佛土者謂造寺寫經布施供養此是著相莊嚴若人心常清淨不向外求任運隨緣一無所得行住坐臥與道相應是名莊嚴佛土龐婆看藏經維那請回向婆於靣前取梳子就腦後插云回向了也此是無能所心傅大士云莊嚴絶能所無我亦無人斷除俱不染穎脫出囂塵川禪師云娘生袴子青州布衫頌曰抖擻渾身白勝霜蘆花雪月轉爭光幸有九皋翹足勢更添朱頂又何妨是故須菩提諸菩薩摩訶薩應如是生清淨心不應住色生心不應住聲香味觸法生心應無所住而生其心疏鈔云應者當也故云當如是生清淨心即佛勸生真如無染之心也問云何生清淨心答不應住色聲香味觸法生心又楞嚴經云若能轉物即同如來凡夫被物轉菩薩能轉物如是轉者故曰應無所住而生其心王日休曰梵語菩薩摩訶薩此云覺衆生大衆生其實即所謂菩薩也如是字乃指下文謂不當住於有形色者而生心亦不當住於有聲音馨香滋味及所觸及一切法者而生其心當無所住而生其心者謂不可生心以住著於六塵唯可於無所住著處生心也諸佛教化衆生有第一義第二義此經説第一義雖至高而可曉然不易到淨土雖為第二義而人人可行佛言修淨土而明第一義讀誦大乘經典者上品上生則為菩薩生死自如然則修淨土者豈可不曉此經之義而受持讀誦以期於上品上生也陳雄曰菩薩莊嚴既不在於外飾則當反而求之於心心苟清淨莊嚴莫甚焉故云應如是生清淨心凡住六塵而生其心者皆非清淨心也菩薩豈應如是且如佛心本來清淨無相寧有所住菩薩受如來教亦應如是故云應無所住而生其心與十四分應生無所住心同佛言六塵之苦每以色獨言於先而繼之以聲香味觸法益以見色者人情之所易惑在六塵中尤其最者也五祖為六祖説金剛經恰至應無所住而生其心六祖言下大悟乃言何期自𪫬本自清淨何期自𪫬本不生滅何期自𪫬本自具足何期自𪫬本無搖動五祖曰不識本心學法無益若言下識自本心見自本𪫬即名丈夫天人李文會曰菩薩之心心常空寂無諸妄念不生不滅不動不搖即是清淨心也凡夫之心無明起滅妄想顛倒取捨善惡凡聖等見是名濁亂心也不應住色生心者心若清淨即不被諸境惑亂也逍遙翁云若人心境清淨是佛國淨土心境濁亂是魔國穢土也傅大士頌曰掃除心意地名為淨土因無論福與智先且離貪嗔莊嚴絶能所無我亦無人圓覺經曰無能無所清涼國師答皇太子曰是非兩亡能所雙絶斷常俱不染穎脫出囂塵或斷滅或常久此心俱不染著也唯俱不染著故能如穎之脫囊中而出乎囂塵也華嚴經四十四卷十忍品云非斷非常史記毛遂白使遂早得處囊中乃脫穎而出此言雖小可以喻大也川禪師云雖然恁麼爭奈目前何頌曰見色非干色聞聲不是聲色聲不礙𩂜親到法王城李文會曰衆生之心本無所住因境來觸遂生其心不如觸境是空將謂世法相實便於境上住心正猶猿猴捉月病眼見花一切萬法皆從心生若悟真𪫬即無所住無所住心即是智慧無諸煩惱譬如大空無有罣礙有所住心即是妄念六塵競起譬如浮雲往來不定維摩經云欲得淨土但淨其心隨其心淨即佛土淨黃蘖禪師曰心若清淨何假言説但無一切心即名無漏智汝每日行住坐臥一切語言但莫著有為法出言瞬目盡須無漏如今修行學道者皆著一切聲色何不與我心同虛空去如枯木石頭去如寒灰死火去方有少分相應若不如是他日盡被閻羅老子𬢦訊你在你但離却有無諸法心如日輪常在虛空自然不照而照豈不是省力底事到此之時無棲泊𩂜即是行諸佛路便是應無所住而生其心是你清淨法身阿耨多羅三藐三菩提也川禪師云退後退後看看頑石動也頌曰山堂靜夜坐無言寂寂寥寥本自然何事西風動林野一聲寒鴈唳長天須菩提譬如有人身如須彌山王於意云何是身為大不須菩提言甚大世尊何以故佛説非身是名大身王日休曰須彌山王者以此山在四天下之中為山之極大者故名山王謂在衆山之中而為王者也日月繞山而行以為晝夜由此而分四靣為四天下其上有三十三天可謂至大矣人身豈有如是之大者乎蓋譬喻耳故云譬如有人身如須彌山王也雖如是至大亦非真實是虛名大身而已故云佛説非身是名大身也何則凡有形相者皆為虛妄故三千大千世界亦為虛妄况如須彌山之身者乎唯真𪫬為真實此經説真𪫬第一義故以一切皆為虛妄也一切所以為虛妄者以其有形相既有形相則無不壞者縱使不壞乃業力以持之非本不壞也業力盡則壞矣唯真𪫬無形相故無得而壞此所以為不壞之本自無始以來至于今日無有動故云常住真𪫬謂真𪫬常住而無變壞此所以為真實也陳雄曰須彌山高廣三百三十六萬里為衆山之王謂人身有如是之大萬無是理唯佛真𪫬清淨無相無住著無罣礙包太虛藏沙界雖須彌山不足以擬其大世尊欲以真心悟人託大身以為問而須菩提深悟佛意遂有甚大之對恐大衆未曉為之辨論曰佛説非身是名大身非身者法身也真心也文殊菩薩問世尊何名大身世尊曰非身是名大身具一切戒定慧了清淨法故名大身蓋亦指真心言之也如此則真心可以吞須彌山矣顏丙曰色身雖大如須彌山王畢竟非大為有生滅佛説非身非身乃為此身也本𪫬無此妄身是名大身所謂佛身充滿於法界是也李文會曰色身雖大心量即小縱如須彌山王形有相有可量不名大身法身心量廣大等虛空界無形無相無可比量方名大身圜悟禪師曰不登泰山不知天之高不涉滄溟不知海之闊此區中之論也若是其中人天在一粒粟米中海在一毫毛頭上浮幢王華藏界盡在眉毛眼睫間且道此箇人什麼處安身立命還委悉麼無邊虛空盛不𥁞直透威音更那邊傅大士頌曰須彌高且大子榮曰梵語須彌山此云妙高山出衆山之最高大為第一是衆山之王更有六萬小山而為眷屬也將喻法王身子榮曰報身佛能現千重化化受用身化十地菩薩是為説法之王示現大身實無最大之相現心雖廣亦無有廣見之心量也七寶齊圍繞子榮曰須彌外更有七重金山圍繞也六度次相鄰子榮曰報身佛因中唯修六度萬行證得佛果故云六度次相鄰也四色成山相延光集注須彌東方玻璃峯紅色南方琉璃峯青色西方真金峯赤色北方白玉峯白色榮曰須彌四靣各有色喻報身佛有四相慈悲作佛因子榮曰菩薩人因地中皆修四無量心具慈悲喜捨修諸萬行方能成佛故云作佛因有形終不大無相乃為真子榮曰有形不名為大身法身無相故名為大身也川禪師曰設有向甚𩂜著頌曰擬把須彌作幻軀饒君膽大更心粗目前指出千般有我道其中一也無便從這裏入須菩提如恆河中所有沙數如是沙等恆河於意云何是諸恆河沙寧為多不王日休曰西土有河名曰恆河佛多以此河沙為言者蓋因衆人之所見而取以為譬喻也然佛尚以此問須菩提寧為多不者蓋使須菩提先省悟此沙已不勝其多矣然後為下文之説也寧字儒家訓豈如此乃譯師用字止如助字然不須深考也須菩提言甚多世尊但諸恆河尚多無數何况其沙李文會曰如恆河中所有沙數者一沙即為一河是諸河中各有其沙河尚無數何况其沙也川禪師云前三三後三三頌曰一二三四數河沙沙等恆河數更多算盡目前無一法方能靜𩂜薩婆訶須菩提我今實言告汝若有善男子善女人以七寶滿爾所恆河沙數三千大千世界以用布施得福多不須菩提言甚多世尊佛告須菩提若善男子善女人於此經中乃至受持四句偈等為他人説而此福德勝前福德肇法師曰良由施福是染沉溺三有三有謂三界三界不離於有故謂之三有持經福淨超升彼岸是故勝也疏鈔云佛重顯無為福勝有為福也圓覺經云有大陀羅尼門名為圓覺流一切真如涅槃如此之理豈不是此經四句偈何故圓覺者妙𪫬也因圓覺妙𪫬流出一切真如之法涅槃之理不生滅之道從此而出亦同第八分之妙義也如是解者受持無廢自利利他普與有情咸達其道而此福者即無為福也其福勝前恆河沙珍寶布施之福所以題號無為福勝之分王日休曰佛再呼須菩提言善男子善女人於此經中受其義理而持守之乃至以四句偈等為他人説則已不為惡業所縛而可以悟明真𪫬而人亦得聞此至理而有悟明真𪫬之漸久而善根皆熟可以脫離輪回永超生死則萬劫無有盡期故其福德勝於彼恆河沙數世界七寶布施無量無數也佛嘗言財施有𥁞法施無窮財施不出欲界法施能出三界此法施之福勝於彼無量無數不足怪也陳雄曰七寶雖多不過人間有限之物布施以此但受人間有限之福較之經中一偈悟之者生天豈不相去萬萬耶三昧經云若復有人持以滿城金銀而以布施不如是人所受持是經一四句偈今有善男女非特受持即自見𪫬又且解説教人見𪫬則彼此生天成無上道回視七寶之福為不足道故有勝前云華嚴云譬如暗中寶無燈不可見佛法無人説雖慧不能了是則解説之功又孰有大於此者顏丙曰將七寶滿世界布施得福多多屬在有漏未免窮盡不如於此經中受持自己四句更能展轉教人皆得入佛知見此福德歷劫長存故勝前著相福德李文會曰甚多世尊者謂七寶滿恆河沙數三千大千世界以用布施福德甚多受持四句偈者川禪師解注甚是詳明載在應化非真分中為他人説而此福德勝前福德者若能説此大乘經義化導衆生了悟住無所住心得無所得法當知受持此經無為功德勝前以七寶滿恆河沙數三千大千世界有為之福德也智者禪師頌曰恆河數甚多沙數更難量舉沙齊七寶能持布施漿有相皆為幻徒言智慧強若論四句偈此福未為長川禪師曰真鍮不換金頌曰入海算沙徒費力區區未免走埃塵爭如運出家中寶枯木生花別是春復次須菩提隨説是經乃至四句偈等當知此處一切世間天人阿修羅皆應供養如佛廟陳雄曰隨順者隨順衆生而為説也但説是經一偈之𩂜則凡在天道人道阿修羅道者舉皆以華香瓔珞幢幡繒蓋香油蘇燈恭敬供養如佛真身舍利寶在此况能持誦一經全文乎應知盡能持誦全文者則所成就之法乃出世間上上法也非尋常法也故壇經有所謂摩訶般若波羅蜜法最尊最上最苐一謝靈運曰封𣩵法身謂之樹像虛堂謂之廟聖體神儀全在四句獻供敬宜𥁞厥心也六祖曰所在之處見人即説是經常行無所得心即此身中有如來全身舍利故言如佛廟心清淨而説是經令諸𥊸者除迷妄心悟得本來佛𪫬常行真實感得天人阿修羅人非人等皆來供養持經之人也王日休曰謂隨其所在之處乃一切𩂜也有人受持讀誦演説則其功德威力為甚大故其𩂜即成寺而一切人及諸天與阿修羅等皆恭敬也阿修羅有三種一屬天趣一屬人趣一屬畜生趣大槩如人耳唯嗔恨之心重故託生於此類其福力大者生天趣其次者生於人趣其下者生於畜生趣僧若訥曰廟者具云婆此方墳亦名圓冢廟者梵云支提此云靈廟安佛形貌𩂜也李文會曰隨説者心無分別理應萬差逢凡説凡逢聖説聖也當知此𩂜者謂此心也如佛廟者若人但為名聞利養心不清淨而説是經轉墮輪回有何利益心若清淨即當空寂不起妄念以此無所得心無能解心而説是經令諸𥊸者生清淨心無諸妄念是名供養即此幻身便是法身中有如來全身舍利感得天人恭敬何殊廟何况有人盡能受持讀誦須菩提當知是人成就最上苐一希有之法若是經典所在之處即為有佛若尊重弟子六祖曰自心誦得此經自心解得經義自心體得無著無相之理所在之𩂜常修佛行即自心是佛故言所在之𩂜即為有佛王日休曰尊重弟子謂弟子之可尊可重者乃大弟子則菩薩之屬也𥁞能受持讀誦則如佛與大弟子在焉僧若訥曰經者即法寶也即為有佛即佛寶也若尊重弟子即僧寶也經典所在之𩂜即三寶共居也弟子者學居師後故稱弟解從師生故稱子又云以父兄之禮事師故稱弟子傅大士頌曰恆沙為比量分為六種多以恆河之沙而比量此經之功德究此經之功德莫大乎六種波羅蜜也華嚴合論九十六卷云六種波羅蜜海是也持經取四句七寶詎能過法門遊歷𩂜供養感修羅經中稱最勝尊高似佛陀佛陀即佛也梵語佛陀此云覺李文會曰成就者見𪫬無疑也最上苐一希有之法者佛與衆生本無差別若能心常清淨不生不滅無諸妄念使可立地成佛杲禪師曰身口意清淨是名佛出世身口意不淨是名佛滅度所在之𩂜即為有佛若尊重弟子者若能行住坐臥一切時中心無起滅湛然清淨常修佛行念念精進無有間斷所在之𩂜自心即佛是名佛子故可尊重矣又曰即心是佛無餘法迷者多于心外求一念廓然歸本際還如洗腳上船頭又曰即心是佛更無別佛即佛是心更無別心如拳作掌似水成波波即是水掌即是拳也無業禪師問馬祖云如何是即心是佛祖云即你不了底心是更別無物也迷即衆生悟即是佛如拳作掌似掌作拳師於言下省悟僧問馬祖云如何是佛師云即心是佛百丈問長塵云如何是佛師云騎牛討牛僧問首山和尚云如何是佛山云新婦騎驢阿家牽鼓山圭禪師為作頌云阿家新婦兩同條咫尺家鄉路不遙可笑騎驢覔驢者一生錯認馬鞍橋又僧問慈受云如何是佛師云擔水河頭賣僧問大陽云如何是佛師云如何不是佛僧問歸宗云如何是佛師云我向汝道汝還信否僧云和尚誠言安敢不信師云只汝便是也川禪師云合如是頌曰似海之深如山之固左旋右轉不去不住出窟金毛獅子兒全威哮吼衆狐疑深思不動干戈𩂜直攝天魔外道歸爾時須菩提白佛言世尊當何名此經我等云何奉持佛告須菩提是經名為金剛般若波羅蜜以是名字汝當奉持王日休曰梵語般若波羅蜜此云智慧到彼岸所云金剛智慧到彼岸者謂明此經者其智慧則如金之剛利斷絶外妄直至諸佛菩薩之彼岸也以是名字汝當奉持者謂奉事此義而持守之也陳雄曰唐柳宗元曰言之著者莫如經此經未標名時須菩提請名於佛而佛目之曰金剛般若波羅蜜俾須菩提依此名字遵奉受持一心流布於天下後世李文會曰言金剛者堅利之物故借金為喻般若者智慧也為教衆生用智慧力照破諸法無不是空猶如金剛觸物即碎故名般若也波羅蜜者到彼岸也心若清淨一切妄念不生能度生死苦海汝當奉持者只是奉持自心行住坐臥勿令分別人我是非也圜悟禪師云才有是非紛然失心只這一句驚動多少人做計較若承當得坐得斷透出威音王那畔若隨此語轉特地紛然自回光返照始得天壇石鼓記云𮈔毫失度即招黑暗之愆霎頃邪言即犯禁空之醜天人耳目咫尺非遙尅告行人自當省察廬山歸宗常禪師云有座主來參值宗鋤草次見一條蛇宗遂斬之主云久嚮歸宗元來却是一箇鹿行沙門宗云是尓鹿我鹿諸人且道這僧過在什麼𩂜汾陽昭禪師為作頌云廬嶽宗師接上機斬蛇特地施慈悲癡迷座主生驚怕却道鹿心惹是非死心和尚云只者是大似眼裏著刺只者不是正是開眼磕睡諸人且道畢竟作麼生則是還委悉麼點鐵化成金即易勸人除却是非難川禪師曰今日小出大遇頌曰火不能燒水不能溺風不能飄刀不能劈軟似兜羅硬似鐵壁天上人間古今不識咦所以者何須菩提佛説般若波羅蜜即非般若波羅蜜是名般若波羅蜜王日休曰此智慧到彼岸之説真𪫬中亦豈有故云即非智慧到彼岸謂實無也但虛名為智慧到彼岸以此接引衆生耳陳雄曰柳宗元曰法之至者莫尚於般若楞伽經曰智慧觀察不墮二邊得自覺聖趣是般若波羅蜜三昧經曰心無心相不取虛空不依諸地不住智慧是般若波羅蜜然般若波羅蜜至法也始而親出佛口故有佛説之句終而默傳此心則證入於般若三昧超出於言意之末而了無所得此非般若波羅蜜也又孰得而名之既非如是而且名其如是是又得其所以名也然則汝當奉持者以是名字故顏丙曰此是須菩提請佛為法安名更問如何遵奉行持佛云是經名為金剛般若波羅蜜夫妙明本性湛若太虛體既尚無何名之有如來恐人生斷滅見不得已而強安是名所以傅大士頌云恐人生斷見權且立虛名李文會曰佛説般若波羅蜜者實相般若之堅觀照般若之利截煩惱源達涅槃岸即非般若波羅蜜者既知法體元空本無妄念若無諸罣礙何必持戒忍辱湛然清淨自在逍遙是名即非般若也川禪師云猶較些子頌曰一手擡一手搦左邊吹右邊拍無絃彈出無生樂不屬宮商格調新知音知後徒名邈須菩提於意云何如來有所説法不須菩提白佛言世尊如來無所説顏丙曰佛問有所説法不須菩提云如來無所説者蓋直下無開口𩂜若言有説即為謗佛所以世尊臨入涅槃文殊請佛再轉法輪世尊咄云吾住世四十九年未嘗説著一字汝請再轉法輪是吾曾轉法輪耶又佛偈曰始從成道後終至跋提河於是二中間未嘗説一字李文會曰本心元淨諸法元空更有何法可説二乘之人執著人法是有即有所説菩薩了悟人法皆空即無所説是故經云若有人言如來有所説法即為謗佛慈受禪師云吾心似秋月碧潭光皎潔無物堪比倫教我如何説寒山子説不得則且止諸人還説得麼直須口似磉盤方始光明透漏若能了悟色𪫬皆空有無俱遣語默雙亡即見自性清淨雖終日言猶為無言雖終日説猶為無説保寧勇禪師云門前諸子列成行各逞英雄越霸王如何獨有無言者坐斷毗盧不可當傅大士云名中無有義義上復無名金剛喻真智能破惡堅貞若到波羅岸入理出迷情智人心自覺愚者外求聲川禪師云低聲低聲頌曰入草求人不奈何利刀斷了手摩挲雖然出入無蹤迹文彩全彰見也麼須菩提於意云何三千大千世界所有塵是為多不須菩提言甚多世尊須菩提諸塵如來説非塵是名塵如來説世界非世界是名世界陳雄曰華嚴經云三千大千世界以無量因緣乃成一切衆生豈外此而別有世界耶悟者𩂜此迷者亦𩂜此悟者之心清淨心也以此心𩂜此世界即清淨世界迷者之心塵垢心也以此心𩂜此世界即塵世界然世界許多而塵不勝其多宜須菩提有甚多之對又曰諸塵者一切衆生心上塵也佛分身於塵世界中示現無邊大神力開闡清淨無垢法使一切衆生皆生清淨心非塵所可污故云非塵得出世間法非世界所能囿故云非世界世尊答文殊曰在世離世在塵離塵是為究竟法此言非塵非世界即離塵離世也顏丙曰世界塵二者皆非真實經云一切山崖會有崩裂一切江河會有枯竭唯有法身常住不滅李文會曰塵者衆生妄念煩惱客塵遮蔽淨𪫬喻如塵如是煩惱妄想如病眼人見空中花如愚癡人捉水中月求鏡中像枉用其心傅大士頌曰積塵成世界析界作塵界喻人天果塵為有漏因塵因因不實界果果非真果因知是幻逍遙自在人又曰妄計因成執迷繩謂是蛇心疑生暗鬼眼病見空花一境雖無異三人乃見差了茲名不實長馭白牛車朝太傅云念起念止皆由自心念起即一切煩惱起無念即一切煩惱止既由自心何如無念又古德云一念不生全體現六根才動被雲遮察禪師云真淨界中才一念閻浮早已八千年逍遙翁云不怕念起唯恐覺遲覺速止速二妙相宜知非改過蘧顏可師圜悟禪師上堂云十方同聚會箇箇學無為此是選佛場心空及第歸大丈夫具決烈志氣慷慨英靈踏破化城歸家穩坐外不見一切境界內不見有自己上不見有諸聖下不見有凡愚淨裸裸赤灑灑一念不生桶底子脫豈不是心空也到這裏還容棒喝麼還容玄妙理𪫬麼還容彼我是非麼直不如紅爐上一點雪相似豈不是選佛場也然雖如是猶涉階梯在且下涉階梯一句作麼生道千聖會中無影迹萬人叢裏奪高標逍遙翁云五鼓夢回緣念未起靈響清徹聞和達聰為三妙音一曰幽泉漱王二曰清磬搖空三曰秋蟬曳緒凝聽靜專頗資禪悅安住妙境何勝如之要會麼病覺四肢如鶴瘦虛聞兩耳似蟬鳴非塵是名塵者一念悟來轉為妙用前念無諸妄想湛然清淨即非塵後念不住清淨是名塵非世界是名世界者若無妄念即佛世界有妄念即衆生世界前念清淨即非世界後念不住清淨是名世界謝靈運曰散則為塵合則成世界無𪫬則非塵世界假名則是名塵世界川禪師云南贍部洲北鬱單越頌曰頭指天腳踏地飢則食困則睡此土西天西天此土到𩂜元正是大年南北東西祗者是須菩提於意云何可以三十二相見如來不不也世尊不可以三十二相得見如來何以故如來説三十二相即是非相是名三十二相王日休曰三千大千世界塵可謂極多矣然見雨則為泥遇火則為磚瓦是無塵之定體所以為虛妄也是故説為非塵謂非有真實塵也但虛名為塵而已此謂極細而極多者也若極大者則世界世界亦非真實蓋劫數盡時則壞是亦虛妄非為真實但名為世界而已佛雖現色身而為三十二相至涅槃時則皆無矣不可以此得見真佛故云不可以三十二相得見如來此如來謂真𪫬佛也下文言如來説三十二相彼如來則謂色身佛耳乃佛謂我説三十二相者即是非相謂非真實相也但名為三十二相而已此分大意謂細而塵大而世界妙而佛之色身皆為虛妄但有名而已唯真𪫬為真實是以自古及今無變無壞彼三者則有變壞故也陳雄曰三十二相勝妙殊絶形體映徹猶如琉璃此相非是欲愛所生楞嚴經有是言矣謂其非是欲愛所生則是從三十二行上得之世人徒著三十二相而不修三十二行將焉自而得見法身如來又曰如來有是行必有是相故也説相者其意在於三十二行即非相也曰非相者其法身之謂歟華嚴經曰諸佛法身不思議無色無形無影像名三十二相亦以是耳豈它求故如來有是名之説般若經云如來足下有平滿相是為第一如來足下千輻輪文無不圓滿是為第二如來手足並皆柔軟如兜羅綿是為第三如來兩足一一指間猶如鷹王文同綺畫是為第四如來手足諸指圓滿纖長可愛是為第五如來足跟廣長圓滿與趺相稱是為第六如來足趺修高光滿與跟相稱是為第七如來雙腨漸次纖圓如鹿王腨是為第八如來雙臂平立摩膝如象王鼻是為第九如來隂相藏密是為第十如來毛孔各一毛生紺青宛轉是為苐十一如來髮毛右旋宛轉是為第十二如來身皮細薄潤滑垢水不住是為第十三如來身皮金色晃耀諸寶莊嚴是為第十四如來兩足兩掌中頸雙肩七𩂜充滿是第十五如來肩項圓滿殊妙是第十六如來腋悉皆充實是第十七如來容儀洪滿端直是第十八如來身相修廣端嚴是第十九如來體相量等圓滿是第二十如來額臆并身上半威容廣大如師子王是二十一如來常光靣各一尋是二十二如來齒相四十齊平淨密根深白逾珂雪是二十三如來四牙鮮白鋒利是二十四如來常得味中上味是二十五如來舌相薄淨廣長能靣輪至耳髮際是二十六如來梵音詞韻和雅隨衆多少無不等聞是二十七如來眼睫猶若牛王紺青齊整是二十八如來眼睛紺青鮮白紅環是二十九如來靣輪其猶滿月眉相皎淨如天帝弓是第三十如來眉間有白毫相柔軟如綿白逾珂雪是三十一如來頂上烏瑟膩沙高顯周圓猶如天蓋是三十二顏丙曰注三十二相與前般若經同更不重述以上乃三十二相也若據如來妙相本𪫬湛然空寂一相尚不可得豈可以三十二相而求見也佛在忉利天目連令匠人雕佛三十二相只雕得三十一相唯有梵音相雕不得院主問南泉如何是梵音相泉云賺殺人李文會曰三十二相者謂眼耳鼻舌身五根中具修六波羅蜜謂布施持戒忍辱精進禪定智慧是也於意根中修無住無為是三十二相清淨行也如來説三十二相即是非相是名三十二相者此謂法身有名無相故云非相既悟非相即見如來逍遙翁云須知諸佛法身本𪫬無身而以相好莊嚴為身故臨濟云真佛無形真道無體真法無相也川禪師云借婆衫子拜婆年頌曰你有我亦有君無我亦無有無俱不立相對觜盧都須菩提若有善男子善女人以恆河沙等身命布施李文會曰譬如有人捨身命布施求無上菩提此謂住相布施也禪要經云若於外相求之雖經萬劫終不能得又教中經云若見有身可捨即是不了蘊空昔日𦋺賔國王仗劒詣獅子尊者所問曰師得蘊空不尊者曰已得之矣王曰可施我頭尊者曰身非我有何况於頭王遂斬之白乳高丈餘王臂自落是知人法俱空不應住色布施所以尊者不畏於死也傅大士云法𪫬無前後無中非故新蘊空非實體憑何見有人故捨身命布施即與菩提轉不相應蓋為不見佛𪫬縱捨身命如恆河沙數何益於事又曰施命如沙數人天業轉深既掩菩提相能障涅槃心猿猴探水月證道歌云水中捉月爭拈得莨𦿆拾花針玉篇莨力盎切𦿆蔡盎切本草作莨菪子亦名浪蕩生食令人發狂眼生花針即以手拾之其實無花針愛河浮更沒苦海出還沉若復有人於此經中乃至受持四句偈等為他人説其福甚多顏丙曰若人以恆河沙等身命布施等者比也雖受頑福畢竟不明本𪫬如生豪貴之家驕奢縱恣不容不作業反受業報爭如受持四句為他人説自利利他其福甚多傅大士頌曰經中稱四句應當不離身愚人看似夢智者見唯真法𪫬無前後法𪫬者真佛𪫬也歷劫長存故無前後無中非故新真𪫬如虛空本無形相故云無中也此𪫬常住不滅不以前生而故不以今生而新故云非故新也蘊空無實相憑何見有人心經曰照見五蘊皆空川禪師曰兩彩一賽頌曰伏手滑槌不換劒善使之人皆總便不用安排本現成箇中須是英靈漢囉囉哩哩囉囉山花笑野鳥歌此時如得意隨𩂜薩婆訶爾時須菩提聞説是經深解義趣涕淚悲泣而白佛言希有世尊佛説如是甚深經典我從昔來所得慧眼未曾得聞如是之經陳雄曰深解義趣者須菩提心悟真空無相義趣也涕淚悲泣者傷我值遇之晚不獲早覺悟也顏丙曰深解者大徹大悟也李文會曰須菩提聞説是經了悟人法二空即得中道之理歎其希有感極涕零也傅大士頌曰聞經深解義心中喜且悲昔除煩惱障今能離所知遍計於先了圓成證此時宿乘無礙慧方便勸人持李文會曰未嘗得聞者昔得慧眼於有見空今聞是經於空亦遣是了中道將欲起教以示未來也川禪師云好笑當靣諱了頌曰自小來來慣遠方幾回衡嶽渡瀟湘一朝踏著家鄉路始覺途中日月長世尊若復有人得聞是經信心清淨即生實相當知是人成就第一希有功德李文會曰信心清淨者信本來心無法可得不起妄念心常空寂湛然清淨傅大士云未有無心境曾無無境心境亡心自滅心滅境無侵經中稱實相語妙理能深證知唯有佛小聖詎能任陳雄曰𪫬中具如來法身夫是之謂生實相圓覺經曰一切實相𪫬清淨故悟理而至於證實相吾知夫成就法身功德莫能出乎其右者謂之第一希有信乎經以福兼德言者屢矣而此獨言功德不及福者是功成果滿之時則其福為不足道所以壇經有功德在法身中非在於福之句顏丙曰即生實相者即是悟自𪫬也李文會曰即生實相者豁然了悟萬法由此淨心建立是名實相成就第一希有功德者迷即佛是衆生悟即衆生是佛佛佛道齊無法等比世尊是實相者即是非相是故如來説名實相顏丙曰佛云實相無相所謂是實相者即是非相如太虛空無一形相若悟實相不可執著實相當如大士云彼岸更求離但説假名實相本無可得李文會曰即是非相者實相無相故言為非不是無實相如龜毛兔角只説龜無毛兔無角不説無龜毛兔角只説實相無相不説無實相也達磨曰若解實相即見非相若了非相其色亦然當於色中不生色體於非相中不礙有也正猶水中鹽味色裏膠青決定是有不見其形此之謂也傅大士云衆生與壽者蘊上立虛名如龜毛不實似兔角無形川禪師云山河大地甚處得來頌曰遠觀山有色近聽水無聲春去花猶在人來鳥不驚頭頭皆顯露物物體元平如何言不會只為太分明世尊我今得聞如是經典信解受持不足為難王日休曰信解者謂信其義而曉解也受持者謂能受其義而持守之也陳雄曰無狐疑心曰信曉了意義曰解欽承不忽曰受佩服不厭曰持李文會曰但止了語人法二空心無取捨常令空寂是名信解受持如來慈悲方便化導迷人迷即佛是衆生悟即衆生是佛若能了悟萬事皆空以藥對病以悟對迷以善對惡以靜對動以慧對愚種種修行只是對治莫作諸惡勉力為善依此修行縱橫自在又且何難傅大士頌曰空生聞妙理如蓬植在麻凡流信此法同火出蓮花恐人生斷見大聖預開遮如能離諸相定入法王家川禪師曰若不得後語前話也難圓頌曰難難難如平地上青天易易易似和衣一覺睡行船盡在把梢人誰道波濤從地起若當來世後五百歲其有衆生得聞是經信解受持是人即為第一希有李文會曰若人心常空寂湛然清淨不著諸相悟住無所住心了得無所得法是為第一希有川禪師云行住坐臥著衣喫飯更有什麼事頌曰冰不熱火不寒土不濕水不乾金剛腳踏地幡竿頭指天若人信得及北斗靣南看何以故此人無我相無人相無衆生相無壽者相所以者何我相即是非相人相衆生相壽者相即是非相何以故離一切諸相即名諸佛李文會曰即是非相者前言無相即是滅色以明空義復言非相即是了悟我人衆生壽者四相本來不生故名實相離一切相即名諸佛者此謂悟實相者更無等比當知是人不著二邊不處中道一切無住即名為佛又云離相清淨解悟三空契合實相究竟涅槃三空之義初即人空次即法空後即空空三世如來同證此理故名為佛傅大士云空生聞妙理如蓬植在麻凡流信此法同火出蓮花恐人生斷見大聖預開遮如能離諸相定入法王家川禪師云心不負人靣無慚色頌曰舊竹生新笋新花長舊枝雨催行客到風送片帆歸竹密不妨流水過山高豈礙白雲飛善靜禪師云竹密不妨流水過山高那阻野雲飛佛告須菩提如是如是李文會曰如是如是者佛以須菩提所解空義善契如來之法意也陳雄曰華嚴經云離諸和合相是名無上覺佛以覺言外覺離一切有相內覺離一切空相於相而離相於空而離空得夫真空無相之妙所以名其為佛若復有人得聞是經不驚不怖不畏當知是人甚為希有肇法師曰得大乘聞慧解一往聞經身無懼相故名不驚得大乘思慧解深信不疑故名不怖得大乘修慧解順教修行終不有謗故名不畏陳雄曰不驚則無疑心不怖則無懼心不畏則無退心李文會曰不驚不怖不畏者心若空寂湛然清淨等於虛空有何驚怖甚為希有者諸上根器得聞是經諦聽受持永不退轉當知是人甚為希有傅大士頌曰如能發心者應當了二邊涅槃無有相菩提離所緣子榮曰如修行初發心修菩薩行須求大乘正知見人悟達上乘先了有無二邊之執方證涅槃無相之理故離所緣之心境也無乘及乘者人法兩俱捐欲達真如理應當識本源川禪師云秖是自家底頌曰毛吞巨海水芥子納須彌碧漢一輪滿清光六合輝踏得故鄉田地穩更無南北與東西何以故須菩提如來説第一波羅蜜即非第一波羅蜜是名第一波羅蜜疏鈔云何以故者顯因中最勝明標第一波羅蜜者有十種一布施二持戒三忍辱四精進五禪定六智慧七慈八悲九方便十不退今言第一波羅蜜者即布施波羅蜜何故獨言布施為第一曰布施者通攝萬行直至菩提尚行法施因布施資生衆善言非者恐有能所之名先拂去假名行無住相施故曰是名第一波羅蜜李文會曰如來説第一波羅蜜者若悟非相即達彼岸實相無二故名第一非第一波羅蜜者了悟人法俱空即無生死可度亦無彼岸可到何處更有第一故云非第一也是名第一波羅蜜者悟一切法即知諸法皆是假名法華經云但以假名字引導於衆生於斯了悟能入見𪫬之門是名第一波羅蜜也故知假名如將黃葉作金止小兒啼二乘之人聞説假名將謂是實執著修行欲離生死不知即無生死可離傅大士頌曰波羅稱彼岸於中十種名華嚴六十六卷善財童子見寶髻長者言願為我説諸菩薩道答言檀波羅蜜尸波羅蜜忍辱波羅蜜精進波羅蜜禪波羅蜜般若波羅蜜方便波羅蜜願波羅蜜力波羅蜜智波羅蜜又合論九十六卷云如是一百一十八大揔持門不出十波羅蜜中行高卑緣妄識次第為迷情熖裏尋求水空中覓響聲真如何得失今始號圓成子榮曰真如之理上至諸佛下至含生本自具足流轉六道亦未曾失縱悟成佛亦未曾得今始號圓成者言下頓覺即佛川禪師云八字打開兩手分付頌曰是名第一波羅蜜萬別千差從此出鬼靣神頭對靣來此時莫道不相識須菩提忍辱波羅蜜如來説非忍辱波羅蜜是名忍辱波羅蜜疏鈔云忍辱波羅蜜者即十波羅中第三是也王日休曰佛呼須菩提而謂能忍辱方不起嗔心以昏亂真𪫬乃能到諸佛菩薩之彼岸故云忍辱波羅蜜也佛雖有時自稱如來自稱佛然亦有時稱我其稱我則特謂我身爾若稱如來與佛則謂己與諸佛如來皆然也盡此一經皆如是此佛謂我與諸佛説忍辱波羅蜜真𪫬中亦豈有此忍辱故亦非真實但為虛名而已故云是名忍辱波羅蜜李文會曰忍辱波羅蜜者若有能忍之心即是見有身相不達我人衆生壽者諸非相也大易禪師舉火問僧云會麼僧云不會師云起則遍周沙界滅則了無所得又龐居士問馬祖云不與萬法為侶者是什麼人祖云回光自照看待你一口吸盡西江水然後向你道圜悟禪師曰參得此語透者目前萬法平沉無始妄想蕩𥁞又云大空無外大象無形盡世界撮來如粟米粒總虛空似掌中珠可以拽新羅國與波斯國鬪額直得東勝身洲射箭西瞿耶尼中垜所以道髑髏當千世界鼻孔摩出家風若是未出隂界尚涉見知聞恁麼説話一似鴨聽雷鳴隔靴抓癢直饒脫却根塵去却機境尚餘一線路在且二途不涉一句作麼生道還委悉麼佛殿階前石獅子大洋海裏鐵崑崙如來説非忍辱波羅蜜者了悟人法二空即無忍辱之相是達我人衆生壽者非相故云非忍辱也何以故須菩提如我昔為歌利王割截身體我於爾時無我相無人相無衆生相無壽者相何以故我於往昔莭莭支解時若有我相人相衆生相壽者相應生嗔恨須菩提又念過去於五百世作忍辱仙人於爾所世無我相無人相無衆生相無壽者相肇法師曰歌利王即如來因緣中事也尓時菩薩得無我解故所以能忍也六祖曰歌利王是梵語此云無道極惡君也世者生也如來因中五百生修行忍辱波羅蜜以得四相不生李文會曰如我昔為歌利王割截身體者如來設教方便門多若作教相言之只是依文設教為歌利王割截身體莭莭支解曾無一念瞋恨之心肇法師曰五蘊身非有四大本來空將頭臨白刃一似斬春風若以諸大宗師言之即是先説有為權教後顯無為實理若表法言之歌者即是慧之別名利者刀也非謂世間之刀王者心也是用慧刀割截無明煩惱之身體也應生嗔恨者謂色身與法身即不同也當知割截之時即不見有身相亦不見有我人衆生壽者四相何處更有嗔恨也華嚴經云譬如虛空於十方中求不可得然非無虛空菩薩之心亦復如是川禪師云智不責愚頌曰如刀斷水似火吹光明來暗去那事無妨歌利王歌利王誰知遠煙浪別有好商量李文會曰忍辱仙人者如來五百世中修忍辱波羅蜜行欲令一切衆生成就忍辱波羅密法不著諸相見一切人迷悟賢愚貧富貴賤平等恭敬不生輕慢以至惡罵捶打皆悉能忍反生歡喜不生瞋恨之心圜悟禪師云大凡為善知識應當慈悲柔和善順接物以平等無諍自𩂜彼以惡聲色來加我非理相干訕謗毀辱但退步自照於己無嫌一切勿與較量亦不瞋恨只與直下坐斷如初不聞見久之魔孽自消耳若與之較即惡聲相反豈有了期又不表顯自己力量與常流何以異切在力行之自然無思不服且夫見𪫬之人聞人毀謗如飲甘露心自清涼不生煩惱則能成就定慧之力不被六賊盜竊家寶功德法財遂從此增長也傅大士頌曰暴虐唯無道時稱歌利王逢君出遊獵仙人橫被傷子榮曰逢君出遊獵仙人橫被傷者謂如來因地修行證初地菩薩修忍辱仙行在山中宴坐遇歌利王出遊獵王乃憩息睡醒不見左右彩女遂親入山尋見衆妃宮女圍繞禮拜仙人王乃大怒問曰云何恣情觀我女色仙人曰於諸女色實無貪著王曰云何見色不貪仙人曰持戒王曰何名持戒仙人曰忍辱即是持戒王乃持刀割仙人身問曰還可痛否仙人曰實不痛王即莭莭支解問曰還可痛否仙人曰實不痛其時輔相大臣諫曰彼之大士逢斯患苦顏色欣然無所搖動奈何大王如斯刑害王乃止爾時王者即憍陳如是時仙人者即釋迦如來也頻經五百世前後極時長承仙忍辱力今乃證真常川禪師云目前無法從教柳緑花紅耳畔無聞一任鶯啼燕語頌曰四大元無我五蘊悉皆空廓落虛無理乾坤萬古同妙峯嶷嶷常如故誰管顛號刮地風是故須菩提菩薩應離一切相發阿耨多羅三藐三菩提心陳雄曰夫離一切相即名諸佛而菩薩受如來無相教法者也欲成佛道必發菩提無上道心蓋菩提無上道心即清淨無相心也菩薩應當離一切相以發是心然後可以成佛李文會曰應離一切相者心常空寂不生起滅湛然清淨是離一切相也川禪師曰是即此用離此用百丈參馬祖祖見師來取禪床角頭拂子豎起師云即此用離此用祖挂拂子於舊處頌曰得之於心應之於手雪月風花天長地久朝朝雞向五更啼春來處處山花秀不應住色生心不應住聲香味觸法生心應生無所住心若心有住即為非住朝太傅曰自定純修之法但於一切時中隨其辦及止習無住之住足矣又下文曰金剛經云應生無所住心是也又僧肇五論有云聖人之心住無所住內解注云安住無為名之為住住無方所故名無住又六祖壇經云我此法門無住為本又司馬子坐忘論翼云不依一物而心常住又云出世之法以無著為本華嚴云一切境界不生染著淨身口意住無礙行滅一切障世間受生皆由著我若離此著則無生處涅槃經云凡夫著色乃至著識以著識故則生貪染心故為色縛乃至為識之所繫縛以繫縛故則不得免生老病死憂悲大苦一切煩惱著著同王日休曰應當也不應住色生心者謂不當住著於凡有形色而生心也若愛廣大居宇美好器用之類是也不應住聲香味觸生心者謂不當住著於聲音馨香滋味及所觸而生心也若愛聲樂謳唱愛龍檀腦麝愛飲食異味愛嬌嬈婦女皆是住著於聲香味觸而生心也不應住法生心者謂佛法本為因衆生根器而設化若住著之則是泥於法而無由見真𪫬故不當住著於此而生心也應生無所住心者謂凡有住著𩂜皆不得起心念也若心有住即為非住者謂心若有所住著則其住著之非也蓋當使一念寂然如虛空然則可以見真𪫬矣此與第十分大略同然此再言之者乃詳言之也亦恐弟子有聽之不審者亦恐有續來聽者所以再言之凡此經中重疊言者義皆如此李文會曰不應住色聲香味觸法生心者心住六塵即著諸相取捨憎愛無有休期應生無所住心者心無所住隨處解脫內外根塵悉皆銷殞若一切無心即無所住也趙州云我見千百億箇𥁞是覔作佛漢子於中覔箇無心底難得僧若訥云心本無形因塵有相塵滅心滅真心湛然察禪師心印頌曰問君心印作何顏心印何人敢授傳歷劫坦然無異色呼為心印早虛言須知體似虛空𪫬意似紅爐火裏蓮莫謂無心云是道無心猶隔一重𨵿圜悟禪師云在家菩薩修出家行如火中生蓮蓋名位權勢意氣卒難調伏而况火宅煩擾煎熬百端千緒除非自己直下明悟本𪫬妙圓到大寂大定休歇之場方能放下廓爾平常徹證無心觀一切法如夢幻泡空豁豁地隨時應莭消遣將去隨自己力量轉化未悟同入無為無事法𪫬海中則出來南閻浮提打一遭必不為折本也黃蘖禪師云供養十方諸佛不如供養一箇無心道人何故為無心也無心者如如之體內如木石不動不搖外如虛空不塞不礙是名佛也又云夫恆沙者佛説是沙諸佛菩薩釋梵諸天步履而過沙亦不喜牛羊蟲蟻踐踏而行沙亦不怒寶馨香沙亦不貪糞溺臭穢沙亦不惡此即無心之心離一切相衆生諸佛更無差別但能無心即便是究竟也若心有住即為非住者真如之心本無所住若不住諸法相即與道相應也若住於法即違正教既違正教即為非住也是故佛説菩薩心不應住色布施謝靈運曰不住色無財物也陳雄曰菩薩心何心也無所住之心也菩薩六根清淨生無所住心豈應布施以求其諸欲之滿意然衆苦所本眼根不淨為先佛故斷之曰不應住色而為之布施也李文會曰不應住色布施者菩薩不見有身相可捨於諸宅舍道路逢見一切愚癡貧賤之人毀罵打須索財物若能隨順其意令生歡喜不生阻隔瞋恨之心即是布施之義若秪分辨是非𮨇惜物寶阻逆其意令生瞋恨即不名布施也黃蘖禪師云凡夫不肯空心恐落於空不知自心本空愚人除事不除心智者除心不除事菩薩心如虛空一切俱捨所作福德皆不貪著然捨有三等內外身心一切俱捨猶如虛空無所貪著然後隨力應物能所皆忘是為大捨若一為行道布德一邊旋捨無希望心是為中捨若廣修衆善有所希望聞法知空遂乃不著是為小捨大捨如火燭在前更無迷悟中捨如火燭在傍或明或暗小捨如火燭在後不見坑穽也傅大士頌曰菩薩懷深智何時不帶悲投身憂虎餓金光明經云如來因地為薩埵王子時一虎生七子經七日無食將欲死時王子見遂捨身以飼此虎也割肉恐鷹飢殑伽經云如來因地時在山中修忍辱仙時梵王帝釋遂化身一化為鷹一化為鴿來試仙人鷹趂其鴿鴿投仙人仙人遂以衣藏其鴿鷹切就仙人覔其鴿仙人遂將自身肉割一片以代鴿還鷹殑其矜切精勤三大劫曾無一念疲如能同此行皆得作天師須菩提菩薩為利益一切衆生故應如是布施六祖曰菩薩不為求望自身五欲快樂而行布施但為內破慳心外利益一切衆生而行布施陳雄曰七寶雖滿大千界等須彌山亦有時而盡布施以此焉得人人而給諸菩薩也無諸欲之求無能施之心亦無所施之物凡可以利益一切衆生者無不為己則含靈抱識均被其澤布施之心但應如是華嚴經云不為自身求快樂但為救護諸衆生李文會曰應如是布施者儉於自己奢于他人是名利益一切衆生若人心口相應行解一般是名利益于自己也所學佛法自然廣大雖具見聞覺知萬境不能染著即是解脫了悟之人豈無利益傅大士云所作依他𪫬修成功德林終無趣寂意惟有濟羣心行悲悲廣大用智智能深利他兼自利小聖詎能任川禪師云有佛𩂜不得住無佛𩂜急走過三十年後莫言不道頌曰朝遊南嶽暮往天台追之不及忽然自來獨行獨坐無拘繫得寬懷處且寬懷如來説一切諸相即是非相又説一切衆生即非衆生六祖曰如來説我人等相畢竟可破壞非真實體也一切衆生盡是假名若離妄心即無衆生可得故言即非衆生陳雄曰經云凡所有相皆是虛妄人皆謂如來無所説豈説一切虛妄之相殊不知如來有所謂真説而其所説者乃真空無相之相繼之以即是非相者此耳涅槃經云見佛𪫬者不名衆生不見佛𪫬者是名衆生如來説一切諸相者憫之也苟能悟真空無相之理則見自𪫬佛繼之以即非衆生者此耳顏丙曰本性虛明實無可得豈更有一切諸相一切衆生之類李文會曰謂能秉持律儀修行善法而用布施饒益衆生不住諸相諸相本空故云即是非相夫衆生者五隂和合假名衆生川禪師云別有長𩂜不妨拈出頌曰不是衆生不是相春暖黃鶯啼柳上説盡山河海月情依前不會空惆悵休惆悵萬里無雲天一樣須菩提如來是真語者實語者如語者不誑語者不異語者謝靈運曰真不偽實無虛如必當理不誑則非妄語不異則始終恆一聖言不謬故宜修行也陳雄曰是語真實無妄無虛是語如如契真如理非欺誑之語非怪異之語所以破衆生狐疑之心故也顏丙曰真而非假謂之真語實而不虛謂之實語如如不動謂之如語至於不誑語者佛不誑惑於人不異語者佛語不為怪異此五語者欲人生信心不必生疑心李文會曰迷即種種皆妄故不真不實不如有誑有異也悟即一切真一切實一切如不誑不異也又云真語者一切含生皆有佛𪫬也實語者一切法空本無所有也如語者一切萬法本來不動也不誑語者聞如是法皆得解脫也不異語者一切萬法本自空寂將何為異也傅大士云衆生與蘊界名別體非殊了知心是幻迷情見有餘真言言不妄實語語非虛始終無變異𪫬相本來如川禪師云知恩者少負恩者多頌曰兩箇伍伯是一貫阿爺元是丈夫漢分明對靣向渠言爭奈好心無好報真語者實語者呵呵呵喏喏喏須菩提如來所得法此法無實無虛六祖曰無實者以法體空寂無相可得然中有恆沙𪫬德用之不匱故言無虛王日休曰此法但為衆生而設非真𪫬中所有故非為真實也然不可不藉此以悟明真𪫬又非徒然者故非為虛妄也陳雄曰法即以心傳心何法不因心之所立如來以無所得心而得夫真空無相之法此法即此心真體常存一以為實耶然實而若虛莫知其所以為實妙用無方以為虛耶然虛而若實莫知其所以為虛實而無實虛而無虛其亦真空之妙歟李文會曰此法無實者心體空寂無相可得也無虛者內有河沙功德用而不竭也欲言其實無形可觀無相可得欲言其虛見能作用是故不可言有不可言無有而不有無而不無言辭不及其惟聖人乎若不離相修行無由達此法也傅大士云證空便為實執我乃成虛非空亦非有誰有復誰無對病應施藥無病藥還祛須依二空理穎脫入無餘川禪師云水中鹽味色裏膠青頌曰硬似鐵軟如酥看時有覔還無雖然𡵯𡵯常相守要且無人識得渠咦須菩提若菩薩心住於法而行布施如人入暗即無所見若菩薩心不住法而行布施如人有目日光明照見種種色王日休曰布施謂法施乃教化衆生也若菩薩住於法而行布施即是教化衆生著於法無由而見真𪫬故如人入暗則無所見若不著於法以教化衆生則衆生由此開悟而見真𪫬故如人有目又得日光明以照之乃見種種形色也僧若訥曰無相布施心不住法則見真如如人有目日光明照了一切境陳雄曰菩薩云者修行人通稱也設若菩薩心與法俱勝故有所住而行其希求布施此則無明暗障貪愛自蔽不悟真空無相妙理者也如人處暗室之中昏昏𡨋𡨋而一無所見矣設若菩薩心與法俱泯故無所住而行其無希求布施此則豁金剛眼然般若燈圓悟如來無上知見者也如有目者處於皎日之中黑白自分而毫髮無隱矣一注本不顯名曰有所著則為無明所障不悟真如妙理猶昏昏而不能使人昭昭無所著則洞達無礙圓悟如來無上知見自覺已圓又能覺他李文會曰如人入暗即無所見者衆生之心本自無住無住之心即見諸法實相名為菩薩二乘之人心住於法不見諸法實相背菩提路何異凡夫如人背明而入暗室如人有目日光明照見種種色者二乘之人不見色而住色譬如不見坑穽而墜坑穽菩薩見色而不住色譬如見坑穽不墜坑穽一切諸法但有假名二乘之人為無慧眼不辨真假菩薩即有慧眼見種種色悉皆無相故達磨云不見色即是見色耳逍遙翁云所見有是有不是此世間妄眼無是無不是此世間之真眼所知有可有不可此世間妄心無可無不可此出世之真心也須菩提當來之世若有善男子善女人能於此經受持讀誦即為如來以佛智慧悉知是人悉見是人皆得成就無量無邊功德陳雄曰當來世者如來滅後像法末法之世也此經者載真空無相法之經也此經當此世非種善根者難可得值設若能受持讀誦不獨為口耳之學抑亦究心學之妙茲其所以為能也能爾則如來豈庸釋於我必以無上知見而昭鑒之則無量無邊功德舉皆成就矣非特利於一身且將普施於群生非特利於一時且將遍及於千萬億劫所謂無量無邊功德者此也顏丙曰如來所得見𪫬之法不屬有無二境所以道無實無虛若菩薩心著於法布施是為著相既曰著相則無智慧故如人入暗室中全無所見若心不著法布施是人洞達明了不受人瞞故如人本有眼目加以日光明照見種種形色曉然無隱若當來之世有善男善女能於此經受持讀誦直下頓悟謂之受行不暫捨謂之持即為自𪫬如來以者用也能用佛之智慧所謂智慧者見𪫬通徹又非外道聰明也悉知是人悉見是人皆得成就無量無邊見𪫬功德李文會曰當來之世者即是如來滅後後五百歲中濁惡之時也即為如來以佛智慧者若人心常精進讀誦是經即覺慧𪫬漸開應當了悟實相人法二空不被一切善惡凡聖諸境惑亂即同如來智慧𪫬也悉知悉見是人成就功德者三世諸佛無不知見了悟之人故能成就無量無邊功德傅大士頌曰證空便為實執我乃成虛子榮曰修行人悟得真空之理乃達實相如執有我人之見便為妄想成虛也非空亦非有誰有復誰無子榮曰空有俱忘更何可執也對病應施藥無病藥還祛須依一作觀二空理穎脫入無餘川禪師曰因地而倒因地而起地向你道甚麼頌曰世間萬事不如常又不驚人又久長如常恰似秋風至無意涼人人自涼須菩提若有善男子善女人初日分以恆河沙等身布施中日分復以恆河沙等身布施後日分亦以恆河沙等身布施如是無量百千萬億劫以身布施若復有人聞此經典信心不逆其福勝彼何况書寫受持讀誦為人解説王日休曰初日分謂早晨中日分謂日午後日分謂晚間蓋西土之言如此佛生其中而從其方言也然於此經一起信心得福尚多於此一日三時以恆河沙等身命布施百千萬億劫無量無數者以彼雖受無量福報乃世間福耳受世間福者乃染煩惱之因又因以作惡也聞此經典信心不逆則自此種善根矣善根既種則日見增長愈久而愈盛此則為出世間福故彼不可以比而勝於彼無量無數也且人一日三時烏得有恆河沙等身命布施蓋假喻耳乃極言其不可以比也昧雄曰佛恐世人執著如來忍辱之説徒以身布施而於自己𪫬與他人𪫬無纖毫利益故於十三分言之至此復言屢救其失肇法師云從旦至辰名初日分從辰至未名中日分從未至戌名後日分於此三時乃至無量百千萬億劫捨身布施亦不及受持是經見自𪫬耳見自𪫬者謂深明實相人法二空乃是大悟人也傅大士頌曰衆生及壽者蘊上假虛名如龜毛不實似兔角無形寒山詩曰身著空花衣足躡龜毛履手把兔角弓擬射無明鬼龜本無毛而謂之龜毛兔本無角而謂之兔角皆假虛名耳今衆生壽者五蘊之上豈有是亦假虛名而謂之衆生謂之壽者亦猶龜毛之不實兔角之無形也捨身由妄識施命為迷情詳論福與智不及受持經李文會曰信心不逆者信順於理故云不逆法華經云瞻仰尊顏目不暫捨心常精進無有間斷也受持讀誦者行解相應謂之受勇猛精進謂之持心不散亂謂之讀見𪫬不逆謂之誦為人解説者謂已悟人能見自𪫬方便為人解説此經令悟實相成無上道此人所施無所住相功德無有邊際勝前百千萬億劫以身布施功德百千萬倍川禪師云人天福報即不無佛法未夢見在頌曰初心後發施心同功德無邊算莫窮爭似信心心不立一拳打破太虛空須菩提以要言之是經有不可思議不可稱量無邊功德肇法師曰明此法門所有功德過心境界故不可以心思也過言境界故不可以口議也王日休曰所謂不可思議者不可以心思不可以言議也不可稱量者既言不可議則此所謂稱者非稱説之稱乃稱量之稱古者稱與稱字通用謂不可以稱稱也不可量者謂不可以器物量之也顏丙曰每日三次以恆河沙比身布施沙者言其多也如是積至無量不可數劫布施不如於此經典信心不逆不逆乃順行也其福尚能勝彼有為之福何况更能發心書寫受持讀誦為他人開解講説佛以簡要言之是經有不可思議稱量者蓋諸佛讚嘆不及此功德至大無有邊際也李文會曰無邊功德者若人於此經典了悟人法二空深明實相功德廣大即同佛心無有邊際不可稱量也如來為發大乘者説為發最上乘者説王日休曰乘乃車乘之乘大乘謂菩薩乘也阿羅漢獨了生死不度衆生故云小乘蓋如車乘之小者唯能自載而已緣覺之人半為人半為己故為中乘蓋如車乘之適中者也菩薩為大乘者謂如車乘之大者普能載度一切衆生也此經欲普度一切衆生故為發菩薩大乘者説也發乃起發之發發大乘謂起發此以濟度衆生也最上乘者謂佛乘也佛又能兼菩薩而載度之則在大乘之上故為最上乘以此乘之上不復有乘故為最上也此經又為起發佛乘者説謂佛之化度菩薩亦以此經之理也李文會曰為發大乘者説者智慧廣大能見自𪫬色空俱遣不著二邊二邊既無即無中道可立不染萬境即是大乘菩薩所行之道也又曰為發最上乘者説者不見垢穢可厭不見清淨可求無遣可遣亦不言無遣無住可住亦不言無住心量廣大廓若太虛無有邊際即是最上乘諸佛地位也黃蘖禪師云如來現世欲説一乘真法則衆生不信興謗沒於苦海若都不説則墮慳貪不為衆生普捨妙道遂設方便説有三乘乘有大小得有淺深皆非定法故云唯有一乘道餘二則非真也川禪師云如斬一握絲一斬一切斷頌曰一拳打倒化城關一腳躍玄妙寨南北東西信步行休覓大悲觀自在大乘説最上説一棒一條痕一掌一握血若有人能受持讀誦廣為人説如來悉知是人悉見是人皆得成就不可量不可稱無有邊不可思議功德如是人等即為荷擔如來阿耨多羅三藐三菩提謝靈運曰千載不墜由於人弘任持運行荷擔義也李文會曰廣為人説知見是人皆得成就不可思議功德者此謂上根器人深明此經了悟佛意持此大乘經典為人解説令諸學者各見自𪫬無相之理得見本源自心是佛當知此人功德無有邊際不可稱量也馬祖曰汝等諸人須信自心是佛此心即是佛心又云心外無別佛佛外無別心佛國白禪師云心心即佛佛心心佛佛心心即佛心心佛悟來無一物將軍止渴望梅林華嚴經云若不信自心是佛無有是𩂜圜悟禪師云即心即佛已是八字打開非佛非心重問當陽點破不尋其言一直便透方見古人赤心片片若也躊蹰則當靣蹉過了也心佛頌云佛即心兮心即佛心佛從來皆妄物若知無佛復無心始是真如法身佛佛佛佛沒模樣一顆圓光含萬象無體之體即真體無相之相即實相非色非空非不空不動不靜不來往無異無同無有無難取難捨難指望內外圓明到𩂜通一佛國在一沙中一粒沙含大千界一箇身心萬箇同知之須會無心法不染不淨為淨業善惡千端無有無便是南無大迦葉黃蘖禪師云汝但除却凡情聖境心外更別無佛祖師西來直指一切人全體是佛汝今不識執凡執聖向外馳返自迷心所以向汝道即心是佛一念情生即隨異趣無始以來不異今日無有異法故名成等正覺即為荷擔如來阿耨多羅三藐三菩提者聞經解義如説修行廣為人説無相之法令諸學者悟明心地能行無相無著之行開發心中智慧光明離諸塵勞妄念共成無上菩提當知此人負荷自𪫬如來阿耨多羅三藐三菩提在於身內也傅大士云遍計於先了圓成證此時宿乘無礙慧方便勸人持川禪師云擘開太華手須是巨靈神頌曰堆山積嶽來一一盡塵埃眼裏瞳人碧胸中氣若雷出邊沙塞靜入國貫英才一片寸心如海大波清幾見去還來何以故須菩提若樂小法者著我見人見衆生見壽者見則於此經不能𥊸受讀誦為人解説王日休曰樂去聲好也小法謂外道法也外道之法正為著於有我人衆生壽者故為種種之説如此則於此經不相合矣故不能聽受讀誦為人解説也陳雄曰小法者小乘法也法華經云鈍根樂小法言其志意下劣不發大乘心者也是人墮於邪見不知所謂大乘最上乘法盡在此經且不聽誦况能為人解説乎著我人見墮邪見也圓覺經云求大乘者不墮邪見是也李文會曰若樂小法者凡夫愚鈍之重不能聽信廣學無上菩提只修福慧六道輪回因果之法縱能強學執著多聞為人解説被明眼人覷著手忙腳亂一場敗闕保寧勇禪師云顏色規模恰似真人前拈弄越光新及乎入火重烹試到了終歸是假銀黃蘖禪師云古人心利才聞一言便乃絶學所以喚作絶學無為間道人也今時人只欲多知多解廣求文義喚作修行不知多知多解成壅塞皆為毒藥盡向生滅中取真如之中都無此事從前所有一切解𩂜𥁞須併却令空即是空如來藏如來藏者更無纖塵可有即是破有法王出現世間亦云我於然燈佛所無有少法可得此語只為空你情解知量但消融表裏情盡都無依執是無事人三乘教綱只是應機之藥隨宜所説臨時施設各各不同但能了知即不被惑苐一不得於心境上守文作解何以如此實無有定法如來可説我此宗門不論此事但止息念亡慮即休更不用思前慮後又云學般若人不見有一法可得絶意三乘唯一真實不可證得謂我能證能得者皆增上慢人法華會上拂衣而去者皆斯徒也是故佛言我於阿耨多羅三藐三菩提實無所得默契而已學者思之但止依正法修行放下我人衆生壽者四相即不被一切諸境惑亂修行正法眼藏云若欲修行當依正法心體離念相等虛空不落聖凡身心平等如是修者是為正法也川禪師云仁者見之謂之仁智者見之謂之智頌曰不學英雄不讀書波波役役走長途娘生寶藏無心用甘作無知餓死夫爭怪得別人須菩提在在處處若有此經一切世間天人阿修羅所應供養當知此處即為是是皆應恭敬作禮圍繞以諸華香而散其處陳雄曰在在𩂜𩂜言所在之𩂜不一也若有此真經譬如摩尼寶珠瑞光輝煥則凡在天道人道阿修羅道者所應供養即此處便是如來真身舍利寶其誰不恭敬禮拜圍繞以諸華香而散其𩂜諸華香與法華經所謂須曼那華香闍提華香末利華香瞻蔔華香赤蓮華香青蓮白蓮華香是也顏丙曰大乘者乃大根大器之人一撥便轉不樂小法最上乘者不居佛位不重己靈高超十地大藏一覽集云菩薩十地者歡喜地證聖位故離垢地身心清淨發光地智已生明焰慧地妙解廓照現前地通達真俗難勝地功行超越遠行地隨方應化不動地忍智自如善慧地通力自在法雲地大智圓明明了大法此謂百尺竿頭更進一步底人長沙云百尺竿頭不動人雖然得入未為真百尺竿頭須進步十方世界現全身僧問果如百尺竿頭如何進步南泉云朗州山澧州水僧云請師道答云四海五湖皇化裏此二等人即為負荷自𪫬如來阿耨菩提若愛樂小法者小法即世間有為法則著四相既著四相宜其不能𥊸受解説此經在在𩂜𩂜若有悟此經即如佛天人阿修羅皆恭敬作禮常持花香而散持經之處供養此人是謂一人辦心諸天辦供也傅大士頌曰所作依他𪫬修成功德林子榮曰所作依他𪫬者凡日用施為皆是真如妙用故云依他𪫬修成功德林者修習成就菩提道果也終無趍寂意唯有濟群心子榮曰終無趍寂意唯有濟群心者即不效小乘人且期自利沉空趍寂唯有大乘利衆生心也護法論云傅大士齊建武四年丁丑五月八日生時有天竺僧嵩頭陀來謂曰我昔與汝毗婆尸佛所同發誓願今兜率天宮衣鉢見在何日當還大士曰度生為急何思彼樂乎蓋謂度生為急者即唯有濟群心何思彼樂者即終無趨寂意也行悲悲廣大用智智能深利他兼自利小聖詎能任小聖乃小乘人也李文會曰在在處處若有此經者一切衆生六根運用種種施為常在法𪫬三昧之中若悟此理即在在處處有此經也一切世間者謂有為之心也天人阿修羅者天者逸樂心人者善惡心阿修羅者瞋恨心但存此心不得解脫所應供養者若無天人阿修羅心是名供養即為是者解脫之𪫬巍巍高顯故云是也以諸花香而散其處者當於解脫𪫬中開敷知見薰植萬行即法界𪫬自然顯現川禪師曰鎮州蘿蔔雲門糊餅僧問趙州親見南泉是否州云鎮州出大蘿蔔頭僧問雲門如何是超佛越祖之談門云糊餅又云作麼生是聞聲悟道見色明心乃云觀音菩薩將錢來買糊餅放下手云元來只是饅頭頌曰與君同又同鄉起坐相從嵗月長渴飲飢餐常對靣不須回首更思量復次須菩提若善男子善女人受持讀誦此經若為人輕賤是人先世罪業應墮惡道以今世人輕賤故先世罪業即為消滅當得阿耨多羅三藐三菩提僧若訥曰上明生善今明滅惡造作定業不可逃避行般若故易重為輕大論云先世重罪應入地獄以行般若故現世輕受譬如重囚應死有勢力護則受鞭杖而已陳雄曰持此真經有彌天功德為天人所恭敬供養宜矣今且為人所輕賤何也蓋是人前生罪業深重當墮地獄餓鬼畜生阿修羅道永無出期以今生持經之功止為人輕賤罵辱而已則前生罪業為之銷除當來世佛果菩提可得成就矣世人喜於為惡嫉於為善者多矣一見是人為人輕賤便為讀經為無益福報為虛語甚者有雲門之罵藥山之戒使人人起退轉心佛之言此所以長善而救失云顏丙曰若人前世曾作罪業故今世被人輕賤應墮落惡道若能受持讀誦此經直下見性如大虛空方知罪𪫬本空故云先世罪業即為消滅又得無上正等正覺昔有二比丘一犯罪一犯殺罪中心不安求波羅尊者懺悔波羅即以小乘法為彼雪懺二比丘愈生疑懼後遇維摩大士却為解説云罪𪫬本空不在中間內外二比丘聞之頓悟直下寂然空闊無罪可得所以永嘉云維摩大士頓除疑猶如赫日消霜雪傅大士頌曰先身有報障今日受持經暫被人輕賤轉重復還輕若了依他起能除遍計情常依般若觀去聲何慮不圓成李文會曰此謂若人受持讀誦此經應合得人恭敬今復有疾患貧窮諸衰反為人所憎惡世人不達先業將謂誦經為善即無應驗遂生疑惑殊不知若非經力應墮惡道以今世人輕賤故折三塗之報速得無上菩提張無𥁞云四序炎涼去復還聖凡只在剎那間前人罪業今人賤倒却前人罪業山川禪師云不因一事不長一智頌曰讚不及毀不及若了一萬事畢無欠無餘若太虛為君題作波羅蜜須菩提我念過去無量阿僧祇劫於然燈佛前得值八百四千萬億那由他諸佛悉皆供養承事無空過者若復有人於後末世能受持讀誦此經所得功德於我所供養諸佛功德百分不及一千萬億分乃至算數辟喻所不能及疏鈔云佛言我之供佛功德千萬億倍不及持經功德一分故云算數譬喻所不能及王日休曰梵語阿僧祇此云無央數梵語那由他此云一萬萬於無量無央數劫在然燈佛先則釋迦佛説此經時去然燈佛已無量無數矣又於其先遇八百四千萬億那由他諸佛出世則其劫數固不勝其多佛眼皆能見之以慧𪫬為無窮故無始以來事皆知之此所以為佛也人皆有此慧𪫬但蔽之耳供養如是諸佛其功德終不可及此經功德以彼則為財施受財施之報者日漸少而終至於有盡此則為善根善根則日滋長而終至於成佛故無窮也以有盡比無窮所以不可及也陳雄曰阿僧祇那由他梵語皆無數之謂歷無數劫供無數佛求福而已不若持此真經見自本𪫬永離輪回五祖云終日供養只求福田不求出離生死苦海自𪫬若迷福何可救是故供佛功德雖百分百千萬億分乃至算數之多譬如塵恆沙皆不及持經功德之一分也末世人徒知事佛而不知佛究竟處盡在此經捨經何從而得是以作如是説而第其優劣梁武帝造寺布施供佛設齋問達磨祖師有何功德答曰實無功德後人不了此意韶州韋使君因問六祖六祖大師開示之曰造寺布施供佛設齋名為修福不可將福以為功德功德在法身中非在修福又曰功德在自𪫬不是布施供養之所求此所以福不及功德供佛不及持經也李文會曰阿僧祇劫者梵語也唐言無數時供養阿僧祇恆河沙佛施寶滿二千大千世界捨身數如塵所得功德不如有人於此經典得悟真𪫬勝前所得功德百千萬億達磨對梁武帝云造寺寫經供養布施功德只獲人天小果實非功德也川禪師云功不浪施頌曰億千供佛福無邊爭似常將古教看白紙上頭書黑字請君開眼目前觀風寂寂水漣漣謝家人秪在漁船須菩提若善男子善女人於後末世有受持讀誦此經所得功德我若具説者或有人聞心即狂亂狐疑不信僧若訥曰狐疑者狐是獸一名野干其𪫬多疑每渡河氷且𥊸且渡上雖較量顯福德之多猶是略説若更具説聞者狐疑心必狂亂李文會曰所得功德我若具説者謂説悟後淨妙境界也前為樂小法者為説降住小乘之法欲令悟入尚茲不信若便為説見𪫬大乘之法解通人曠得必無涯狂亂不信徒使其狐疑也須菩提當知是經義不可思議果報亦不可思議王日休曰具盡也我若盡説其功德人聞之心則狂亂狐疑不信以其極大人則驚怪故甚者心則狂亂其次則疑惑不信也當知是經義不可思議果報亦不可思議者謂此經之義不可以心思亦不可以言議若人依此修行及得果報亦豈可以心思言議佛數數言此經功德至此又極稱之者豈虛言以其悟明真𪫬脫離輪回之本是豈有窮盡耶顏丙曰梵語阿僧祇劫此云不可數劫佛於然燈佛前得值無數諸佛一一供養承事未曾空過若後世有人受持讀誦此經所得見𪫬功德比我前供養功德百分不及他一分見𪫬功德有百千萬億分算數譬喻所不能及佛言我若説持經功德或人聞之心生狂亂疑惑不信當知此經不可思議果報亦不可思議不信佛言反生誹謗惡果既熟必受惡報李文會曰義者般若之義般若者智慧也果報者所得功德也由智慧而悟真𪫬三世諸佛理應不異不可思議謝靈運曰萬行淵深義且難測菩提妙果豈有心之所議川禪師云各各眉毛眼上橫頌曰良藥多苦口忠言多逆耳冷暖自知如魚飲水何須他日待龍華今朝先授菩提記爾時須菩提白佛言世尊善男子善女人發阿耨多羅三藐三菩提心云何應住云何降伏其心佛告須菩提善男子善女人發阿耨多羅三藐三菩提心者當生如是心我應滅度一切衆生滅度一切衆生已而無有一衆生實滅度者疏鈔曰言滅度一切衆生已者時中妄想取捨人我貪嗔嫉妬一切不善心即是一切衆生以無我心將忍辱以降伏令邪惡不生即是滅度一切衆生已已即盡也言而無有一衆生實滅度者即煩惱妄念取捨貪嗔一切不善心本自不有因貪財色恩愛情重方有此心今既知覺以正智而滅之亦不可見實有滅者本自不生今亦不滅故云而無有一衆生實滅度者陳雄曰大涅槃經曰自未得度先度他懺法曰先度衆生然後作佛故度一切衆生者我佛之所應為也不然則絶物矣又何以作佛耶佛了真空無相則能所俱寂雖衆生已滅度且不起能度之一念亦不見所度之衆生故曰無一衆生實滅度者李文會曰云何應住云何降伏其心者注見善現起請分中當生如是心者謂二乘之人執著諸相起諸妄念如來指示令其心常空寂湛然清淨馬祖云常教心如迷人不辨方所文殊師利云心如虛空故敬禮無所觀百丈禪師云心如虛空相似學始有成也黃蘖禪師云心淨其心更無別法此即真佛佛與衆生一心無異猶如虛空無雜無染如大日輪照四天下日升之時明遍天下虛空不曾明日沒之時暗遍天下虛空不曾暗明暗之境自相凌奪虛空之𪫬廓然不變佛與衆生心亦如是我應滅度一切衆生者佛言我今欲令一切衆生除滅妄念令見真𪫬白樂天云淡然無他念虛靜是吾師圭峯禪師云覺諸相空心自無念念起即覺覺之即無修行妙門唯在此也慈受禪師云有利根者一撥便轉𪫬頑鈍者只在夢中山僧有箇醒磕睡底道理不免傾心吐膽而為諸人説破良久云且勤照管鼻孔愚者若見此一如路逢客智者見點頭恰如飢得食滅度一切衆生已而無有一衆生實滅度者此謂不可見有衆生是自己度者若有此念即著我人衆生壽者四相即非菩薩清淨心也川禪師云有時因好月不覺過滄洲頌曰若問云何住非中及有無頭無纖草蓋足不履閻浮細似鱗虛析輕如蝶舞初衆生滅盡知無滅此是隨流大丈夫何以故須菩提若菩薩有我相人相衆生相壽者相即非菩薩所以者何須菩提實無有法發阿耨多羅三藐三菩提心者六祖曰須菩提問佛如來滅後後五百歲若有人發阿耨多羅三藐三菩提心者依何法而住如何降伏其心佛言當發度脫一切衆生心度脫一切衆生盡得成佛已不得見有一衆生是我滅度者何以故為除能所心也除有衆生心也亦除我見心也王日休曰此分大槩如第三分所言須菩提於此再問者豈非為續來聽者問乎佛再言之唯增實無有法發阿耨多羅三藐三菩提心者一句且上既言發阿耨多羅三藐三菩提心者當生如是心生如是心則是法矣若無法烏能得見真𪫬而成佛乎然此乃言實無有法發阿耨多羅三藐三菩提心何也蓋上言當生如是心者是心亦非真𪫬中所有亦為妄爾故此言實無有法其意乃在於實字謂究其實則真𪫬中無此也佛恐弟子誤認所謂當生如是心者為真實故此又説破以為非實也然則非徒本無一切衆生而發此求真𪫬之心者亦本無法蓋真𪫬中本來蕩然空空所謂一法不立一塵不染者是也顏丙曰當生如是心者當發這箇心佛度衆生已𥁞𪫬本空故無一衆生可滅度者若生四相望報心即非菩薩實無有法發阿耨多羅三藐三菩提心者蓋實際不受一塵何有於法李文會曰即非菩薩者謂二乘之人執著我人衆生壽者四相解注已見前實無有法者謂初悟人尚有細四相也但少有悟心是我相見有智慧能降伏煩惱是人相見降伏煩惱意是衆生相見清淨心可得是壽者相不除此念皆是有法故云實無有法發阿耨多羅三藐三菩提心者傅大士云空生重請問無心為自身欲發菩提者當了現前因行悲疑似妄用智最言真度生權立我證理即無人川禪師云少他一分又爭得頌曰獨坐翛然一室空更無南北與西東雖然不借陽和力爭奈桃花一樣紅須菩提於意云何如來於然燈佛所有法得阿耨多羅三藐三菩提不王日休曰如來佛自謂也然燈佛乃釋迦牟尼佛本師也佛呼須菩提問云我始於本師然燈佛處有法所得名之為無上正等正覺之真𪫬否不也世尊如我解佛所説義佛於然燈佛所無有法得阿耨多羅三藐三菩提六祖曰佛告須菩提我於師處不除四相得授記不須菩提深解無相之理故言不也李文會曰佛言如來於然燈佛所有法得三菩提不者須菩提謂若有般若了悟心在即是有法尚有所得之心故云無有法得三菩提也佛言如是如是李文會曰佛言如是如是者善契如來之法意也川禪師云若不同床臥爭知紙被穿頌曰打鼓弄琵琶相逢兩會家君行楊柳岸我宿渡頭沙江上晚來初雨過數峯蒼翠接天霞須菩提實無有法如來得阿耨多羅三藐三菩提王日休曰佛深以須菩提之言為當故再稱如是復呼須菩提而隨其言以為實無有法如來所得名為無上正等正覺之真𪫬者深然之之意也須菩提若有法如來得阿耨多羅三藐三菩提者然燈佛即不與我授記汝於來世當得作佛號釋迦牟尼王日休曰若有法可得則然燈佛即傳之矣何待授記當來世方得作佛耶釋迦之義此云能仁牟尼之義此云寂默能仁者即心𪫬無邊含容一切寂默者即心體本寂動靜不干也釋迦於周昭王二十四年歲在甲寅四月八日化從母右脅而生自行七舉其右手作師子吼天上天下惟我獨尊九龍空中吐清淨水濯太子身名悉達多此言頓吉至穆王五十三年歲次壬申二月十五日於俱尸羅國大城娑羅樹間示般涅槃世尊住世七十九年也一注本不顯名曰萬法本空若於法有得是為執相心即有礙若於覺有證是於有我能所未除佛豈即證授記者謂能了悟真𪫬必得成佛也李文會曰若有一切法是有一切心故云即非佛法若無一切法是無一切心云何不是佛故龍牙和尚云深念門前樹能令鳥泊棲來者無心喚去者不慕歸若人心似樹與道不相違與我授記當得作佛號釋迦牟尼者始因智慧而得見𪫬若有能所之心即是有法可得𪫬同凡夫如何得授記耶然無記可記是名授記若於心上無纖粟停留即是無法可得自𪫬清淨故云來世當得作佛慈受禪師云一顆靈丹大似拳服來平地便升仙塵緣若有絲毫在蹉過蓬萊路八千傅大士云人與法相待二相本來如法空人是妄人空法亦祛人法兩俱實授記可非虛一切皆如幻誰言得有無川禪師云貧似范丹氣如項羽頌曰上無片瓦下無卓錐日往月來不知是誰噫以實無有法得阿耨多羅三藐三菩提是故然燈佛與我授記作是言汝於來世當得作佛號釋迦牟尼何以故如來者即諸法如義王日休曰且此所謂如來者本謂真𪫬佛蓋如者謂真𪫬遍虛空世界而常自如若欲現而為一切無不可者故謂之如又隨所感而來現故名如來是如來者真𪫬之名也故詳言之則為阿耨多羅三藐三菩提略言之則為如來又略言之則為佛然則佛與如來者有時指色身而言若如來有肉眼不如來以其佛智悉知是人是也此則謂真𪫬耳真𪫬又名真如者謂外物皆妄唯𪫬為真其言如者乃上文所謂真𪫬自如而無所不可現之意也故以真實之𪫬為真如而又謂之如來也僧若訥曰如來者即真如也真如不離諸法故云即諸法如義陳雄曰佛辨論如來膺釋迦尊號者何故蓋以了諸法空得如如之義也如者真如也楞伽經云離不實妄想是名如如住如如者得無所有境界故維摩經云如者不二不異一切法亦如也衆聖賢亦如也至於彌勒亦如也李文會曰一切諸法本來清淨蓋由取捨分別諸法所以濁亂不得自如心若清淨即自然如中天杲日歷歷分明於諸法上都無取捨分別即是諸法如義又云若不修因即無證果須無因果法之可得諸法皆如如理即佛傅大士云法𪫬非因果如理不從因謂得然燈記寧知是舊身川禪師云且住且住文殊與淨名對談不二如何是不二不得動著動著則三十棒頌曰上是天兮下是地男是男兮女是女牧童撞著看牛兒大家齊唱囉囉哩是何曲調萬年歡若有人言如來得阿耨多羅三藐三菩提須菩提實無有法佛得阿耨多羅三藐三菩提王日休曰佛謂若有人言佛得無上正等正覺之真𪫬是人則為妄語何則真𪫬者佛本來自有之止為除盡外妄乃見真𪫬耳凡言得者皆自外而得此真𪫬豈有自外而得故言得者則為不實語也佛乃呼須菩提而自答云非有法如來得之名其法為無上正等正覺之真𪫬也蓋𪫬則吾之本有法則自外而來惟假法以去除外妄而明真𪫬豈謂於法有所得而名為真𪫬陳雄曰如來於菩提無上道得之心傳於法實無所得不善言如來者言如來有所得是不明如來心傳之語佛故呼須菩提而告之曰實無有法可得蓋沮人言之謬妄也須菩提如來所得阿耨多羅三藐三菩提於是中無實無虛王日休曰如來所得正覺之法者謂佛所得以明真𪫬之法也此非真𪫬中所有故曰非實謂亦為妄也然必賴於此以明真𪫬故云非虛陳雄曰如來了無所得而其所得者菩提無上道耳蓋菩提無上道有真空妙理存乎其間實而無實虛而無虛與十四分如來所得法同僧師曰無實者以菩提無色相故無虛者色相空處即是菩提故知如來所證菩提之法不空不有故曰無實無虛李文會曰於是中者清淨心也無實者真空無分別故境界經云諸欲不染故敬禮無所觀無虛者妙用也具河沙德用也川禪師云富嫌千口少貧恨一身多頌曰生涯如夢若浮雲活計都無絶六親留得一雙青白眼笑看無限往來人是故如來説一切法皆是佛法王日休曰因是之故佛説諸法皆是用之以修行而成佛之法也然則法又豈可以無今禪家絶不用法大背經意矣佛所以隨説而又掃去者蓋謂不可泥於法耳豈可絶無法傅大士之頌曰渡河須用筏到岸不須船今禪家不用法乃未到岸而不須船者豈不自溺於苦海且誤人於苦海陳雄曰佛即心也心即法也有是佛心則必有佛法如來説一切法無一切外道邪説廁於其間故斷之曰皆是佛法李文會曰一切世法皆是佛法涅槃經云佛即是法法即是佛馬祖云一切衆生從無量劫來不出法𪫬三昧長在法𪫬中著衣喫飯言談秪對六根運用一切施為盡是法𪫬不解返源所以隨名逐相迷情妄起造種種業若能一念回光返照全體聖心何處不是佛法川禪師曰明明百草頭明明祖師意頌曰會造逡巡酒能開頃刻花琴彈碧玉調爐煉白硃沙幾般伎倆從何得須信風流出當家須菩提所言一切法者即非一切法是故名一切法王日休曰佛又恐人泥於法故又呼須菩提而言所言一切法者即非真實一切法但假此以修行耳非真𪫬中所有故虛名為一切法而已顏丙曰如來者即諸法如義乃如如不動之意於是中無實無虛無實者向甚處摸索無虛者何處不分明虛實乃斷見常見大士云斷常俱不染所以道即非一切法李文會曰謂於諸法心無所得了諸法空本無一切法也法華經云諸法從本來常自寂滅相故古德云用即知而常寂不用即寂而常知方契妙覺是故名一切法也川禪師云上大人丘乙己頌曰是法非法不是法死水藏龍活潑潑是心非心不是心逼塞虛空古到今秪者是絶追尋無限野雲風捲盡一輪孤月照天心須菩提譬如人身長大須菩提言世尊如來説人身長大即為非大身是名大身王日休曰須菩提以嘗聞佛説此語故曉此理乃呼世尊而答云如來説人身長大則非真實大身是虛名為大身而已苐十分所言是也傳本第十分王本十二分李文會曰色身有相為非大身法身無相廣大無邊是名大身黃蘖禪師云虛空即法身法身即虛空是名大身也川禪師曰喚作一物即不中南嶽懷讓禪師見六祖祖問什麼處來曰嵩山來祖曰是什麼物恁麼來曰説似一物即不中頌曰天産英靈六尺軀能文能武善經書一朝識破娘生靣方信間名滿五湖須菩提菩薩亦如是若作是言我當滅度無量衆生即不名菩薩王日休曰梵語菩薩此云覺衆生佛又呼須菩提而言菩薩亦如是者此如是乃指上文蓋謂覺衆生者亦非為真實亦如大身之不為真實徒虛名而已何則真𪫬中豈有覺衆生惟有佛謂之覺覺即真𪫬也若作是言者此是言乃指下文謂我當滅度無量衆生即不名菩薩者謂以衆生為有而我乃化之成佛而得滅度如此見識則不可名之為覺衆生以一切衆生於真𪫬中本無惟從業緣中現故不可以為有也李文會曰即不名菩薩者二乘之人若有煩惱妄想不能除滅即同凡夫滅色取空不了色𪫬即非菩薩淨名經云色𪫬自空非色滅空如病眼人見空中花無有是𩂜傅大士云名因共業變萬象即生若悟真空色翛然獨有名何以故須菩提實無有法名為菩薩王日休曰佛又自問何故上文之意謂一切衆生為有者不名為覺衆生乎乃呼須菩提而自答云實無有法名為覺衆生者謂真𪫬中實無法以名為覺衆生也且修行而至於菩薩者誠賴佛所説之法故知修行之理而此言實無有法者特謂真𪫬中無此法耳李文會曰實無有法名為菩薩者一切空寂本來不生不見有生死不見有涅槃不見有善惡不見有凡聖不見一切法是名見法正見之時了無可見即是菩薩故云實無有法名為菩薩是故佛説一切法無我無人無衆生無壽者王日休曰是故者謂上文所言之故也乃謂實無有法名為覺衆生之説也佛説一切法無我無人無衆生無壽者謂佛説諸法皆謂我人衆生壽者本無有也此四者統而言之皆謂之衆生此衆生既本無有烏得有覺衆生乎陳雄曰上文言實無有法尚何有法可説耶然佛本無言説其所説者不過真空無相維摩經云法無衆生離衆生垢故法無有我離我垢故法無壽命離生死故法無有人前後際斷故此真空無相法也佛説一切法者此耳外此則我佛無所説顏丙曰色身長大爭奈有生滅有限量即非大身若造作此言我當滅度無量衆生即不名菩薩迷則佛衆生悟則衆生佛實無有法名為菩薩是故佛説一切法無四相可得川禪師曰喚牛即牛呼馬即馬頌曰借婆衫子拜婆門禮數周旋已十分竹影掃階塵不動月輪穿海水無痕須菩提若菩薩作是言我當莊嚴佛土是不名菩薩疏鈔云言佛土者心土也佛土無相云何莊嚴若有莊嚴法即是增陳雄曰以㝎慧之寶莊嚴心佛土者菩薩也不言其功而人莫見其迹以金珠之寶莊嚴世間佛土者凡夫也自言其功而常急於人知文殊般若經云為一切衆生發大莊嚴而心不見莊嚴之相菩薩如是豈肯自言其功若作是言是四種相未除即凡夫之見其誰名為菩薩耶李文會曰我當莊嚴佛土是不名菩薩者妙定經云若人造作白銀精舍滿三千大千世界雖有無量布施福德謂心有能所即非菩薩不如一念無能所心所得功德勝前功德百千萬倍何以故如來説莊嚴佛土者即非莊嚴是名莊嚴肇法師曰此明不達法空取莊嚴淨土故非菩薩復明離相無為莊嚴佛土也王日休曰此與苐十分之意同溥本第十分王本十一分於此再言者為續來聽者説故兼説下文也陳雄曰如來所説者莊嚴心佛土也心佛土本來清淨無相何假莊飾故云即非莊嚴常人以莊嚴為莊嚴而如來則以非莊嚴為莊嚴有妙莊嚴存焉是則所以名其為莊嚴故淨土論云備諸寶𪫬具足妙莊嚴世人著世間佛土而不知反佛前言而此復言救弊云爾顏丙曰心常清淨不染世緣是為莊嚴佛土也雖日莊嚴不可作莊嚴相故曰即非莊嚴但強名而已李文會曰即非莊嚴是名莊嚴者實無有法可得阿耨多羅三藐三菩提實無有法名為菩薩豈復取莊嚴相如是即逍遙自在無纖毫罣礙云何是莊嚴云何不是莊嚴故云即非莊嚴是名莊嚴也須菩提若菩薩通達無我法者如來説名真是菩薩王日休曰據楞伽經説二無我謂人無我與法無我也人無我者謂人無本體因業而生法無我者謂法無本體因事而立若作富貴之業則生於富貴中作貧賤之業則生於貧賤中是人無本體也若因欲渡水則為舟楫之法因欲行陸則為車輿之法是法本無體也一切法皆因事而立即是假合假合即為虛妄若信此理而悟解之是真菩薩之見識故云如來説名真是菩薩顏丙曰通達無我法者直下大悟如漆桶底脫四通八達廓然無我我身既無何更有法人法雙忘只這真是菩薩更莫別求李文會曰通達無我法者於諸法相無所滯礙是名通達若作有所能解是名我相若作無所能解湛然清淨是名無我故云真是菩薩僧問馬祖作何見解即得達道答云自𪫬本來具足但於善惡事上不滯方喚作道人的取善捨惡觀空入定皆屬造作更若向外馳求轉踈轉遠一念妄想便是三界生死根本但無一念是除生死根本即得法王無上寶傅大士頌曰人與法相待二相本來如法空人是妄人空法亦祛人法兩俱實授記可非虛一切皆如幻誰言得有無川禪師曰寒即普天寒熱即普天熱頌曰有我元無我寒時燒軟火無心似有心半夜拾金針無心無我分明道不知道者是何人呵呵須菩提於意云何如來有肉眼不如是世尊如來有肉眼須菩提於意云何如來有天眼不如是世尊如來有天眼須菩提於意云何如來有慧眼不如是世尊如來有慧眼須菩提於意云何如來有法眼不如是世尊如來有法眼須菩提於意云何如來有佛眼不如是世尊如來有佛眼日月殊光如來解曰言肉眼者照見胎卵濕化色身起滅因緣也言天眼者照見諸天宮殿雲雨明暗五星二曜旋伏因緣也言慧眼者照見衆生慧𪫬深淺上品下生輪回託隂因緣也言法眼者照見法身遍充三界無形無相盡虛空遍法界因緣也言佛眼者照見佛身世界無比放光普照破諸黑暗無障無礙圓滿十方尋光見體知有涅槃國土也此五眼如來其中若有上根上智之人能識此五種因緣即名為大乘菩薩也陳雄曰華嚴經云肉眼見一切色故天眼見一切衆生心故慧眼見一切衆生諸根境界故法眼見一切法如實相故佛眼見如來十力故一是𠁅非𠁅如實力二知三世報業力三知諸禪解脫三昧力四知衆生諸根上下力五知衆生種種欲力六知世間種種𪫬力七知一切道至力八得夙命智力九得天眼能觀一切力十得漏盡智力大般若經所謂清淨五眼是也世尊設五眼之問須菩提皆以有如是之理可謂善問答矣顏丙曰化身觀見為肉眼普照大千為天眼智燭常明為慧眼了諸法空為法眼自𪫬常覺為佛眼有僧問尊宿云觀音菩薩用許多手眼作麼尊宿云通身是手眼若人於這裏薦得一眼也無豈更落三落四然雖如是須是箇漢始得能具足此五眼者唯自𪫬如來也五眼度世品經云佛言隨世開化入於五道而淨五眼一肉眼處於世間現四大身因此開化度脫衆生二天眼諸天在上及在世間未識至道示以三乘三慧眼其不能解智度無極皆開化之使入大慧四法眼其在𥚹局不能恢泰悉開化之解法身一無去來令平等三世五佛眼其迷惑者不識正真隂蓋蓋者遮也所譬如睡眠示以四等四恩之行布施持戒忍辱精進一心智慧善權方便進退隨宜不失一切令發正真道意李文會曰一切凡夫皆具五眼而被迷心蓋不能自見若無迷心妄念如得翳障退滅五眼開明見一切色也內外空寂名為肉眼見自真𪫬是法平等名為天眼見自𪫬中般若之智名為慧眼見諸色相心不動搖見一切法無一切法見一切相無一切相是名法眼見前際無煩惱可斷中際無自𪫬可守後際無佛可求三際清淨是名佛眼又云若以無相為法身者名為慧眼而見如來指空論有假立名相名為法眼而見如來若了有無即非有無二邊寂滅全體法身周遍法界者具足佛眼而見如來傅大士頌曰天眼通非閡肉眼閡非通法眼唯觀俗慧眼直緣空佛眼如千日照異體還同圓明法界內無𩂜不含容川禪師云盡在眉毛下頌曰如來有五眼張三秪一雙一般分皂白的的別青黃其間些子爻訛𩂜六月炎天下雪霜須菩提於意云何如恆河中所有沙佛説是沙不如是世尊如來説是沙須菩提於意云何如一恆河中所有沙有如是沙等恆河是諸恆河所有沙數佛世界如是寧為多不甚多世尊六祖曰恆河者西國祇洹精舍側近之河如來説法常指此河為喻佛説此河中沙一沙况一佛世界以為多不須菩提言甚多世尊王日休曰恆河中所有沙有如是沙等恆河者謂一粒沙為一恆河也是諸恆河所有沙數佛世界如是者是諸恆河謂一粒沙為一恆河如此恆河中所有之沙則不勝其多矣佛世界如是者謂世界如是之多也此其為多不在所言矣然而佛又以問須菩提者何也亦以廣坐説法欲人先明了於心故不厭其詳復而將為下文之説也佛世界者謂凡一大世界必有一佛設化故凡大世界皆謂之佛世界顏丙曰以沙數世界言其多也有如是等恆河是諸恆河所有沙者等者比也將如此沙比恆河之多又將諸多恆河中之沙而數佛世界佛舉此以問如是寧為多不須菩提答云甚多僧若訥曰明諸恆河中沙一沙為一世界舉此為問李文會曰恆河沙數者欲明衆生有種種妄念故舉無窮之沙以為喻耳楞嚴經云琉璃光法王子觀世間衆生皆是妄緣風力所轉觀世動時觀身動止觀心動念諸動無二等無差別此羣動𪫬來無所從去無所至十方卻塵顛倒衆生盡同一虛妄也佛告須菩提爾所國土中所有衆生若干種心如來悉知王日休曰所有衆生謂彼世界中凡有之衆生乃一切衆生也其衆生之心如來所以悉知者以此心為妄想乃自真𪫬中現既生此妄想心自佛觀之則有形相矣有形相故可得而知也若寂然如虛空則無得而知矣且所謂他心通者六通天眼通徹視大千天耳通洞視十方他心通悉知種類宿命通達三世事神境通形無窒礙如意通任運自在謂彼既起心念則此可得而知也聞有人把棊子於手中令他心通者觀之則知其為棊子以己知為棊子故也然己則不知其數之多寡使彼言之則亦不知其數以己不知其數故也由是言之若一起心念則如有形相故可得而知如佛者豈止他心通而已故無量衆生一起心念皆悉知見無足疑也顏丙曰若干乃幾多之意若幾多心如來悉知心鏡一明無不遍知僧若訥曰若干者若如也干數也顏師古云設數之辭也若干有二種一世間凡夫心二出世間聖人心如來盡能知之故名正遍知也李文會曰若干種心如來悉知者眼耳鼻舌身意若起心動念處皆是國土於國土中所有衆生若干種種差別之心心數雖多總名妄心既覺是妄故云悉知川禪師云曾為浪子偏憐客慣愛貪杯識醉人頌曰眼觀東南意在西北將謂猴白更有猴黑一切衆生一切心𥁞逐無窮聲與色喝何以故如來説諸心皆為非心是名為心六祖曰爾所國土中所有衆生一一衆生皆有若干差別心數雖多總名妄心識得妄心非心是名為心顏丙曰如來説諸心實無心可得故曰非心但強名曰心李文會曰覺妄之心即是非心本無妄念不起妄心即是自𪫬本心故云是名為心即是菩薩心亦名涅槃心亦名大道心亦名佛心故臨濟禪師云若一念心能解縛此是觀音三昧法川禪師云病多諳藥𪫬頌曰一波才動萬波隨似蟻循環豈了期咄今日為君都割斷出身方號丈夫兒所以者何須菩提過去心不可得現在心不可得未來心不可得肇法師曰聞説諸心謂有實心故須破遣明三世皆空故論云過去已滅未來未起現在虛妄三世推求了不可得疏鈔云未覺不知隨時流轉故有三世若悟真一之心即無過去現在未來若有過去心可滅即是自滅若有未來心可生即是自生既有生有滅即非常住真心即為依他心虛妄心若一念有生滅心即成六十二種邪見九百種煩惱王日休曰常住真心即真𪫬也是以自無量無數劫來常一定而不變動豈有過去未來現在若有過去未來現在則為妄想此三心是也且若飽而未欲食則欲食之心為未來飢而正欲食則欲食之心為現在食畢而放匕箸則欲食之心為過去是此心因事而起事過而滅故為妄想也不可得者謂無也言此三心本來無有乃因事而有耳圓覺經所以言六塵緣影為自心相者謂衆生以六種塵緣之影為自己之心相也僧若訥曰本生心地觀經云如佛所説唯將心法為三界主心法本源不染塵穢云何心法染貪瞋癡於三世法誰説為心過去心已滅未來心未至現在心不住諸法之內𪫬不可得諸法之外相不可得諸法中間都不可得心法本來無有形相心法本來無有住𩂜一切如來尚不可見心何况餘人得見心法顏丙曰謂思念前事者為過去心思念今事者為現在心思念後事者為未來心三念總放下著謂之不可得經云前念後念及今念念念不被邪見染此為三心不可得古云一念不生全體現亦謂三際俱斷三念俱妄了不可得傅大士頌曰依他一念起俱為妄所行便分六十二九百亂縱橫法華經二卷世尊偈言薄德少福人衆苦所逼迫入邪見稠林若有若無等依止此諸見具足六十二毗婆沙論云六十二見者五蘊中各起四見四五二十三世各二十通為六十斷常二見為根本揔為六十二見且於色蘊中即色是我離色非我我中有色色中有我五蘊中具有此四疏鈔解三心云若一念有生滅心即成六十二種邪見九百種煩惱過去滅無滅一作不滅當來生不生常能作此觀去聲真妄坦然平朝文元公遇高士劉惟一訪以生滅之事劉曰人常不死公駭之劉曰形死𪫬不滅是知此𪫬歷劫長存川禪師曰低聲低聲直得鼻孔裏出氣頌曰三際求心心不見兩眼依然對兩眼不須遺劒刻舟尋雪月風花常見靣未曾有經云妙吉祥菩薩因見一人言我造殺業決墮地獄如何救度菩薩即化一人亦曰我造殺業決墮地獄前人聞已言我亦然化人告之唯佛能救相隨共詣化人白佛我造殺業怖墮地獄願佛救度佛即告言如汝所説造殺業者汝從何心而起業相為過去耶未來耶見在耶若起過去心者過去已滅心不可得若起未來心者未來未至心不可得若起見在心者見在不住心不可得三世俱不可得故即無起作無起作故於其罪相何所見耶善男子心無所住不在內外中間心無色相非青黃赤白心無造作無作者故心非幻化本真實故心無邊際非限量故心無取捨非善惡故心無轉動非生滅故心等虛空無障礙故心非染淨離一切數故善男子作是觀者即於一切法中求心不可得何以故心之自𪫬即諸法𪫬諸法𪫬空即真實𪫬由是義故汝今不應妄生怖畏是時化人聞佛説法即白佛言我今得悟罪業𪫬空不生怖畏尓時實造業者亦白佛言我今得悟罪業𪫬空而不復生怖畏之想李文會曰謂三世心無𪫬可得故可從緣而生肇法師云聞説諸心謂有實心故須破遣明三世皆空故云過去已滅未來未起現在虛妄三世推求了不可得故云若悟無法無相無事平常真心即法體空寂不生不滅湛然清淨豈有前念今念後念可得也馬祖云道不用修但莫汙染何謂汙染但有生死造作趣向皆是汙染若欲直會其道平常心即是道何謂平常心無造作無是非無取捨無憎愛無凡聖是故經云非凡夫行非聖賢行是菩薩行趙州問南泉云如何是道泉云平常心是道圜悟禪師頌曰欲識平常道天真任自然行船宜舉棹走馬即加鞭若遇飢來飯還應困即眠盡從緣所得所得亦非緣須菩提於意云何若有人滿三千大千世界七寶以用布施是人以是因緣得福多不如是世尊此人以是因緣得福甚多須菩提若福德有實如來不説得福德多以福德無故如來説得福德多自在力王如來解曰此雖如是布施只是有礙之寶不是無為清淨功德是故如來不説多也若有菩薩以盧舍那身中七覺菩提持齋禮讚從其心燈化生功德不生不滅堅如金剛乘香花雲入無邊界起光明臺供養十方一切諸佛此是無為功德見𪫬之施化為菩薩頌曰廣將七寶持為施如來不説福田多若用心燈充供養威光遍照滿娑婆疏鈔云若據捨大千寶布施其福極多若執著希望福德有餘則有盡故云若福德執實有如來不説得福德多此是反釋之義言以福德無者無希望心也既無希望即為無住相施是名無為福若依無住無為而施者故如來説得福德多僧若訥曰福有者取相也福無者離相也離相故稱𪫬𪫬如虛空其福無量顏丙曰假使盡世界七寶布施此乃人天小果有漏之因終不免輪回畢竟有墮落不足為多以福德無故此其所以為多也所謂無之一字趙州教人見𪫬看話頭自云狗子還有佛𪫬無應云無只將這無字貼向鼻頭上崖來崖去久久自然有箇入頭處是則是切不得作無字會僧師曰世尊召云須菩提若能施之人以妄識為本修布施行即取著能所者以為實有此福即成顛倒如來不説此福德多以福德無故者若能施之人以佛智為本修布施行悉皆離相不見福為實有即非顛倒如來説此人福德甚多智者禪師頌曰三千大世界七寶滿其中有人持布施得福也如風猶勝慳貪者未得達真宗終須四句偈知覺證全空李文會曰凡夫住相布施七寶希求福利此是妄心所得福德不足為多不如淨妙無住之福無得之德同於虛空無有邊際川禪師云猶勝別勞心頌曰羅漢應供薄象身七寶雖然多濁富爭似少清貧岡象只因無意得離婁失在有心親須菩提於意云何佛可以具足色身見不不也世尊如來不應以具足色身見陳雄曰色身者三十二相也具足者無一而虧欠也備三十二行而具足是相三十二行法身中有之欲見法身如來識自本心見自本𪫬足矣豈應見於具足色身也何以故如來説具足色身即非具足色身是名具足色身陳雄曰壇經云皮肉是色身華嚴經云色身非是佛觀此則知肉身無如來殊不知有生如來存焉知色身非法身殊不知有妙色身存焉華嚴經又云清淨妙色身神力故顯現曰妙色身則現一切色身三昧便是法身如來即非具足色身可知以非具足色身而名為具足色身者蓋得其所以具足色身故也須菩提於意云何如來可以具足諸相見不不也世尊如來不應以具足諸相見何以故如來説諸相具足即非具足是名諸相具足陳雄曰楞伽經云相者若𩂜所形相色像等現是名為相此言諸相者種種變現神通之相也又不止於三十二相而已如來離色離相以淨行則具足三十二以智慧則具足八萬四千具足三明六神通八解脫法華經三卷云佛於天人大衆之中説是法時六百萬億那由他人皆得三明六通具八解脫此之具足即非諸相之所謂具足也然此之具足乃其實也而諸相具足特其華耳充其實則其華必副之是以有諸相具足之名顏丙曰佛覺也覺𪫬如虛空不應以具足色身見唯見𪫬人方知即非色身如夫子毋我顏子坐忘是也自𪫬如來不應以具足諸相見𪫬尚不可得又何有諸相故以即非之説為掃除之王日休曰此分與苐五分苐十三分之意同於此再言者為續來聽者説也傳本十三分王本十六分李文會曰心既空寂湛然清淨豈有色身諸相可得凡夫既不著有即著於空有此斷常二見謂觀空莫非見色觀色莫不皆空即是具足色身具足諸相非具足也空色一如有無不異方可能觀無身而見一切身無相而見一切相是名色身具足諸相具足也僧問趙州狗子有佛𪫬麼州云狗子無佛𪫬進云蠢動含靈皆有佛𪫬為什麼狗子無佛𪫬州云為他有業識在夫有業識之人種種著於有起諸妄想者此名顛倒知見種種落於空都無所悟者此名斷滅知見宿有善根之人無此顛倒斷滅二病而能洞曉空趣此名正真知見若悟此理乃可隨時著衣喫飯長養聖胎任運過時更有何事四祖謂牛頭融禪師云百千妙門同歸方寸恆沙功德總在心源一切空門一切慧門一切行門悉皆具足神通妙用只在你心業障煩惱本來空寂一切果報𪫬相平等大道虛曠絶思絶慮如是之法無欠無餘與佛無殊更無別法但只令心自在莫懷妄想亦莫歡欣莫起貪瞋莫生憂慮蕩蕩無礙任意縱橫不作諸善不作諸惡行住坐臥觸目遇緣皆是佛之妙用祖印明禪師云養就家欄水牯牛自歸自去有來由如今穩坐深雲裏秦不管兮漢不收傅大士頌曰八十隨形好相分三十二般若經第十卷言八十種好文繁不録應物萬般形理中非一異人法兩俱遣色心齊一棄所以證菩提實由諸相離去聲川禪師云官不容針私通車馬頌曰請君仰靣看虛空廓落無邊不見蹤若解轉身些子力頭頭物物總相逢須菩提汝勿謂如來作是念我當有所説法莫作是念何以故若人言如來有所説法即為謗佛不能解我所説故李文會曰心既清淨語默皆如遇緣即施緣散即寂張無盡云非法無以談空非人無以説法此謂不同生滅之心有法可説也若有生滅心在而説法者是教一切人不能得見自𪫬謂之謗佛但無生滅心方可説法川禪師云是即是大藏小藏從甚處得來頌曰有説皆為謗無言亦不容為君通一線日出嶺東紅須菩提説法者無法可説是名説法王日休曰若人言如來有所説法即為謗佛者謂佛本不説法以真𪫬無法可説若以為佛本説法即為志在於法耳佛豈志在於法此所以為謗佛所以為不能解佛所説之故也佛又呼須菩提而言説法者實無有法謂本來無法特為衆生去除外妄而説耳此法豈真實衆生既悟則不用此法矣故但虛名為説法而已此分與第七分言無有少法如來所得之意大略同亦與十三分所謂無有少法如來所説之意同傳本在十三分王本在十五分然此再舉者後詳言之亦為續來聽者説也顏丙曰終日喫飯不曾咬著一粒米終日著衣不曾挂著一莖絲所以我佛橫説直説四十九年未嘗道著一字唯同道方知若言如來有所説即為謗佛不能解會我所説直饒説得天花亂墜也落在苐二著唯能坐斷十方打成一片非言語可到是名真説法也所以道墻壁瓦礫説禪浩浩前輩頌云也大奇也大奇無情説法不思議若將耳聽終難會眼處聞聲方得知謝靈運曰教傳者説法之意也向言無説非杜默而不語但無存而説則説滿天下無乖法理之過無存謂不著諸相心無所住也傅大士云相寂名亦遣心融境亦亡去來終莫見語默永無妨智入圓成理身同法𪫬常證真還了俗不廢是津梁川禪師云兔角𣐀龜毛拂頌曰多年石馬放毫光鐵牛哮吼入長江虛空一喝無蹤迹不覺潛身北斗藏且道是説法不是説法爾時慧命須菩提疏鈔云尓時當起問之時也言慧命者善現達佛智海入深法門悟慧無生覺本源之命非去非來故曰慧命須菩提陳雄曰慧命須菩提見於法華經信解品慧以德言命以壽言即長老之異名也顏丙曰慧命者具智慧𪫬也故曰天命之謂𪫬白佛言世尊頗有衆生於未來世聞説是法生信心不佛言須菩提彼非衆生非不衆生何以故須菩提衆生衆生者如來説非衆生是名衆生疏鈔云佛言彼非衆生者皆具真一之𪫬與佛同源故曰非衆生言非不衆生者背真逐妄句喪己靈故曰非不是衆生王日休解第二分云命者壽之意壽者老之意其言慧命者以須菩提既得慧眼且年高矣須菩提於此問頗有衆生於未來世聞説是法生信心不佛言彼非衆生非不衆生者恐聽法者誤認衆生以為實有故曰彼非衆生謂自業緣中現業盡則滅豈有真實衆生也然亦有衆生之身現在此又不可謂之非衆生故曰非不衆生但非真實而為虛幻耳佛又自問云何以故者謂何故非不衆生乃呼須菩提而自答云衆生衆生者謂凡為衆生者則所謂一切衆生也如來説非衆生是名衆生者謂一切衆生佛皆以為非真實衆生但虛名為衆生而已此佛自言也而又言如來説者豈非諸佛亦如是説乎顏丙曰須菩提問佛衆生於未來世聞説是法生信心不佛答曰彼非衆生非不衆生者蓋衆生屬有不衆生屬無彼衆生𪫬本同太虛不落有無二見如來説非衆生但假名衆生故佛嘗曰我不敢輕於汝等汝等皆當作佛我佛未嘗輕衆生也如此智者禪師頌曰不言有所説所説妙難窮有説皆為謗至道處其中多言無所解默耳得三空二空即見第一分又疏鈔云有無中道亦曰三輪體空智覺剎那頃無生無始終俱舍等論謂時之最少名一剎那一百二十剎那名一怛剎那六十怛剎那名一羅婆三十羅婆名一牟呼栗多亦云須三十牟呼栗多為一晝夜川禪師曰火熱風動水濕地堅頌曰指鹿豈能成駿馬言鳥誰謂是翔鸞雖然不許纖毫異馬字驢名幾百般靈幽法師加此慧命須菩提六十二字是唐長慶二年今在濠州鍾離寺石碑上記六祖解在前故無解今亦存之李文會曰此則魏譯偈也長慶中僧靈幽入𡨋所指魏譯則存秦譯則無也謂言若敬信佛法即著聖見非衆生也若不信佛法即著凡夫見非不衆生若起此二見者是不了中道也須是令教凡聖皆盡不住兩頭方是真正見解故云衆生衆生者如來説非衆生是名衆生也須菩提白佛言世尊佛得阿耨多羅三藐三菩提為無所得耶佛言如是如是須菩提我於阿耨多羅三藐三菩提乃至無有少法可得是名阿耨多羅三藐三菩提王日休曰此分與第七分大槩同於此再言者為續來𥊸者説也佛言如是如是者蓋深許其言之當也阿耨多羅三藐三菩提無有少法可得者謂𪫬中無有少法可得無有所得則蕩然空空是不可以形相求不可以言説求也但説名為無上正等止覺而已陳雄曰壇經云妙𪫬本空無有一法可得既無一法可得寧須有菩提可證耶我佛無得無證無名可名是以強名曰阿耨菩提顏丙曰有法可得是名法無法可得方名解脫須菩提以無所得之辭而告世尊世尊即以如是如是而證據之佛又云我於無上正等正覺乃至無少法可得虛名而已智者禪師頌曰諸佛智明覺覺𪫬本無涯佛因有何得所得為無耶妙𪫬難量比得理即無差執迷不悟者路錯幾河沙李文會曰若有少法可得亦是著相志公云但有纖毫即是塵舉意便遭魔所擾經云若人欲識佛境界當淨其意如虛空學道之人但於一切諸法無取無捨見如不見聞如不聞心如木石刮削併當令內外清淨方是逍遙自在底人法句經云雖終日見猶為無見雖終日聞猶為無聞草堂清和尚云擊石乃出火火光終不然碧潭深萬丈直下見青天逍遙翁云內覺身心空外覺萬事空破諸相訖自然無可執無可爭此謂禪悅所謂大明了人勿令有秋毫許障礙塵許染著堅久不渝便是無上士不動尊也琪禪師云念念釋迦出世勒下生分別現文殊之心運用動普賢之行門門而皆出甘露味味而𥁞是醍醐不出旃檀之林長𩂜華藏之境若如此也行住坐臥觸目遇緣雖應用千差且湛然清淨川禪師云求人不如求己頌曰滴水生氷信有之緑楊芳草色依依春花秋月無窮事不妨間聽鷓鴣啼復次須菩提是法平等無有高下是名阿耨多羅三藐三菩提王日休曰六本皆作是法平等無有高下然此所謂是法乃真𪫬也真𪫬豈可謂之法強名曰法耳上自諸佛下至蠢動含靈其真𪫬一同故云平等無有高下謂色身則有高下真𪫬則無高下也謝靈運曰結成菩提義也人無貴賤法無好醜蕩然平等菩提義也肇法師曰明此法身菩提在六道中亦不減下在諸佛心中亦不增高是名平等無上菩提真武説報父母恩重經云物不能平物惟水不動則可以平物物不能等物惟權衡之公則可以等物平則無高無下等則無重無輕李文會曰是法平等無有高下者凡夫不見自𪫬妄識分別自生高下謂佛是高衆生是下菩薩了悟人法二空上至諸佛下至螻蟻皆有佛𪫬無所分別故一切法皆平等豈有高下也黃蘖禪師云若觀佛作清淨光明解脫之相觀衆生作垢濁暗昧生死之相作此解者歷恆河沙劫終不能得阿耨菩提又云心若平等不分高下即與衆生諸佛世界山河有相無相遍十方界一切平等無彼我相此本源清淨心常自圓滿光明遍照也傅大士云水陸同真際飛行體一如法中何彼此理上起親踈自他分別遣高下執情除了斯平等𪫬咸共入無餘以無我無人無衆生無壽者王日休曰所以名為無上正等正覺者以真𪫬中本無我人衆生壽者此四者乃妄緣中現而真𪫬則平等豈有四者之異故名為無上正等正覺也修一切善法即得阿耨多羅三藐三菩提王日休曰一切善法乃佛接引衆生悟明真𪫬之法也依此法修行即得無上正等正覺之真𪫬此真𪫬我本有之豈可謂之得蓋凡言得者皆謂自外而得此則非自外而得故不可謂之得然此則言得者蓋不得已而強名曰得耳李文會曰修一切善法者若不能離諸相而修善法終不能得解脫但離諸相而修善法即得阿耨多羅三藐三菩提也又云若人於一切事無染無著於一切境不動不搖於一切法無取無捨於一切時常行方便隨順衆生令皆歡喜而為説法令悟菩提真𪫬此即名為修善法也川禪師云山高水深日生月落頌曰僧是僧兮俗是俗喜則笑兮悲則哭若能於此善參詳六六從來三十六須菩提所言善法者如來説即非善法是名善法王日休曰佛又呼須菩提而謂所言善法者即非善法謂本來無此善法乃假此以開悟衆生耳故但虛名為善法而已顏丙曰兩頭話有三十六對善與惡對有與無對生與死對去與來對動與靜對語與默對勝與負對高與下對不作兩頭見是為平等法亦名無上正等正覺以無四相心修一切善法即得阿耨多羅三藐三菩提所謂即非善法者蓋凡夫執惡聲聞著善若不離善法又落兩頭機豈為平等傅大士頌曰水陸同真際飛行體一如子榮曰水陸同真際者總標四生有情之本皆有一真之𪫬故云飛行體一如今據經云是法平等無有高下故此頌亦總四生而言之也水之所産陸之所生水陸雖不同而一𪫬之真際則未嘗不同也有翼者能飛有足者能行飛行雖不一而一𪫬之本體則未嘗不一也法中何彼此理上豈親踈𪫬中所有之法曾何彼此之間𪫬中所具之理豈有親踈之殊自他分別遣自者己也他者人也自己他人妄生分別者皆當遣去圓覺經曰自他身心注云自之身心即我相也他之身心即人相也又曰自𪫬憎愛故注云於自則愛於他則憎高下執情除妄分高下而生執著之情亦當除之了斯平等𪫬咸共入無餘經曰是法平等無有高下有人若能了悟平等之𪫬則咸共入於無餘涅槃矣寒山詩曰佛𪫬元平等總有真如𪫬但自審思量不用間爭競李文會曰不住相故即非善法無漏福故是名善法法華經云初善中善後善者初謂發善心時須是念念精進不生疑惑懈怠之心中謂常修一切善法令悟真𪫬不著諸法相也後謂即破善法直教一切善惡凡聖無取捨憎愛之心平常無事故云即非善法是名善法也古德云了取平常心是道飢來喫飯困來眠又云常平等心如此廣大妙觀察智如日光明體用及此是佛境界川禪師云靣上夾竹桃花肚裏侵天荊棘頌曰是惡非惡從善非善將逐符行兵隨印轉有時獨上妙高峯却來端坐閻王殿見盡人間祇點頭大悲手眼多方便須菩提若三千大千世界中所有諸須彌山王如是等七寶聚有人持用布施疏鈔云大千世界中所有須山王上至忉利天下至昆崘際若有將七寶如須山高持用布施獲福不可知數問還有過此福者不下文答僧師曰佛召云須菩提且如一四天下則有一須山若據三千大千世界所有百億須山是衆山之最故言山王若人以此般若波羅蜜經乃至四句偈等受持讀誦為他人説於前福德百分不及一百千萬億分乃至算數譬喻所不能及疏鈔云若於無住般若受持真四句偈及書誦念為他人演説如是等人所得功德不可稱計何以故悟𪫬圓融不斷有為而證無為不除妄想而趣真常達第一義於一念之間得無為福無為福德量等虛空不可思議故經云於前捨須山寶布施福德若比無為福百千萬億倍不及一倍王日休曰此言所有諸須山王如是等七寶聚布施而不可以比受持演説之功者以彼則世間福終有時而受盡此則為出世間福愈增長而終無窮故也陳雄曰佛以𪫬上福德為最上以身中七寶為希有儻七寶滿三千大千世界之多等須山之高大有能持以布施則其福德想不下於須山今有人焉持誦真經并四句渴説與他人是修自𪫬上福德是聚自身中七寶回視多施七寶之福萬萬不侔五祖曰自𪫬若迷福何可救六祖曰乘船永世求珠不知身是七寶二佛之言皆為世人不修身修𪫬徒施寶以為求福之道顏丙曰此一分專較量福德輕重若有人將七寶比於須山王布施所得福德比之持經之人百分不及一分况持經之人又能悟四句偈等受持讀誦為他人説不特自利又且利他如此福德無量有百千萬億分乃至不可算數譬喻正如寒山云無物堪比倫教我如何説李文會曰聚七寶布施如三千大千世界中須山王所得無量無邊功德此為住相布施終無解脫之期不如受持讀誦此經乃至四句偈等所得無住相淨妙功德勝前功德百千萬倍傅大士頌曰施寶如沙數唯成有漏因不如無我觀去聲了妄乃名真欲證無生忍要假離貪嗔人法知無我逍遙出六塵川禪師曰千錐劄地不如鈍鍬一捺頌曰麒麟鸞鳳不成群尺璧寸珠那入市逐風之馬不並馳倚天長劒人難比乾坤不覆載劫火不能壞凜凜威光混太虛天上人間總不如噫須菩提於意云何汝等勿謂如來作是念我當度衆生須菩提莫作是念何以故實無有衆生如來度者僧若訥曰如來雖設法施廣度衆生而不作是念故誡云汝等勿謂也莫作是念者重誡也度無度相能所一如故論偈云平等真法界佛不度衆生李文會曰實無有衆生如來度者如來不見有衆生可度又云謂諸衆生起無量無邊煩惱妄想於一切善惡凡聖等見有取捨分別之心迷情蓋覆菩提之𪫬佛出于世教令覺悟降六賊斷三毒除人我若能了悟人法二空無諸妄念心常空寂湛然清淨更不停留纖毫滯礙即是見𪫬實無衆生可化度也石霜禪師云休去歇去古廟香爐去枯木寒灰去一念萬年去如大死人去若能如此用心安有不成道乎若有衆生如來度者如來即有我人衆生壽者王日休曰佛謂須菩提云汝等勿謂如來作是念我當度衆生又呼須菩提而再言曰莫作是念何以故者以實無衆生如來所度謂一切衆生皆是妄緣中現其實無有若言有衆生如來所度即是執著於有我人衆生壽者也僧若訥曰若見有可度者即同凡夫有我執也李文會曰若有衆生如來度者即有我人衆生壽者者人人具足箇箇圓成本來是佛與佛無異圜悟禪師云赤肉團上人人古佛家風毗盧頂門處處祖師巴鼻若也恁麼返照凝然一光明非色非心非內非外行棒也打他不著行喝也驚他不得直得淨裸裸赤灑灑是箇無生法忍不退轉輪截斷兩頭歸家穩坐正當恁麼時不須他處覓秪此是西方傅大士云夜夜抱佛眠朝朝還共起起坐鎮相隨語默同居止纖毫不相離如身影相似欲識佛去𩂜只這語聲是衆生但為業障深重與佛有殊若能回光返照一刀兩段即便見自𪫬也若不因佛經教一切衆生無因自悟憑何修行得至佛地此是如來無所得心故云若有衆生如來度者即有我人衆生壽者相也川禪師曰春蘭秋菊各自馨香頌曰生下東西七𡵯行人人鼻直兩眉橫哆啝悲喜皆相似那時誰更問尊堂還記得在麼須菩提如來説有我者即非有我而凡夫之人以為有我僧若訥曰如來既無我人等相云何有時稱我須知假名稱我對所度衆生隨時説我李文會曰有我者即是凡夫非我者隨處作主應用無方故云凡是佛因佛是凡果境界經云三世諸佛皆無所有唯有自心既明因果無差乃知心外無法二乘之人執有我相欲離生死而求涅槃欲捨煩惱而求滅度是捨一邊不了中道乃同凡夫行也須菩提凡夫者如來説即非凡夫是名凡夫王日休曰佛又呼須菩提而言凡夫者謂非有真實凡夫但虛名為凡夫而已此所謂隨舉隨掃也上言凡夫是之謂舉下必言無真實凡夫是之謂掃與其掃之曷若不舉蓋不舉則無以明其理譬如過渡而不用筏者也不掃則恐人泥其説譬如到岸而不登乃住於筏上者也此所以必舉之而又必掃之僧若訥曰因上如來説我釋非凡夫却見佛與凡夫有隔於是止泯則聖凡平等故云即非凡夫顏丙曰當人自𪫬自度迷來悟度邪來正度從上諸佛言句但為指出路頭須是自行自履豈由他人所以道實無衆生如來度者若有可度是如來有四相如來乃見𪫬人也所以無我凡夫未見𪫬人也所以我相未忘佛又恐人落分別界故曰即非凡夫所以見如來凡夫本同一𪫬不容分別智者禪師頌曰衆生修因果果熟自然圓法船自然度何必要人牽恰似捕魚者得魚忘却筌若道如來度從來度幾船經上文曰實無有衆生如來度者一切衆生本來是佛何生可度李文會曰即非凡夫者一念清淨非凡非佛故云即非凡夫凡夫亦空迷者妄執但無執著即一切清淨耳川禪師云前念衆生後念佛佛與衆生是何物頌曰不見三頭六臂却能拈匙放筯有時醉酒罵人忽爾燒香作禮手把破沙盆身披羅錦綺做模打樣百千般驀鼻牽來秪是你嗄須菩提於意云何可以三十二相觀如來不須菩提言如是如是以三十二相觀如來王日休曰如來謂真佛也苐五分已言此意矣於此再言者為續來聽者説故兼及轉輪聖王之説也李文會曰空生疑謂衆生是有可他成聖法身不無可以妙相而見妙也川禪師云錯頌曰泥塑木雕縑綵畫堆青抹緑更裝金若言此是如來相笑殺南無觀世音佛言須菩提若以三十二相觀如來者轉輪聖王即是如來須菩提白佛言世尊如我解佛所説義不應以三十二相觀如來六祖曰世尊大慈恐須菩提執相之病未除故作此問須菩提未知佛意乃言如是如是之言早是迷心更言以三十二相觀如來又是一重迷心離真轉遠故如來為説除彼迷心若以三十二相觀如來者轉輪聖王即是如來轉輪聖王雖有三十二相豈得同如來世尊引此言者以遣須菩提執相之病令其所悟深徹須菩提被問迷心頓釋故云如我解佛所説義不應以三十二相觀如來須菩提是大阿羅漢所悟甚深得方便門不生迷路以冀世尊除遣細惑令後世衆生所見不謬也王日休曰佛又呼須菩提而言若以三十二相觀如來者轉輪聖王即是如來且轉輪聖王是為四天王乃管四天下正五九月照南閻浮提二六十月照西瞿耶尼三七十一月照北鬱單越四八十二月照東弗婆提常如輪之轉以照四天下察人間善惡故名轉輪聖王以其福業之多故色身亦具足三十二相一如佛佛故謂若以三十二相為佛則轉輪聖王亦當為佛是不可以三十二相見佛故繼云不應以三十二相觀如來也李文會曰轉輪聖王即是如來者佛以近事質之令其自解又云未達我人衆生壽者四相即是心有生滅生滅即是轉輪義王者心也雖修三十二淨行生滅心即轉多終不契清淨本來心故云不應以三十二相觀如來也川禪師云錯頌曰有相身中無相身金香爐下鐵昆崘頭頭盡是吾家物何必靈山問世尊如王秉劒爾時世尊而説偈言若以色見我以音聲求我是人行邪道不能見如來劉虯云音聲色相本自心生分別之心皆落邪道若能見無所見聞無所聞知無所知證無所證體茲妙理方見如來虛皇天尊經章四十四妙行曰妄為妙相七十二頂負九色光諸大仙人以是覩天尊也天尊曰我以非色汝妄為色我以非相汝妄為相若以九色七十二相觀我即是離無著有不可與聞無上之義疏鈔云佛言善現汝不可以眼見我之法身何故法身無色相云何見得衆生妙𪫬亦復如是不可以見之又言以音聲求我者佛之法身還可耳音而聞若以耳聞者亦非法身如衆生自𪫬還可以耳聞若以耳聞者即非佛𪫬所以佛言若以見聞我法身者是人行邪道不能見如來如來法身者非色非聲無形無狀不可以心思不可以識識在凡不少至聖不增看時不見悟則全彰王日休曰我謂真我乃𪫬佛也此如來亦謂真𪫬之佛若以色見我以音聲求我是人行邪道者謂真𪫬佛無形無相故不可以形色見亦不可以音聲求若以形色見以音聲求是人所行者乃邪道也真𪫬乃正故非邪也形色音聲則為邪耳故以形色音聲求佛則是所行者邪道豈可以見正覺常住之真𪫬佛故曰不能見如來如來即所謂真我即所謂𪫬佛也僧若訥曰言我者此是法身真常淨我隨流布而説若以色見聲求心遊理外皆名邪見不能見法身肇法師云所謂諸相煥目而非形八音盈耳而非聲應化非真佛亦非説法者法體清淨猶若虛空無有染礙不落一切塵境今且略舉聲色陳雄曰我者我之𪫬也法身如來即我𪫬是視之不見以色相取不可也聽之不聞以音聲求不可也華嚴經云色身非是佛音聲亦復然又云不了彼真𪫬是人不見佛惟內觀反照即𪫬而修則如來得之於方寸之間矣顏丙曰轉輪聖王外貌端嚴具足三十二相然不明佛𪫬但享頑福有時而盡佛言若以三十二相觀如來者轉輪聖王即是如來須菩提後聞佛語方始稱如我解佛義不應以三十二相觀如來所以世尊為説偈言若以色見我以音聲求我我者有我相也不得大自在欲以形色言音而求見我相者是人乃行邪道即非正見不能見如來者不能得見此如如之𪫬也傅大士頌曰涅槃含四德唯我契真常楞嚴四卷非大涅槃非常非樂非我非淨注云非所證法涅槃四德是也涅槃是總四德是別齊名八自在獨我最靈長懺法云身常覺諸佛涅槃八自在觸非色非聲相心識豈能量看時不可見悟理即形彰川禪師曰直饒不作聲求色見亦未見如來在且道如何得見不審不審頌曰見色聞聲世本常一重雪上一重霜君今要見黃頭老黃頭老乃釋迦佛也走入摩耶摩耶夫人乃釋迦佛母腹內藏噫此語三十年後擲地金聲在須菩提汝若作是念如來不以具足相故得阿耨多羅三藐三菩提須菩提莫作是念如來不以具足相故得阿耨多羅三藐三菩提須菩提汝若作是念發阿耨多羅三藐三菩提心者説諸法斷滅莫作是念何以故發阿耨多羅三藐三菩提心者於法不説斷滅相此一分經總是四章原佛之意初則反其辭而語須菩提曰汝若作是念如來以具足相故得阿耨多羅三藐三菩提次則正其辭而謂之曰莫作是念如來不以具足相故得阿耨多羅三藐三菩提如下文亦然初則反其辭而語須菩提曰汝若作是念發阿耨多羅三藐三菩提心者説諸法斷滅相次則正其辭而謂之曰莫作是念發阿耨多羅三藐三菩提心者於法不説斷滅相世本第一章多誤作如來不以具足相故新州印六祖注本南浦陳氏施本第一章並無不字於理為當王虛中注本武夷張公綽施本並作如來可以具足相故其理亦通壽州石本皆有不字經義尤明王日休曰諸法斷滅者謂一切法皆斷之滅之而不用也相謂凡法之相也佛經所謂相者凡有者皆謂之相故晝明則謂之明相夜暗則謂之暗相經所説之法則謂之法相非佛經所説之法則謂之非法相所以於此言不用法而斷滅之者則謂之斷滅相也且法者固不可以泥然亦豈可以斷滅之譬如渡水既渡之後固不須舟楫未渡之前豈可無舟楫耶是故既悟之後不須佛法未悟之前不可以無佛法所以發求無上正等正覺真𪫬之心者必須依佛法修行不可遂斷滅佛法而謂不用法故云汝若作是念發求無上正等正覺真𪫬心者説諸法斷滅相不可作是念也何故不可作是念乎以發求真𪫬心者必依佛法以修行故於法不可斷滅也顏丙曰此一卷經雖然只説無之一字佛又恐人執著此無一向沉空滯寂有著無反成斷滅相何異證道歌云有著空病亦然還如避溺而投火故此一分專戒人不可斷滅今人或已悟或未悟便以無為極則誤汝去在昔張拙秀才參西堂藏禪師問山河大地三世諸佛是有是無藏答云有拙云錯藏云先輩曾參見什麼人來拙云參見徑山來某甲問徑山皆言無藏云待先輩得似徑山時一切皆無即得大凡未見𪫬人如何便説一切皆無所以佛告須菩提汝莫作是念如來不以具足相故得阿耨多羅三藐三菩提汝若果作是念發心即是説諸法斷滅相何故凡發無上正等正覺心不可説斷滅相智者禪師頌曰相相非有相具足相無憑法法生妙法空空體不同斷滅不斷滅知覺悟深宗若無人我念方知是至公李文會曰如來不以具足相故者佛恐須菩提落斷滅見是故令離兩邊然𪫬含萬法不自具足應用遍知一即一切一切即一去來自由無所罣礙此法上至諸佛下至含識本無欠少是名具足相也説諸法斷滅莫作是念者諸法𪫬空空即是常是故不斷不滅若作念云無相而有道心者是斷一切行滅一切法此乖中道也又云若作有相觀即是一邊見若作無相觀亦是一邊見若不作有無觀即是斷滅法故知真如法𪫬不是有不是無湛然不動觀與不觀皆是生滅故云莫作是念也於法不説斷滅相者見𪫬之人自當窮究此理若人空心靜坐百無所思以為究竟即著空相斷滅諸法朝大傅云諸佛説空法為治於有故若復著於空諸佛所不化故云大士體空而進德凡夫説空而退善當知有為是無為之體無為是有為之用也川禪師云翦不齊兮理還亂拽起頭來割不斷頌曰不知誰解巧安排捏聚依前又放開莫謂如來成斷滅一聲還續一聲來須菩提若菩薩以滿恆河沙等世界七寶持用布施若復有人知一切法無我得成於忍此菩薩勝前菩薩所得功德六祖曰通達一切法無能所心是名為忍此人所得福德勝前七寶之福李文會曰知一切法無我者一切萬法本來不生本來無我相所得功德即非七寶布施等福所能比也得成於忍者既知人法無我則二執不生成無生忍此乃勝前七寶布施菩薩夫萬法本來無𪫬皆因自己之所顯發且如眼對色謂之見耳對聲謂之聞見聞是根色聲是塵色聲未對之時我𪫬常見常聞未曾暫滅色聲相對之時我𪫬未曾暫生此是菩薩了悟真𪫬活潑潑地洞然同於太虛所以不曾生滅凡夫即被妄心所覆隨六塵轉即有生滅故塵起即心起塵滅即心滅不知所起滅心皆是妄念也若見六塵起滅不生即是菩提川禪師云耳聽如聾口説如啞頌曰馬下人因馬上君有高有下有踈親一朝馬死人歸去親者如同陌路人只是舊時人改却舊時行履處何以故須菩提以諸菩薩不受福德故王日休曰以諸菩薩不受福德故者謂菩薩濟度衆生無非得福然菩薩不享世間富貴但積福於虛空而已故曰不受福德積於虛空愈久而不已直至於成佛故成佛得其福德如天地廣大所以佛稱兩足尊者謂福與慧兩者皆足也須菩提白佛言世尊云何菩薩不受福德須菩提菩薩所作福德不應貪著是故説不受福德王日休曰菩薩所作福德不應貪著者謂菩薩本不為作福德而度衆生其福德自然隨之如人行日中本不為日影而日影自然隨之若為作福德而度衆生則是貪著其福德而欲享受也為其非貪著而享受是故説不受福德其言是故者蓋為不貪之故所以言不受也李文會曰不貪世間福德果報謂之不受又云菩薩所作福德不為自己止欲利益一切衆生此是無所住心即無貪著故云不受福德智者禪師頌曰布施有為相三生却被吞證道歌曰住相布施生天福猶如仰箭射虛空勢力盡箭還墜招得來生不如意注云古德云人天福報為三生冤人罕知之良由世人因其福力不明其本就上增添以此世福恣情娛樂臨命終時福盡業在反墮惡道受種種苦故云招得來生不如意也此頌言布施有為相三生却被吞者其説亦同三生者今生後生再後生是也七寶多行慧那知捨六根但離諸有欲旋棄愛情恩六根乃眼耳鼻舌身意但能離諸有欲施即棄捨愛情之恩旋疾也旋旬緣切若得無貪相應到法王門川禪師曰裙無腰袴無口頌曰似水如雲一夢身不知此外更何親箇中不許容他物分付黃梅路上人蘄州黃梅縣東五祖弘忍大師傳法與六祖慧能須菩提若有人言如來若來若去若坐若臥是人不解我所説義疏鈔云佛言若有人言如來有來有去有坐有臥即不解佛意也何故只如衆生妙𪫬還有來去坐臥否衆生亦如是如來亦如是行住坐臥四威儀中常住寂滅若有動者即云不解所説義何以故如來者無所從來亦無所去故名如來疏鈔云如來者來而無來去而不去住而不住非動非靜上合諸佛下等群生一𪫬平等故號如來王日休曰此分三言如來皆謂真𪫬佛也若有人言如來若來若去若坐若臥是人不解我所説義者真佛無相故不可以若來若去若坐若臥形容之若可以形容者則是有相故此人不曉解我所説義也何以故者佛又自問何故不解我所説義乎乃自答云我所謂如來者謂真佛也真佛既無形相又遍虛空世界豈有去來故云無所從來亦無所去其言故名如來者謂真𪫬自如而無所不可凡其所現乃隨衆生業緣而來現其實則遍虛空世界而未嘗有去來此所以名之曰如來而已而其言如來者亦強為之名耳真𪫬不可以形容故也詳見苐二分與此後分陳雄曰如來現千百億化身演真空無相法如鏡中像無生滅義故人不知其何所從來亦不知其何所從去華嚴經云上覺無來處去亦無所從清淨妙色身神力故顯現三昧經云亦無來相及以去相不可思議六祖云諸法空寂是如來清淨坐無住云身心寂滅是如來臥處然則來去坐臥又孰得而輕議今有人焉輒言如來具四威儀所見謬甚夫何了得如來所説真空義趣圓覺經著真空之説曰雲駛音史疾也月運舟行岸移蓋謂月未嘗運岸未嘗移真如體𪫬未嘗作止任滅皆人謬見耳顏丙曰行住坐臥謂之四威儀見𪫬能行持人所謂行住坐臥常若虛空若人言如來尚屬來去坐臥是人不解會所説義理何故如來者如如本𪫬也本無動靜所以無去無來故假名如來昔肅宗皇帝詔國一禪師入內道場師見帝起身帝曰禪師何必見寡人起身曰檀越何得以四威儀中見貧道如此𡵯𡵯行持謂之寂靜智者禪師頌曰如來何所來修因幾劫功斷除人我見方用達真宗見相不求相身空法亦空往來無所著來去盡皆通李文會曰來無所從去無所至來去皆如其誰來去又云無所從來者不生亦無所去者不滅不生者謂煩惱不生不滅者謂覺悟不滅也又云知色聲起時即知從何而來知色聲滅時即知從何而去故色聲香味觸法自有起滅我心湛然豈有來去生滅相耶寂而常照照而常寂行住坐臥四威儀中無不清淨也川禪師云山門頭合掌佛殿裏燒香頌曰衲捲秋雲去復來幾回南嶽與天台寒山拾得相逢笑且道笑箇什麼笑道同行步不擡須菩提若善男子善女人以三千大千世界碎為塵於意云何是塵衆寧為多不須菩提言甚多世尊何以故若是塵衆實有者佛即不説是塵衆所以者何佛説塵衆即非塵衆是名塵衆世尊如來所説三千大千世界即非世界是名世界王日休曰塵衆蓋謂塵如此之多也須菩提既佛言甚多又呼世尊而自問云何以故者謂彼塵衆何故甚多乎又自云若是塵衆實有者佛即不説是塵衆蓋謂真𪫬為實有則不可説而此塵衆非實有故佛説之是其可説皆為虛妄唯真𪫬為真實故不可説所以佛嘗言不可説不可取者蓋謂此也所以者何乃須菩提自問云所以塵衆若為實有佛即不説是塵衆何也又自答云佛説塵衆即非塵衆是名塵衆者謂佛所説為塵衆即非有真實塵衆乃虛名為塵衆而已須菩提又呼世尊而言如來所説三千大千世界即非世界是名世界者謂世界亦非為真實但虛名為世界而已詳見十三分解以佛嘗言之故此稱如來説也李文會曰塵者妄念也世界者身之別名也塵是因世界是果塵世界者謂因果也然自己真𪫬非因非果能與六道衆生為因果也謂自𪫬是因六道是果故知塵起於世界輪回由於一念雖見小善不可執著雖逢小惡必須除去且衆生於妄念中起貪瞋癡業妄受三界夢幻之果如彼塵積成世界不知因果元是妄心自作自受一念悟來即無塵世界何有故云即非塵是名塵即非世界是名世界若欲建立世界一任塵熾然若欲除滅世界覺悟人法俱空了無一法可得湛然清淨不被諸境所轉皆由於自己也僧了𪫬曰此分佛恐末劫人重重執著因果不相離捨故重囑須菩提人人身中有細善惡雜念猶如大千世界塵之多此念無非影響虛妄建立故云非塵衆亦因轉却無明煩惱之心變作慈悲無礙之智方入空寂智解得大安樂是名塵衆傅大士云欲證無生忍要假離貪瞋人法知無我逍遙出六塵川禪師云若不入水爭見長人頌曰一塵才起翳摩空碎抹三千數莫窮野老不能收拾得任教隨雨又隨風何以故若世界實有者即是一合相王日休曰何以故者須菩提自問何故世界非真實乎乃自答云若世界實有者即是一合相一合相謂真𪫬也真𪫬遍虛空世界又無形相故一而不可分之以為二合而不可析之以為離非有相也強名曰相耳若以世界為實有則是真𪫬耳蓋真𪫬方為實有何則自無始以來常存而無變壞自然而非假合一切虛幻者皆非真𪫬之本豈非實有乎而世界烏可以比之以世界亦是假合劫數盡時亦有變壞此所以為虛幻而不可以為實有故不可以比真𪫬也李文會曰塵謂因世界謂果若執因果為實有者即被相之所縛故云即是一合相金海光如來曰世界者如來自説盧舍那佛住持三千大千世界身上化生菩提之樹號蓮花藏世界不説窒礙世界也一合相者一切衆生身中佛𪫬與盧舍那法身是一合相也頌曰如來自説蓮花藏負荷下可切三千擐胡貫切穿也大千菩薩了空歸一合凡夫貪著被魔纏如來説一合相即非一合相是名一合相王日休曰如來説一合相者須菩提謂佛嘗説真𪫬為一合相也即非一合相者謂真𪫬如虛空然非實有物如一之而不可二合之而不可離者也是名一合相者謂但強名為一合相而已凡言即非皆謂實無也凡言是名皆謂虛名也李文會曰但莫執為實有亦莫執為實無於相離相故云即非一合相是名一合相也須菩提一合相者即是不可説王日休曰佛唯曾説真𪫬為一合相故須菩提於此以為實有佛乃又呼須菩提而言一合相者則是不可説以真𪫬不可言説但強名為一合相耳李文會曰即是不可説者須是學人自省自悟於理事上各無罣礙今凡夫一向貪著事相不達於理所以説因果著因果説世界著世界也但凡夫之人貪著其事王日休曰佛謂凡夫之人不知明悟真𪫬乃貪著真𪫬中所現之事耳謂色身六根也凡夫者泥此色身與六根為我故沉淪六道無由脫離此所以為凡夫也華嚴經云離諸和合相是名無上覺佛以覺言外覺離一切有相內覺離一切空相於相而離相於空而離空得夫真空無相之妙所以名其為佛六祖曰一合相者眼見色愛色即與色合耳聞聲愛聲即與聲合至於六塵若散即是真世界合即是凡夫散即非凡夫凡夫之人於一切法皆合相若菩薩於一切法皆不合而散何以故合即繫起生滅散即解脫亦不生亦不滅若有繫生滅者即是凡夫所以經云但凡夫之人貪著其事顏丙曰塵雖多未足為多世界幻成終無實義若説實有塵實有世界即是彼此著相彼既是相我又著相兩相相合謂一合相所謂一合相即是不可説但凡夫未悟妄生貪著圜悟禪師云你但上不見有諸佛下不見有衆生外不見有山河大地內不見有見聞覺知好惡長短打成一片一一拈出更無異見傅大士云界塵何一異報應亦同然非因亦非果誰後復誰先事中通一合理則兩俱捐欲達無生路應當識本源逍遙翁云學道之人但只了悟靈明之心是謂本源所有念念妄想皆為塵垢勿令染著久當證知清淨法身也川禪師云捏聚放開兵隨印轉頌曰渾圇成兩片擘破却團圓細嚼莫咬碎方知滋味全須菩提若人言佛説我見人見衆生見壽者見須菩提於意云何是人解我所説義不不也世尊是人不解如來所説義何以故世尊説我見人見衆生見壽者見即非我見人見衆生見壽者見是名我見人見衆生見壽者見通王如來解曰佛言此四句等之相只見其𪫬不見其相疊前三遍再説者是佛分別棄身見𪫬之義也頌曰佛説我見衆生見為觀其𪫬不觀身破相取空歸寂滅脫除枷鎖出迷津王日休曰我見者謂其見識以為實有我也人見衆生見壽者見者謂其見識以為實有人有衆生有壽者也此言無此四者之見識謂真𪫬中皆無此也以此四見非為真實故云即非我見人見衆生見壽者見但為虛名而已故云是名我見人見衆生見壽者見謂此見非真𪫬中所有亦為虛妄故也李文會曰佛説般若金剛之法始即令諸學人先除粗重四相如大乘正宗分中説也次即令見自𪫬之後復除細四相如究竟無我分中説也此二分中即皆顯出理中清淨四相若於自心無求無得湛然常住是清淨我見黃蘖禪師云百種多知不如無求最苐一也道人是無事人實無許多般心無事亦無又云諸學道人若欲得成佛一切佛法總不用學但學無求無著無求即心不生無著即心不滅不生不滅便是佛也若見自𪫬本自具足是清淨人見於自心中本無煩惱可斷是清淨衆生見自𪫬無變無異無生無滅是清淨壽者見故云即非我人衆生壽者見是名我人衆生壽者見也須菩提發阿耨多羅三藐三菩提心者於一切法應如是知如是見如是信解不生法相須菩提所言法相者如來説即非法相是名法相顏丙曰如是二字可謂親切若發無上正等正覺心者於一切法應當如此知如此見如此信解不必外求法相然初入道時不假法相故無入頭𩂜既見𪫬了亦當遠離不必執著所謂得魚忘却筌到岸不須船之説所以末後為汝剗却云即非法相假名法相智者禪師頌曰非到真如理棄我入無為衆生及壽者悟見總皆非若悟菩提道彼岸更求離法相與非相了應如是知李文會曰發阿耨多羅三藐三菩提心者應知一切衆生皆有佛𪫬應見一切衆生無漏智慧本自具足應信一切衆生靈源真𪫬無生無滅若能了悟此意即是一切智慧不作有能所心不存智解相口説無相法心悟無相理常行無相行故云不生法相是名法相也川禪師云飯來開口睡來合眼頌曰千尺𮈔綸直下垂一波才動萬波隨夜靜水寒魚不食滿船空載月明歸須菩提若有人以滿無量阿僧祇世界七寶持用布施若有善男子善女人發菩提心者持於此經乃至四句偈等受持讀誦為人演説其福勝彼法常滿如來解曰緣此經根本以破相為宗了空為義迷𪫬布施皆不證真能識四句涅槃之門演説法身如如不動觀有為法同於夢幻若作此見教化衆生勝彼所用七寶布施之福也頌曰此經破相依空寂勸持四句最為尊佛斷有為六種錯齊心歸信涅槃門王日休曰無量在西土亦為數名梵語阿僧祇此云無央數亦為數名此二者之為數但積數至多然後至此此言無量無央數者謂無量之無央數蓋自一無央數至十無央數以至百千萬億無央數然後積而至於無量無央數也由是言之則所謂無量阿僧祇世界者不止如恆河沙數世界而已發菩提心者謂發廣大濟度衆生之心也是以前言恆河沙等世界七寶此則言無量阿僧祇世界七寶是尚以彼為少而此則極言其多者也以是布施尚不及受持演説此經得福為多者以彼則世間福終有時而𥁞况因受福而又作惡乎此則出世間之福故其福則無時而盡第有增長終無受福作惡之理此所以勝於彼無量無數也李文會曰發菩提心者謂大乘最上乘種𪫬人也老子云不見可欲使心不亂此小乘之力若見可欲而心亦不亂此大乘之力也踈山如禪師云一波才動萬波隨汩沒塵寰幾箇知突兀須橫宇宙縱橫妙用更由誰持於此經四句偈等受持讀誦者七寶有竭四句無窮悟達本心了無所得持於此經其福勝前七寶布施之功德也云何為人演説李文會曰云何為人演説者四大色身不解説法聽法是你靣前孤明歷歷通徹十方底解説解聽莫要記他語言縱饒説得天花亂墜其心不曾增便總不説其心不曾減求著轉遠學著轉踈惟在默契悟者自知也川禪師云要説有甚難只今便請諦聽諦聽頌曰行處坐臥是非人我勿喜勿瞋不離這箇只這箇劈靣唾平生肝膽一時傾四句妙門都説破不取於相如如不動王日休曰佛自問云如何為人演説乃自答云不取於相如如不動者蓋謂真𪫬不取於形相謂無形相也惟如如不動耳如如不動者如者自如之謂如如則自如之甚也真𪫬中欲現而為天人則為天人欲見而為異類則為異類譬如鏡中現影無所不可是自如之甚也而遍虛空世界常住而未嘗動故曰不動佛鑑和尚示衆舉僧問法眼不取於相如如不動如何不取於相見於不動去法眼云日出東方夜落西其僧有省若也於此見得方知道旋風偃嶽本來常靜江河競注元自不流如或未然不免更為饒舌天左旋地右轉古往今來經幾遍金烏飛玉兔走才方出海門又落青山後江河波渺渺淮濟浪悠悠直入滄溟晝夜流遂高聲云諸禪德還見如如不動麼李文會曰此謂悟達無心無相可取之人若是有心不取於相却是取相心本是空相亦是空人法俱空有何可取也真淨文禪師云但無一切心自然合天道應用在臨時莫言妙不妙如如不動者學人若謂我知也學得也契悟也解脫也似此見解皆是有動心即是有生滅若無此心即一切法皆攝不動不動即內外皆如故云如如不動也川禪師云末後一句始到牢關直得三世諸佛兩目相觀六代祖師退身有分可謂是江河徹凍水泄不通極目荊榛難為措足到這裏添一𮈔毫如眼中著刺減一𮈔毫似肉上剜瘡非為生斷要津蓋為識法者恐雖然恁麼佛法只如此便見陸地平沉豈有燈燈續焰川上座今日不免向猛虎口中奪食獰龍頷下爭珠豁開先聖妙門後學進身有路放開一線又且何妨語則全彰法體默則獨露真常動則隻鶴片雲靜則安山列嶽舉一步如象王回𮨇退一步若獅子嚬呻法王法令當行便能於法自在秖如末後一句又作麼生道還委悉麼雲在嶺頭間不徹水流澗下太忙生頌曰得優遊處且優遊雲自高飛水自流秖見黑風大浪未聞沉却釣魚舟何以故一切有為法如夢幻泡影如露亦如電應作如是觀王日休曰何以故者佛自問何故為人演説不取於相如如不動也佛乃自答云一切有為法如夢幻泡影如露亦如電應作如是觀者謂有為法則有相而動故如此六者真𪫬則無相而不動故異於六者也所謂法者謂凡有所為者皆是也上自天地造化下至人之所為皆有為法也然此稱六如以設教化則止謂人事耳佛以無形相而無所為者為真𪫬故以有形相而一切有為者為偽妄其言如夢者謂當時認以為有覺則悟其為無也如幻者謂有為法非真實如幻人以草木化作車馬倉庫之類也如泡者謂外像雖有其中實無如影者謂光射則有光滅則無也如露者謂不牢也如電者謂不久也此有為法應如是以觀看則悟其為空乃知真𪫬方為真實不可以不明悟也經多言四句偈者以前四句則言真佛之無形相此則言有為法之不為真實此不問其是偈非偈若於二者之中一有所悟則非淺淺矣佛所以言四句偈等者謂不必專於偈凡可以演説者皆是况此為言之要者乎僧若訥曰言一切有為法者謂衆生界內遷流造作皆是虛妄終有敗壞如夢幻等畢竟不實當作如是觀豈為生死流動耶陳雄曰佛所謂一切法者真空無相法也故一切賢聖皆以無為法曰有為法則夢幻泡影露電之如不其妄乎惟了真空無相者能作是觀以悟六如之妄則必離六如以證如如不動之理優波離尊者語阿難曰諸有為法並是無常想夫觀六如而得是句顏丙曰四句偈者乃此經之眼目雖經八百手注解未聞有指示下落處人多不悟自己分上四句却區區向紙上尋覔縱饒尋得亦只是死句非活句也活句者直下便是然雖如此也須親見始得佛眼云千説萬説不如親見一靣縱不説亦自分明要須返己自參切不可騎牛覔牛也若人將七寶無量布施不如發菩提心受持自己四句為人開演解説使一切衆生皆得見𪫬成佛其福勝彼云何為人演説不取著於相如如不動湛若太虛何以故蓋世間一切有為之法如夢寐之非真如燈幻之眩惑如水泡之暫時如人影之易滅如朝露之易消如閃電之倏忽應作如是觀者應立如此見𪫬之法僧師曰如夢幻泡影如露亦如電令行人了萬法如夜夢睡時似有覺了全無萬法迷無似有悟得全無故觀如夢淨名云是身如夢為虛妄見幻者幻術也結巾成兔結草為馬本無實體萬法緣生妄有本無自體故如幻淨名云是身如幻從顛倒起泡者風擊水成泡豈能久住觀萬法似浮漚不實淨名云是身如泡不得久立影者水中月影光射物影全體虛假亦然故如影淨名云是身如影從業緣現露者晨朝濕露也暫有即無觀萬法亦然電者閃電也忽有忽無念念無常觀萬法亦如電光剎那生滅故如電淨名云是身如電念念不住維摩詰經注云維摩詰秦言淨名李文會曰一切有為法者生老病死貧富貴賤士農工商赤白青黃馨香臭穢有無虛實深淺高低皆是妄心起滅有為之法也如夢幻泡影如露亦如電者一切有為之法即是世間萬事皆如夢幻泡影不得久長夢者妄想也幻者幻化也泡者如水上之泡易生易滅也影者如身之影無所捉撮也露者霧露之露不得久停也電者雷電之電頃刻之光也傅大士頌曰如星翳燈幻皆為喻無常王曰如星者謂暗時則現明時則無喻衆生愚暗故有此有為法若明悟則無也如翳者謂衆生自有光明於內乃為有為法所蔽如眵翳障目之光明也如燈者謂暗時則用明時則不用喻衆生愚暗故用有為法明悟則不用也幻法在前漏識修因果誰言得久長危脆同泡露如雲影電光王曰如雲影者謂聚散不常也電注在前饒經八萬劫終是落空亡楞嚴經云有十種仙皆於人中煉心不修正覺別得生理壽千萬歲妄想流轉不修三昧報盡還來散入諸趣學者觀此十仙之始末則傳頌所謂饒經八萬劫終是落空亡者亦可默俞矣應作如是觀者有為無為皆由自己心常空寂湛然清淨無纖毫停留罣礙自然無心如如不動應作如是觀也僧問雲門大師云如何是佛門云乾屎橛太平古禪師為作頌曰我佛如來乾屎橛隨機平等遍塵寰迷頭認影區區者目對慈顏似等間蟾首坐問洞山云佛真法身猶若虛空應物現形如水中月作麼生是應底道理洞云如驢覷井蟾云恁麼則正是迷頭認影洞云首坐又作麼生蟾云何不道似井覷驢也還會麼若教有意千般境才覺無心萬事休川禪師云行船盡在把梢人頌曰水中捉月鏡裏尋頭刻舟求劒騎牛覔牛空華陽焰夢幻浮漚一筆勾斷要休便休巴歌社酒村田樂不風流處也風流佛説是經已長老須菩提及諸比丘比丘尼優婆塞優婆夷一切世間天人阿修羅聞佛所説皆大歡喜信受奉行顏丙曰僧謂之比丘師姑謂之比丘尼居士謂之優婆塞道姑謂之優婆夷一切世間之人及天上之人阿修羅神乃六道中之三道也聞佛所説此經皆生大歡喜心信而承受尊奉行持佛教李文會曰夫至理無言真空無相謂都寂默也但不著言説不著知解即是無言無相金剛經之旨趣本謂此也是以旋立旋破止要諸人乃至無有少法可得即不被一切諸境所惑若得心地休歇即謂之清淨心亦謂之本來心亦謂之到彼岸亦謂之涅槃亦謂之解脫其實一也四祖問三祖云如何是古佛心祖云汝今是什麼心四祖云我今無心三祖云汝既無心諸佛豈有耶即於言下省悟此是學人標法華經云資生業等皆順正法張無盡云傅大士龐居士豈無妻子若也身處塵勞心常清淨便能轉識為智猶如握土成金一切煩惱皆是菩提一切世法皆是佛法若能如是即為在家菩薩了事凡夫豈不韙歟上根之人一聞千悟得大總持又何假如許開示耶論語所謂學而時習之不亦悅乎法華經云其不習學者不能曉了此逍遙翁曰人天路上以福為先生死海中修道為急若欲快樂人天而不植福出離生死而不明道是猶鳥無翼而欲飛木無根而欲茂奚可得又云夫英雄之士圖王不成猶得為霸馳騁之人逐鹿不成尚能得兔學大乘者設使未成猶勝人天之福古德頌曰歷劫相隨心作身幾回出沒幾因循此身不向今生度更向何時度此身幸冀勉旃莫教當靣蹉過川禪師云三十年後莫教忘却老僧不知誰是知恩者呵呵將謂無人頌曰飢得食渴得漿病得差熱得涼貧人遇寶嬰子見娘飄舟到岸孤客還鄉旱逢甘雨國有忠良四夷拱手八表來降頭頭總是物物全彰古今凡聖地獄天堂東西南北不用思量剎塵沙界諸群品盡入金剛大道場金剛般若波羅蜜經
